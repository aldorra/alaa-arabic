swer":0,"exp":"الصحيح: الخبر طلبي، وأدوات التوكيد: قد."},{"verse":"الجهلُ ضارٌّ (تقال لمن ينكر ضرر الجهل)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الخبر تنزيل خالي الذهن منزلة المتردد. وقال الثاني: الخبر جاء خالياً من التوكيد. فأيّهما كان تحليله صحيحاً؟","options":["الثاني فقط","الأول فقط","كلاهما","لا أحد منهما"],"answer":0,"exp":"الصحيح: تنزيل المنكر منزلة غير المنكر، والخبر جاء خالياً من التوكيد."},{"verse":"يقرأُ الطالبُ القصةَ.","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: المسند هو (الطالب). وقال الثاني: المسند إليه هو (الطالب). فأيّهما كان تحليله صحيحاً؟","options":["الثاني فقط","الأول فقط","كلاهما","لا أحد منهما"],"answer":0,"exp":"الصحيح: المسند (يقرأ) والمسند إليه (الطالب) والقيد (القصة)."},{"verse":"الماءُ سائلٌ عديمُ اللون والطعم والرائحة، ويتكوّن من الهيدروجين والأكسجين. (يلقيه معلم الكيمياء على التلاميذ)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الغرض لازم الفائدة. وقال الثاني: المخاطب جاهل بمضمون الخبر. فأيّهما كان تحليله صحيحاً؟","options":["الثاني فقط","الأول فقط","كلاهما","لا أحد منهما"],"answer":0,"exp":"الغرض الصحيح: فائدة الخبر، والمخاطب جاهل بمضمون الخبر."},{"verse":"وما نيلُ المطالبِ بالتمنّي *** ولكن تُؤخذُ الدنيا غِلابا (شوقي)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الغرض البلاغي هو التنزيه. وقال الثاني: الخبر خرج عن غرضه الأصلي إلى غرض بلاغي. فأيّهما كان تحليله صحيحاً؟","options":["الثاني فقط","الأول فقط","كلاهما","لا أحد منهما"],"answer":0,"exp":"الغرض الصحيح: الحث على السعي، وقد خرج الخبر فيه عن غرضيه الأصليين إلى غرض بلاغي يُفهم من السياق."},{"verse":"أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: ضرب الخبر ابتدائي. وقال الثاني: أدوات التوكيد: ألا + إنّ. فأيّهما كان تحليله صحيحاً؟","options":["الثاني فقط","الأول فقط","كلاهما","لا أحد منهما"],"answer":0,"exp":"الصحيح: الخبر إنكاري، وأدوات التوكيد: ألا + إنّ."},{"verse":"ما كلُّ ما يتمنّى المرءُ يدركُه *** تأتي الرياحُ بما لا تشتهي السفنُ (خطاب لمن لا علم له بالحكم)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الخبر تنزيل غير المنكر منزلة المنكر. وقال الثاني: الخبر جاء مؤكداً. فأيّهما كان تحليله صحيحاً؟","options":["لا أحد منهما","الأول فقط","الثاني فقط","كلاهما"],"answer":0,"exp":"الصحيح: جرى على مقتضى الظاهر، والخبر جاء خالياً من التوكيد."},{"verse":"سافرَ الأبُ مبكراً.","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: المسند هو (الأب). وقال الثاني: المسند إليه هو (سافر). فأيّهما كان تحليله صحيحاً؟","options":["لا أحد منهما","الأول فقط","الثاني فقط","كلاهما"],"answer":0,"exp":"الصحيح: المسند (سافر) والمسند إليه (الأب) والقيد (مبكراً)."},{"verse":"وأنتَ الذي ربّيتَني ونعشتَني وأنتَ الذي أوليتَني كلَّ نعمةِ. (يقوله شاعر لمن أنقذه ليُظهر عرفانه)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الغرض فائدة الخبر. وقال الثاني: المخاطب جاهل بمضمون الخبر. فأيّهما كان تحليله صحيحاً؟","options":["لا أحد منهما","الأول فقط","الثاني فقط","كلاهما"],"answer":0,"exp":"الغرض الصحيح: لازم الفائدة، والمخاطب عالم بمضمون الخبر."},{"verse":"من أعياه داؤه فعندي دواؤه، ومن استطال أجلَه فعليَّ أن أعجِّلَه (الحجاج)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الغرض البلاغي هو التحسر. وقال الثاني: الخبر جاء لإفادة المخاطب علماً يجهله فقط. فأيّهما كان تحليله صحيحاً؟","options":["لا أحد منهما","الأول فقط","الثاني فقط","كلاهما"],"answer":0,"exp":"الغرض الصحيح: التهديد، وقد خرج الخبر فيه عن غرضيه الأصليين إلى غرض بلاغي يُفهم من السياق."},{"verse":"وَالْعَصْرِ إِنَّ الْإِنسَانَ لَفِي خُسْرٍ","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: ضرب الخبر طلبي. وقال الثاني: أدوات التوكيد: قد. فأيّهما كان تحليله صحيحاً؟","options":["لا أحد منهما","الأول فقط","الثاني فقط","كلاهما"],"answer":0,"exp":"الصحيح: الخبر إنكاري، وأدوات التوكيد: القسم + إنّ + لام الابتداء."},{"verse":"ترفَّقْ أيها المولى عليهم فإنَّ الرفقَ بالجاني عتابُ (نصيحة لمولى يعاقب)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الخبر تنزيل خالي الذهن منزلة المتردد. وقال الثاني: الخبر جاء مؤكداً. فأيّهما كان تحليله صحيحاً؟","options":["كلاهما","الأول فقط","الثاني فقط","لا أحد منهما"],"answer":0,"exp":"الصحيح: تنزيل خالي الذهن منزلة المتردد، والخبر جاء مؤكداً."},{"verse":"إنَّ الصدقَ منجاةٌ.","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: المسند هو (منجاة). وقال الثاني: المسند إليه هو (الصدق). فأيّهما كان تحليله صحيحاً؟","options":["كلاهما","الأول فقط","الثاني فقط","لا أحد منهما"],"answer":0,"exp":"الصحيح: المسند (منجاة) والمسند إليه (الصدق) والقيد (إنّ)."},{"verse":"تقعُ دولةُ الكويت على الساحل الشمالي الغربي للخليج العربي. (يقوله معلم الجغرافيا لتلاميذ لا يعرفون موقعها)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الغرض فائدة الخبر. وقال الثاني: المخاطب جاهل بمضمون الخبر. فأيّهما كان تحليله صحيحاً؟","options":["كلاهما","الأول فقط","الثاني فقط","لا أحد منهما"],"answer":0,"exp":"الغرض الصحيح: فائدة الخبر، والمخاطب جاهل بمضمون الخبر."},{"verse":"حملتَ أنفاً يراه الناسُ كلّهم *** من ألفِ ميلٍ عياناً لا بمقياسِ (ابن الرومي)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الغرض البلاغي هو السخرية. وقال الثاني: الخبر خرج عن غرضه الأصلي إلى غرض بلاغي. فأيّهما كان تحليله صحيحاً؟","options":["كلاهما","الأول فقط","الثاني فقط","لا أحد منهما"],"answer":0,"exp":"الغرض الصحيح: السخرية، وقد خرج الخبر فيه عن غرضيه الأصليين إلى غرض بلاغي يُفهم من السياق."},{"verse":"ولم أرَ كالمعروفِ أمّا مذاقُه فحلوٌ","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: ضرب الخبر طلبي. وقال الثاني: أدوات التوكيد: أمّا الشرطية. فأيّهما كان تحليله صحيحاً؟","options":["كلاهما","الأول فقط","الثاني فقط","لا أحد منهما"],"answer":0,"exp":"الصحيح: الخبر طلبي، وأدوات التوكيد: أمّا الشرطية."},{"verse":"إنَّ برَّ الوالدين لواجبٌ (تقال لمن يعلم وجوبه ولا يبرّ والديه)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الخبر تنزيل المنكر منزلة غير المنكر. وقال الثاني: الخبر جاء مؤكداً. فأيّهما كان تحليله صحيحاً؟","options":["الثاني فقط","الأول فقط","كلاهما","لا أحد منهما"],"answer":0,"exp":"الصحيح: تنزيل غير المنكر منزلة المنكر، والخبر جاء مؤكداً."},{"verse":"نجحَ الطالبُ المجتهدُ.","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: المسند هو (الطالب). وقال الثاني: المسند إليه هو (الطالب). فأيّهما كان تحليله صحيحاً؟","options":["الثاني فقط","الأول فقط","كلاهما","لا أحد منهما"],"answer":0,"exp":"الصحيح: المسند (نجح) والمسند إليه (الطالب) والقيد (المجتهد)."},{"verse":"علّمتَني سُبُلَ الرشادِ وقدتَني للمكرُماتِ وكنتَ لي نِعمَ الأبُ. (يقوله شاعر لمعلمه الذي يعلم فضله عليه)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الغرض فائدة الخبر. وقال الثاني: المخاطب عالم بمضمون الخبر. فأيّهما كان تحليله صحيحاً؟","options":["الثاني فقط","الأول فقط","كلاهما","لا أحد منهما"],"answer":0,"exp":"الغرض الصحيح: لازم الفائدة، والمخاطب عالم بمضمون الخبر."},{"verse":"إنّ شرَّ الجُناةِ في الأرضِ نفسٌ *** تتوقّى قبلَ الرحيلِ الرحيلا (أبو ماضي)","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: الغرض البلاغي هو التنزيه. وقال الثاني: الخبر خرج عن غرضه الأصلي إلى غرض بلاغي. فأيّهما كان تحليله صحيحاً؟","options":["الثاني فقط","الأول فقط","كلاهما","لا أحد منهما"],"answer":0,"exp":"الغرض الصحيح: النصح، وقد خرج الخبر فيه عن غرضيه الأصليين إلى غرض بلاغي يُفهم من السياق."},{"verse":"إِنَّ الْإِنْسَانَ لِرَبِّهِ لَكَنُودٌ","q":"سؤال مقالي (اختر الإجابة النموذجية): حلّل طالبان الخبر السابق؛ فقال الأول: ضرب الخبر طلبي. وقال الثاني: أدوات التوكيد: إنّ + لام الابتداء. فأيّهما كان تحليله صحيحاً؟","options":["الثاني فقط","الأول فقط","كلاهما","لا أحد منهما"],"answer":0,"exp":"الصحيح: الخبر إنكاري، وأدوات التوكيد: إنّ + لام الابتداء."}],"et":[{"verse":"من نص (مفتاح شخصية عمر): «أثرها كالشمس الطالعةِ تروِّعُنا بإشراقِها في أوقاتِها وبروجِها»","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «أثرها كالشمس الطالعةِ تروِّعُنا بإشراقِها في أوقاتِها وبروجِها».","options":["تبرز الوضوح والجلال في شخصية عمر","تبرز تجذّر صفة النظام في كل تفاصيل حياته","يبرز مدى الحيرة في أفعال العظماء قبل فهم دوافعهم الحقيقية","تبرز أهمية هذا المفتاح في فهم دوافع العظماء"],"exp":"النوع: تشبيه. شبّه انتظام عمل الشخصية العظيمة بانتظام شروق الشمس. الأثر: تبرز الوضوح والجلال في شخصية عمر.","answer":0},{"verse":"فهَلْ يَسْتَوِي ماءان أخضرُ زاخِرٌ ... وحسي ظنونٌ ماؤهُ غيرُ فاضلِ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «ماءان: أخضرُ زاخِرٌ / وحسي ظنونٌ».","options":["تبرز التناقض الشاسع بين نقاء المؤمنين وفساد الكافرين","تبرز هول المعركة وشدتها","توضح رضا الشاعر بالقضاء والقدر","يحدث جرساً موسيقياً يطرب الآذان"],"exp":"النوع: استعارة تصريحية. شبّه جيل الصحابة بالماء الغزير النقي (أخضر زاخر)، وشبّه الكفار بالماء القليل العكر (حسي ظنون)، فحذف المشبه وصرّح بالمشبه به. الأثر: تبرز التناقض الشاسع بين نقاء المؤمنين وفساد الكافرين.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «روح الأمة»","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «روح الأمة».","options":["تبرز حيوية الأمة وترابطها","تبرز قسوة الاستعباد وتضييقه على الحريات","تبرز للقارئ خيارين مصيريين متناقضين لتوضيح النتيجة","تبرز القوة والعزة والتشخيص"],"exp":"النوع: استعارة مكنية. شبّه الأمة بإنسان له روح، فحذف المشبه به (الإنسان) وأبقى شيئاً من لوازمه (الروح). الأثر: تبرز حيوية الأمة وترابطها.","answer":0},{"verse":"قال تعالى: ﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَكُم مِّن تُرَابٍ ثُمَّ إِذَا أَنتُم بَشَرٌ تَنتَشِرُونَ﴾","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «ثُمَّ إِذَا أَنتُم بَشَرٌ تَنتَشِرُونَ».","options":["الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","يحدث جرساً موسيقياً يطرب الآذان","يبرز المعنى ويوضحه ويقويه بالتضاد","تقريب الصورة إلى الذهن بتشبيه حسي مألوف"],"exp":"النوع: كناية. كناية عن إعمار الأرض. الأثر: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"قَد كانَ مُضطَلِعاً بِالخَطبِ يَحمِلُهُ ... فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ».","options":["تعبّر عن قسوة الفراق وتأثيره المهلك","تجسّد قسوة الحياة وصعوبة نيل الغايات","يبرز شدة تمسكه بالأمل في اللقاء بعد ألم البعد","تبرز قيمة الزوجة والحياة المستقرة التي ضيّعها وشدة حسرته"],"exp":"النوع: استعارة مكنية. شبّه خطوب البين (مصائب الفراق) بأحمال ثقيلة تكسر أضلاعه، فحذف المشبه به وأبقى شيئاً من لوازمه. الأثر: تعبّر عن قسوة الفراق وتأثيره المهلك.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «الشخصية المنقوصة … الشخصية الكاملة»","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للمحسن البديعي في: «المنقوصة / الكاملة».","options":["يبرز الفارق الجوهري بين نوعي الشخصيات","تبرز تعقيد الخلافات وكثرتها","تصور الحزن والأسى على فراق الأحبة","تبرز الوضوح والجلال في شخصية عمر"],"exp":"النوع: طباق إيجاب. جمع بين لفظين متضادين هما (المنقوصة) و(الكاملة). الأثر: يبرز الفارق الجوهري بين نوعي الشخصيات. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"لنا جبلٌ يعلو الجبالَ مُشرف ... فنحنُ بأعلى فرعِهِ المُتطاولِ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «لنا جبلٌ يعلو الجبالَ».","options":["تبرز وتوحي بالثبات والرسوخ وتجسّد المجد في صورة مادية","توضح المكانة العظيمة للأنصار واستحالة لحاق الخصوم بهم","تبرز هول المعركة وشدتها","توضح رضا الشاعر بالقضاء والقدر"],"exp":"النوع: استعارة تصريحية. شبّه العز والمجد والمكانة العظيمة للأنصار بالجبل الشامخ، فحذف المشبه وصرّح بالمشبه به. الأثر: تبرز وتوحي بالثبات والرسوخ وتجسّد المجد في صورة مادية.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «فإنَّ روحَ الاستعبادِ ضيقٌ لا يتسعُ»","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «روح الاستعباد ضيق لا يتسع».","options":["تبرز قسوة الاستعباد وتضييقه على الحريات","يبرز استمرارية تأثير العادات","تبرز دور الدين الفعّال في إحياء المجتمعات","تبرز خلود الأعمال العظيمة في ذاكرة التاريخ"],"exp":"النوع: استعارة مكنية. شبّه الاستعباد بإنسان له روح ضيقة، فحذف المشبه به وأبقى شيئاً من لوازمه (الروح). الأثر: تبرز قسوة الاستعباد وتضييقه على الحريات.","answer":0},{"verse":"قال تعالى: ﴿وَهُوَ الَّذِي يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ﴾","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «وَهُوَ أَهْوَنُ عَلَيْهِ».","options":["الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","يحدث جرساً موسيقياً يطرب الآذان","يبرز المعنى ويوضحه ويقويه بالتضاد","تقريب الصورة إلى الذهن بتشبيه حسي مألوف"],"exp":"النوع: كناية. كناية عن كمال القدرة المطلقة وسهولة البعث. الأثر: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"تَأبى المَطالِبُ إِلّا أَن تَكَلَّفَهُ ... لِلرِّزقِ سَعياً وَلَكِن لَيسَ يَجمَعُهُ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «تَأبى المَطالِبُ إِلّا أَن تُكَلِّفَهُ».","options":["تجسّد قسوة الحياة وصعوبة نيل الغايات","تبرز التحذير الشديد من الطمع وتجسّد نهايته المأساوية","يحدث جرساً موسيقياً يطرب الآذان","تبرز فخره بنفسه واعتزازه بقومه"],"exp":"النوع: استعارة مكنية. شبّه المطالب (الآمال) بإنسان معاند يرفض ويكلّفه بالمشاق، فحذف المشبه به وأبقى شيئاً من لوازمه. الأثر: تجسّد قسوة الحياة وصعوبة نيل الغايات.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «يقطعُ اللجاجةَ وينهضُ بالحجَّةِ»","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «يقطعُ اللجاجةَ وينهضُ بالحجَّةِ».","options":["تبرز الحسم والقوة والوضوح في قضاء عمر","تبرز اتساع علمه بالشعر وروايته","يؤكد أن مفتاح الشخصية أعمق بكثير من هذه المظاهر السطحية","تبرز تجذّر صفة النظام في كل تفاصيل حياته"],"exp":"النوع: استعارة مكنية. شبّه اللجاجة (الخصومة) بشيء مادي يُقطع، وشبّه الحجة بإنسان ينهض، وحذف المشبه به في الاثنتين. الأثر: تبرز الحسم والقوة والوضوح في قضاء عمر.","answer":0},{"verse":"تناولْ سهيلاً في السَّماءِ فهاتِهِ ... ستدركُنا إن نلْتَهُ بالأنامِلِ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «تناولْ سهيلاً في السَّماءِ فهاتِهِ».","options":["الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","يحدث جرساً موسيقياً يطرب الآذان","يبرز المعنى ويوضحه ويقويه بالتضاد","تقريب الصورة إلى الذهن بتشبيه حسي مألوف"],"exp":"النوع: كناية. كناية عن استحالة بلوغ مجدهم. الأثر: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «والحُكْمُ على ماضيهم بالقَتْلِ مَحْواً ونِسياناً»","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «الحكم على ماضيهم بالقتل محواً ونسياناً».","options":["تبرز بشاعة الاستعمار في محو الذاكرة التاريخية","تبرز السيطرة المطلقة للمستعمر على مصير الأمة","تبرز حالة الفوضى والاضطراب عند ضعف الدين","تصوّر جمال الطبيعة وروعة مناظرها"],"exp":"النوع: استعارة مكنية. شبّه الماضي بكائن حي يُقتل، فحذف المشبه به وأبقى شيئاً من لوازمه (القتل). الأثر: تبرز بشاعة الاستعمار في محو الذاكرة التاريخية.","answer":0},{"verse":"قال تعالى: ﴿وَمِنْ آيَاتِهِ يُرِيكُمُ الْبَرْقَ خَوْفًا وَطَمَعًا﴾","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للمحسن البديعي في: «خَوْفًا / طَمَعًا».","options":["تبرز قدرة الله وتقلب المشاعر أمام البرق","تبين فضل العلم على الجهل","تبرز قدرة الله وإحاطته بالحالات كلها","تصوّر شدة العذاب وهول يوم القيامة"],"exp":"النوع: طباق إيجاب. جمع بين لفظين متضادين هما (خَوْفًا) و(طَمَعًا). الأثر: تبرز قدرة الله وتقلب المشاعر أمام البرق. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"عَلَّ اللَيالي الَّتي أَضنَت بِفُرقَتِنا ... جِسمي سَتَجمَعُني يَوماً وَتَجمَعُهُ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للمحسن البديعي في: «فُرقَتِنا / تَجمَعُهُ».","options":["يبرز شدة تمسكه بالأمل في اللقاء بعد ألم البعد","توضح قوة إيمانه ويقينه بالبعث والحساب","يبرز الفجوة بين ما يحتاجه (الرفق) وما يلقاه (القسوة)","تجسّد قسوة الحياة وصعوبة نيل الغايات"],"exp":"النوع: طباق إيجاب. جمع بين لفظين متضادين هما الفرقة والجمع. الأثر: يبرز شدة تمسكه بالأمل في اللقاء بعد ألم البعد. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «الكرم أم البخل، الرفعة أم الخسة، الشجاعة أم الجبن، اللوم أو الثناء»","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للمحسن البديعي في: «الكرم / البخل ، الشجاعة / الجبن».","options":["يبرز مدى الحيرة في أفعال العظماء قبل فهم دوافعهم الحقيقية","تبرز صعوبة فهم الشخصيات دون معرفة المفتاح الذي يحرّكها","يبرز الفارق الجوهري بين نوعي الشخصيات","تبرز تعقيد الخلافات وكثرتها"],"exp":"النوع: طباق إيجاب. جمع بين أزواج من الألفاظ المتضادة. الأثر: يبرز مدى الحيرة في أفعال العظماء قبل فهم دوافعهم الحقيقية. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"ويومَ قُرَيْشٍ إذ أتَوْنا بجمعِهِمْ ... وطِئْنَا العَدُوَّ وطأةً المُتثاقلِ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «وطِئْنَا العَدُوَّ وطأةً المُتثاقلِ».","options":["الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","يحدث جرساً موسيقياً يطرب الآذان","يبرز المعنى ويوضحه ويقويه بالتضاد","تقريب الصورة إلى الذهن بتشبيه حسي مألوف"],"exp":"النوع: كناية. كناية عن قوة البطش والفتك. الأثر: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «أيقظ ضمير الأمة، وتنبيه روحها»","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «أيقظ ضمير الأمة».","options":["تبرز دور الدين الفعّال في إحياء المجتمعات","تبرز بشاعة التنكر للهوية","الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","يبرز التناقض بين المظهر الشكلي للأمة وجوهرها الروحي الخفي"],"exp":"النوع: استعارة مكنية. شبّه الأمة بإنسان له ضمير يُوقَظ وروح تُنبَّه، فحذف المشبه به وأبقى شيئاً من لوازمه. الأثر: تبرز دور الدين الفعّال في إحياء المجتمعات.","answer":0},{"verse":"قال تعالى: ﴿وَلَهُ الْحَمْدُ فِي السَّمَاوَاتِ وَالْأَرْضِ وَعَشِيًّا وَحِينَ تُظْهِرُونَ﴾","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للمحسن البديعي في: «عَشِيًّا / تُظْهِرُونَ».","options":["تبرز قدرة الله وضرورة حمده في الزمان كله","تبرز قدرة الله وإحاطته بالمكان","تبرز وتوضح عدل الله سبحانه وتعالى","تبرز قدرة الله وتقلب المشاعر أمام البرق"],"exp":"النوع: طباق إيجاب. جمع بين لفظين متضادين هما (عَشِيًّا) و(تُظْهِرُونَ). الأثر: تبرز قدرة الله وضرورة حمده في الزمان كله. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"أعطيتُ مُلكاً فَلَم أَحسِن سِياسَتَهُ ... وَكُلُّ مَن لا يَسوسُ المُلكَ يَخلَعُهُ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «أُعطيتُ مُلكاً فَلَم أُحسِن سِياسَتَهُ».","options":["تبرز قيمة الزوجة والحياة المستقرة التي ضيّعها وشدة حسرته","يبرز التحول السريع والمخيف من النعيم إلى الفقر","تبرز خضوع الإنسان لتقلبات الأيام وعجزه أمامها","الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم"],"exp":"النوع: استعارة تصريحية. شبّه (الزوجة والحياة الهانئة في بغداد) بـ (الملك)، فحذف المشبه وصرّح بالمشبه به. الأثر: تبرز قيمة الزوجة والحياة المستقرة التي ضيّعها وشدة حسرته.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «بيت شامخ عليه باب مكين … وبيت ضئيل عليه باب مزعزع»","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للمحسن البديعي في: «بيت شامخ عليه باب مكين … وبيت ضئيل عليه باب مزعزع».","options":["تبرز التناقض بين وضوح الشخصيات العظيمة وغموض وتقلب الشخصيات التافهة","يبرز الفارق الجوهري بين نوعي الشخصيات","تبرز تعقيد الخلافات وكثرتها","تصور الحزن والأسى على فراق الأحبة"],"exp":"النوع: مقابلة. قابل بين صورتين متقابلتين: (شامخ/مكين) في مقابل (ضئيل/مزعزع). الأثر: تبرز التناقض بين وضوح الشخصيات العظيمة وغموض وتقلب الشخصيات التافهة. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"ومنْ خير حيٍّ تعلمونَ لجارهِمِ ... إذا اختارَهُم في الأمنِ أو في الزَّلازلِ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للمحسن البديعي في: «الأمن / الزلازل».","options":["يوضح المعنى ويؤكد ثبات المسلمين وحسن معاملتهم وحمايتهم لجارهم في الرخاء والشدائد","تبرز عظمة مجد الأنصار ورفعته","تبرز تحقير الخصم وتجسّد الفارق الشاسع في الرفعة","تصوّر حزن الشاعر على فراق الأحبة"],"exp":"النوع: طباق إيجاب. جمع بين (الأمن) و(الزلازل) وهما متقابلان في المعنى. الأثر: يوضح المعنى ويؤكد ثبات المسلمين وحسن معاملتهم وحمايتهم لجارهم في الرخاء والشدائد. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «وهو الرجل الذي ينفجر في التاريخ كلما احتاجت الحياة الوطنية إلى إطلاق قنابلها للنصر»","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «ينفجر في التاريخ … إطلاق قنابلها للنصر».","options":["تبرز القوة والأثر للرجل المتمسك بمبادئه في نصرة أمته","تبرز حالة الفوضى والاضطراب عند ضعف الدين","تبرز سعة علم الكاتب وتنوع ثقافته","تبرز حيوية الأمة وترابطها"],"exp":"النوع: استعارة مكنية. شبّه الرجل العظيم المستقل بقنبلة تنفجر، فحذف المشبه به وأبقى شيئاً من لوازمه (ينفجر). الأثر: تبرز القوة والأثر للرجل المتمسك بمبادئه في نصرة أمته.","answer":0},{"verse":"قال تعالى: ﴿فَأَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَهُمْ فِي رَوْضَةٍ يُحْبَرُونَ (15) وَأَمَّا الَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا وَلِقَاءِ الْآخِرَةِ فَأُولَٰئِكَ فِي الْعَذَابِ مُحْضَرُونَ (16)﴾","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للمحسن البديعي في: «فَأَمَّا الَّذِينَ آمَنُوا … فَهُمْ فِي رَوْضَةٍ يُحْبَرُونَ (15) وَأَمَّا الَّذِينَ كَفَرُوا … فَأُولَٰئِكَ فِي الْعَذَابِ مُحْضَرُونَ (16)».","options":["تبرز وتوضح عدل الله سبحانه وتعالى","تبرز عظمة الإنسان وقدرته على العمل والإنتاج","تبرز قدرة الله وإحاطته بالحالات كلها","تبرز قدرة الله وضرورة حمده في الزمان كله"],"exp":"النوع: مقابلة. قابل بين صورة المؤمنين وعملهم ومصيرهم، وصورة الكافرين وعملهم ومصيرهم. الأثر: تبرز وتوضح عدل الله سبحانه وتعالى. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"وَمَن غَدا لابِساً ثَوبَ النّعيمِ بِلا ... شُكرٍ عَلَيهِ فَعنَّه اللَهَ يَنزِعُهُ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن الأثر الفني للصورة في قوله: «ثَوبَ النّعيمِ».","options":["تبرز وتجسّد إحاطة النعمة بصاحبها كأنها تغطيه","الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","يبرز المفارقة؛ فالزوجة تريد النفع فإذا بها تضرّه","تبرز أنه مسلوب الإرادة وأن السفر أصبح يطارده"],"exp":"النوع: تشبيه بليغ. شبّه النعيم بالثوب بحذف الأداة ووجه الشبه (تشبيه بليغ). الأثر: تبرز وتجسّد إحاطة النعمة بصاحبها كأنها تغطيه.","answer":0}],"ea":[{"verse":"يقرأُ الطالبُ القصةَ.","q":"سؤال مقالي (اختر الإجابة النموذجية): أيّ التحليلات الآتية يمثل الصورة التركيبية الصحيحة للجملة؟","options":["المسند: يقرأ — المسند إليه: الطالب — القيد: القصة","المسند: الطالب — المسند إليه: يقرأ — القيد: القصة","المسند: يقرأ — المسند إليه: الطالب — القيد: من ينصره","المسند: يقرأ — المسند إليه: الله — القيد: القصة"],"answer":0,"exp":"الجملة فعلية؛ المسند: يقرأ — المسند إليه: الطالب — القيد: القصة."},{"verse":"وأنتَ الذي ربّيتَني ونعشتَني وأنتَ الذي أوليتَني كلَّ نعمةِ.","q":"سؤال مقالي (اختر الإجابة النموذجية): ما الذي استفاده المخاطب من الخبر السابق؟ (يقوله شاعر لمن أنقذه ليُظهر عرفانه)","options":["أن المتكلم عالم بـإحسان المخاطب إلى المتكلم","علماً جديداً بـإحسان المخاطب إلى المتكلم لم يكن يعلمه","حثاً على السعي والجد","استعطافاً ورجاء للعفو"],"answer":0,"exp":"يقوله شاعر لمن أنقذه ليُظهر عرفانه؛ فالغرض لازم الفائدة، والمخاطب لم يستفد علماً جديداً وإنما عرف أن المتكلم عالم به."},{"verse":"يفوتُ ضجيجَ الترّهاتِ طِلابُه *** ويدنو إلى الحاجاتِ من باتَ ساعيا (ابن نباتة)","q":"سؤال مقالي (اختر الإجابة النموذجية): ما الذي يدل على الغرض البلاغي للخبر في هذا الشاهد؟","options":["يحثّ على السعي لنيل الحاجات","يرفع الممدوح فوق الملوك كما تعلو الشمس الكواكب","يثني على جود الممدوح الذي لا ينفد","يُظهر وهنه وكبر سنه لربه"],"answer":0,"exp":"السياق يدل على الغرض؛ إذ إن قائله يحثّ على السعي لنيل الحاجات، فالغرض: الحث على السعي."},{"verse":"أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ","q":"سؤال مقالي (اختر الإجابة النموذجية): حدّد أدوات التوكيد في الخبر السابق.","options":["ألا + إنّ","الباء الزائدة","أمّا الشرطية","إنّ + لام الابتداء"],"answer":0,"exp":"أداة التوكيد هي: ألا + إنّ، فالخبر إنكاري."},{"verse":"وَمَا أُبَرِّئُ نَفْسِي إِنَّ النَّفْسَ لَأَمَّارَةٌ بِالسُّوءِ","q":"سؤال مقالي (اختر الإجابة النموذجية): علّل الحالة التي جاء عليها الخبر السابق. (كلام يوسف عليه السلام)","options":["نُزِّل خالي الذهن منزلة المتردد لأن ما تقدّم الخبر أثار في نفسه تساؤلاً","نُزِّل غير المنكر منزلة المنكر لظهور أمارات الإنكار عليه","نُزِّل المنكر منزلة غير المنكر لأن بين يديه أدلة واضحة يتجاهلها","جرى على مقتضى الظاهر لأن المخاطب خالي الذهن فأُلقي الخبر بلا توكيد"],"answer":0,"exp":"قوله (وما أبرئ نفسي) يجعل السامع يتساءل عن علة ذلك؛ نُزِّل خالي الذهن منزلة المتردد لأن ما تقدّم الخبر أثار في نفسه تساؤلاً."},{"verse":"يقرأُ الطالبُ القصةَ.","q":"سؤال مقالي (اختر الإجابة النموذجية): حدّد المسند في الجملة السابقة.","options":["يقرأ","الطالب","القصة","يعلم"],"answer":0,"exp":"الجملة فعلية؛ المسند: يقرأ، والمسند إليه: الطالب، والقيد: القصة."},{"verse":"تقعُ دولةُ الكويت على الساحل الشمالي الغربي للخليج العربي.","q":"سؤال مقالي (اختر الإجابة النموذجية): حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله معلم الجغرافيا لتلاميذ لا يعرفون موقعها.","options":["فائدة الخبر","لازم الفائدة","الفخر","المدح"],"answer":0,"exp":"يقوله معلم الجغرافيا لتلاميذ لا يعرفون موقعها؛ فالمخاطب يجهل موقع الكويت، فالغرض: فائدة الخبر."},{"verse":"وما نيلُ المطالبِ بالتمنّي *** ولكن تُؤخذُ الدنيا غِلابا (شوقي)","q":"سؤال مقالي (اختر الإجابة النموذجية): حدّد الغرض البلاغي للخبر في هذا الشاهد.","options":["الحث على السعي","النصح","التنزيه","الفخر"],"answer":0,"exp":"يحثّ على الجد والعمل لا التمني؛ فالغرض البلاغي هو: الحث على السعي."},{"verse":"صلاحُ أمرِكَ للأخلاقِ مرجعُه (شوقي)","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن ضرب الخبر في الجملة السابقة.","options":["ابتدائي","طلبي","إنكاري","الأصلي"],"answer":0,"exp":"الجملة خالية من أدوات التوكيد؛ فالخبر ابتدائي."},{"verse":"الجهلُ ضارٌّ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن: هل جرى الخبر على مقتضى الظاهر أم خرج عنه؟ (تقال لمن ينكر ضرر الجهل)","options":["تنزيل المنكر منزلة غير المنكر","تنزيل خالي الذهن منزلة المتردد","تنزيل غير المنكر منزلة المنكر","جرى على مقتضى الظاهر"],"answer":0,"exp":"نُزِّل المنكر منزلة غير المنكر لأن بين يديه أدلة واضحة يتجاهلها."},{"verse":"إنَّ الصدقَ منجاةٌ.","q":"سؤال مقالي (اختر الإجابة النموذجية): أيّ التحليلات الآتية يمثل الصورة التركيبية الصحيحة للجملة؟","options":["المسند: منجاة — المسند إليه: الصدق — القيد: إنّ","المسند: الصدق — المسند إليه: منجاة — القيد: إنّ","المسند: منجاة — المسند إليه: الصدق — القيد: القصة","المسند: منجاة — المسند إليه: الطالب — القيد: إنّ"],"answer":0,"exp":"الجملة اسمية؛ المسند: منجاة — المسند إليه: الصدق — القيد: إنّ."},{"verse":"علّمتَني سُبُلَ الرشادِ وقدتَني للمكرُماتِ وكنتَ لي نِعمَ الأبُ.","q":"سؤال مقالي (اختر الإجابة النموذجية): ما الذي استفاده المخاطب من الخبر السابق؟ (يقوله شاعر لمعلمه الذي يعلم فضله عليه)","options":["أن المتكلم عالم بـفضل المعلم على تلميذه","علماً جديداً بـفضل المعلم على تلميذه لم يكن يعلمه","رغبةً في الاعتذار منه","خوفاً من تهديد المتكلم"],"answer":0,"exp":"يقوله شاعر لمعلمه الذي يعلم فضله عليه؛ فالغرض لازم الفائدة، والمخاطب لم يستفد علماً جديداً وإنما عرف أن المتكلم عالم به."},{"verse":"هو البحرُ من أيّ النواحي أتيتَه *** فلُجّتُه المعروفُ والجودُ ساحلُه","q":"سؤال مقالي (اختر الإجابة النموذجية): ما الذي يدل على الغرض البلاغي للخبر في هذا الشاهد؟","options":["يثني على جود الممدوح الذي لا ينفد","يتوعد المخالفين بالقتل والعقاب","يسخر من كبر أنف الرجل","ينصح بترك التشاؤم وإبصار الجمال"],"answer":0,"exp":"السياق يدل على الغرض؛ إذ إن قائله يثني على جود الممدوح الذي لا ينفد، فالغرض: المدح."},{"verse":"ولقد نهزتُ مع الغواةِ بدلوهم","q":"سؤال مقالي (اختر الإجابة النموذجية): حدّد أدوات التوكيد في الخبر السابق.","options":["لام القسم + قد","ألا + إنّ","إنّ + لام الابتداء + ضمير الفصل","قد"],"answer":0,"exp":"أداة التوكيد هي: لام القسم + قد، فالخبر إنكاري."},{"verse":"العلمُ نافعٌ","q":"سؤال مقالي (اختر الإجابة النموذجية): علّل الحالة التي جاء عليها الخبر السابق. (تقال لمن يجحد فضل العلم)","options":["نُزِّل المنكر منزلة غير المنكر لأن بين يديه أدلة واضحة يتجاهلها","نُزِّل خالي الذهن منزلة المتردد لأن ما تقدّم الخبر أثار في نفسه تساؤلاً","نُزِّل غير المنكر منزلة المنكر لظهور أمارات الإنكار عليه","جرى على مقتضى الظاهر لأن المخاطب خالي الذهن فأُلقي الخبر بلا توكيد"],"answer":0,"exp":"آثار العلم الحميدة بادية لكل ذي إدراك فلا حاجة إلى توكيد؛ نُزِّل المنكر منزلة غير المنكر لأن بين يديه أدلة واضحة يتجاهلها."},{"verse":"إنَّ الصدقَ منجاةٌ.","q":"سؤال مقالي (اختر الإجابة النموذجية): حدّد القيد في الجملة السابقة.","options":["إنّ","منجاة","الصدق","ما بين أيدينا وما خلفنا"],"answer":0,"exp":"الجملة اسمية؛ المسند: منجاة، والمسند إليه: الصدق، والقيد: إنّ."},{"verse":"تنقسمُ الكلمةُ في العربية إلى ثلاثة أقسام: اسم وفعل وحرف.","q":"سؤال مقالي (اختر الإجابة النموذجية): حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله معلم النحو لتلاميذ في أول درس.","options":["فائدة الخبر","لازم الفائدة","النصح","السخرية"],"answer":0,"exp":"يقوله معلم النحو لتلاميذ في أول درس؛ فالمخاطب يجهل أقسام الكلمة، فالغرض: فائدة الخبر."},{"verse":"حملتَ أنفاً يراه الناسُ كلّهم *** من ألفِ ميلٍ عياناً لا بمقياسِ (ابن الرومي)","q":"سؤال مقالي (اختر الإجابة النموذجية): حدّد الغرض البلاغي للخبر في هذا الشاهد.","options":["السخرية","إظهار الضعف","الحث على السعي","التهديد"],"answer":0,"exp":"يسخر من كبر أنف الرجل؛ فالغرض البلاغي هو: السخرية."},{"verse":"فَوَرَبِّ السَّمَاءِ وَالْأَرْضِ إِنَّهُ لَحَقٌّ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن ضرب الخبر في الجملة السابقة.","options":["إنكاري","ابتدائي","طلبي","الأصلي"],"answer":0,"exp":"الجملة مؤكدة بـ(القسم + إنّ + لام الابتداء)؛ فالخبر إنكاري."},{"verse":"ترفَّقْ أيها المولى عليهم فإنَّ الرفقَ بالجاني عتابُ","q":"سؤال مقالي (اختر الإجابة النموذجية): بيّن: هل جرى الخبر على مقتضى الظاهر أم خرج عنه؟ (نصيحة لمولى يعاقب)","options":["تنزيل خالي الذهن منزلة المتردد","تنزيل غير المنكر منزلة المنكر","تنزيل المنكر منزلة غير المنكر","جرى على مقتضى الظاهر"],"answer":0,"exp":"نُزِّل خالي الذهن منزلة المتردد لأن ما تقدّم الخبر أثار في نفسه تساؤلاً."},{"verse":"أصبحَ العلمُ مطلباً ضرورياً.","q":"سؤال مقالي (اختر الإجابة النموذجية): أيّ التحليلات الآتية يمثل الصورة التركيبية الصحيحة للجملة؟","options":["المسند: مطلباً — المسند إليه: الع  تساؤلاً."}],"er":[{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): أي مما يأتي ليس من الغرضين الأصليين للخبر؟","options":["الفخر","فائدة الخبر","لازم الفائدة","إفادة المخاطب علماً بالحكم"],"answer":0,"exp":"الفخر غرض بلاغي يخرج إليه الخبر بدلالة السياق، وليس غرضاً أصلياً."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): الغرض الذي يطلب فيه المتكلم عفو من هو أقوى منه ورحمته:","options":["الاسترحام والاستعطاف","الفخر والاعتزاز","التهديد والوعيد","النصح والإرشاد"],"answer":0,"exp":"كقول إبراهيم بن المهدي للمأمون: «وأنت للعفو أهل»."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): حكم توكيد الخبر الطلبي:","options":["يحسن توكيده","يجب توكيده بأكثر من مؤكد","لا يجوز توكيده أبداً","يُلقى خالياً من التوكيد"],"answer":0,"exp":"المتردد يحسن توكيد الخبر له ليتمكن من نفسه."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): يُنزَّل المنكر منزلة غير المنكر حين:","options":["تكون بين يديه أدلة واضحة لو تأملها لتراجع","تظهر عليه أمارات الإنكار","يكون متردداً يطلب اليقين","يكون خالي الذهن من الحكم"],"answer":0,"exp":"فيُلقى إليه الخبر خالياً من التوكيد."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): المسند في الجملة الاسمية هو:","options":["الخبر","المبتدأ","النعت","المفعول به"],"answer":0,"exp":"الخبر مسند أو خبر الناسخ (خبر كان وخبر إنّ)."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): ماذا يستفيد المخاطب في لازم الفائدة؟","options":["أن المتكلم عالم بالحكم","علماً جديداً لم يكن يعرفه بالحكم","تصديق الخبر بتأكيده بالقسم","ثقة تامة بأن الخبر صحيح"],"answer":0,"exp":"المخاطب لا يستفيد علماً بالخبر لأنه يعلمه، وإنما يعلم أن المتكلم عالم به."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): الغرض الذي يظهر فيه المتكلم وهنه وعجزه أمام الآخرين:","options":["إظهار الضعف","الحث على السعي","السخرية","التنزيه"],"answer":0,"exp":"كقول زكريا عليه السلام: «وهن العظم مني واشتعل الرأس شيباً»."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): أي مما يأتي ليس من أدوات توكيد الخبر؟","options":["همزة الاستفهام","لام الابتداء","نونا التوكيد","ضمير زم الفائدة غالباً في مواضع:","options":["المدح واللوم والعتاب وما أشبهها","نقل الأخبار العلمية الجديدة","تعليم التلاميذ حقائق لم يعرفوها","إلقاء نشرات الأخبار على المستمعين"],"answer":0,"exp":"يأتي لازم الفائدة حين يخبر شخص آخر بعمل يعلمه الآخر ليبين أنه عالم به كالمدح واللوم والعتاب."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): يُعرف الغرض البلاغي للخبر من:","options":["السياق وقرائن الأحوال","أدوات التوكيد في الجملة","عدد كلمات الجملة","ضبط أواخر الكلمات"],"answer":0,"exp":"الأغراض البلاغية تفهم من السياق وقرائن الأحوال لا من شكل الجملة وحده."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): من أدوات توكيد الخبر التي تخصص المضارع للاستقبال:","options":["السين","قد","لام الابتداء","أمّا"],"answer":0,"exp":"السين تخصص المضارع للاستقبال وتفيد التوكيد."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): بلاغة الخبر تتحقق بـ:","options":["مطابقته لحال السامعين","كثرة مؤكداته دائماً","خلوّه من المؤكدات دائماً","قصر ألفاظه فقط"],"answer":0,"exp":"سواء جرى على مقتضى الظاهر أم خرج عنه لقرينة."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): خبر كان في الجملة الخبرية يعدّ:","options":["مسنداً","مسنداً إليه","قيداً","مضافاً إليه"],"answer":0,"exp":"خبر الفعل الناسخ مسند، واسمه مسند إليه."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): إذا قال تلميذ لمعلمه قاعدة شرحها له، فالغرض الأصلي لخبره:","options":["لازم الفائدة، لأن المعلم يعلمها","فائدة الخبر، لأن المعلم يجهلها","لازم الفائدة، لأن التلميذ يجهلها","فائدة الخبر، لأن التلميذ يعلمها"],"answer":0,"exp":"المعلم يعلم القاعدة، والتلميذ يُظهر له علمه بها فقط."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): الثناء على الغير بذكر محاسنه كرماً وشجاعة غرضه:","options":["المدح","التحسر","الاسترحام","إظهار الضعف"],"answer":0,"exp":"كقول زهير: «وأبيض فياض يداه غمامة»."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): الخبر الذي يُلقى خالياً من التوكيد هو الخبر:","options":["الابتدائي","الطلبي","الإنكاري","الطلبي والإنكاري معاً"],"answer":0,"exp":"الابتدائي لخالي الذهن، فلا يحتاج إلى مؤكد."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): الخبر المؤكد الذي يُلقى لخالي الذهن بعد جملة تثير تساؤله خرج عن:","options":["مقتضى الظاهر","الغرض الأصلي كله","أضرب الخبر الثلاثة","الصورة التركيبية"],"answer":0,"exp":"فقد نُزِّل خالي الذهن منزلة المتردد."},{"verse":"","q":"سؤال مقالي (اختر الإجابة النموذجية): حروف النفي وأدوات الشرط في تركيب الجملة تعدّ:","options":["قيوداً","مسنداً","مسنداً إليه","مضافاً إليه"],"answer":0,"exp":"مما زاد على المسند والمسند إليه فهو قيد."}]}},"past":{"title":"أسئلة اختبارات سابقة","icon":"fa-clock-rotate-left","mix":{"p":4},"pool":{"p":[{"verse":"وكنّا متى يغزو النبيُّ قبيلةً *** نصلْ حافتيه بالقَنا والقَنابلِ (حسان بن ثابت)","q":"[اختبار 2025–2026م] حدّد المحسن البديعي المخطوط تحته في البيت: (القَنا / القَنابِلِ).","options":["جناس ناقص","طباق إيجاب","مقابلة","سجع"],"answer":0,"exp":"(القَنا / القَنابِلِ) جناس ناقص؛ تشابه اللفظان في الحروف واختلفا في المعنى مع زيادة حروف، وأثره: يحدث جرساً موسيقياً يطرب الآذان"},{"verse":"وكنّا متى يغزو النبيُّ قبيلةً *** نصلْ حافتيه بالقَنا والقَنابلِ (حسان بن ثابت)","q":"[اختبار 2025–2026م] بيّن الأثر الفني لهذا المحسن البديعي في إبراز المعنى.","options":["يحدث جرساً موسيقياً يطرب الآذان","يبرز المعنى ويوضحه ويقويه بالتضاد","الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","تبرز الصورة المعنى في ثوب حسي مؤثر يقرّبه إلى الذهن"],"answer":0,"exp":"المحسن هو الجناس الناقص (القَنا / القَنابِلِ)، وأثره: يحدث جرساً موسيقياً يطرب الآذان"},{"verse":"إنّ الثمانينَ وبُلِّغتَها *** قد أحوجتْ سمعي إلى ترجمانِ","q":"[اختبار 2025–2026م] ضع أمام البيت الغرض البلاغي المناسب: (التحسّر والحزن – إظهار الضعف – الحثّ على السعي).","options":["إظهار الضعف","التحسّر والحزن","الحثّ على السعي","الفخر"],"answer":0,"exp":"يُظهر الشاعر ضعف سمعه بعد بلوغ الثمانين، فالخبر خرج إلى غرض إظهار الضعف."},{"verse":"ولمّا دعوتُ الصبرَ بعدكَ والأسى *** أجابَ الأسى طَوْعاً ولم يُجِبِ الصبرُ","q":"[اختبار 2025–2026م] ضع أمام البيت الغرض البلاغي المناسب: (التحسّر والحزن – إظهار الضعف – الحثّ على السعي).","options":["التحسّر والحزن","إظهار الضعف","الحثّ على السعي","المدح"],"answer":0,"exp":"يرثي الأعرابي ولده ويتحسّر على فقده، فالخبر خرج إلى غرض التحسر والحزن."},{"verse":"قال تعالى: ﴿قَدْ أَفْلَحَ مَنْ زَكَّاهَا﴾","q":"[اختبار 2025–2026م] بيّن ضرب الخبر في الآية الكريمة.","options":["طلبي","ابتدائي","إنكاري","خارج عن مقتضى الظاهر"],"answer":0,"exp":"الخبر مؤكد بأداة واحدة هي (قد)، فهو خبر طلبي."},{"verse":"قال تعالى: ﴿إِنَّ الْإِنسَانَ لِرَبِّهِ لَكَنُودٌ﴾","q":"[اختبار 2025–2026م] بيّن ضرب الخبر في الآية الكريمة.","options":["إنكاري","ابتدائي","طلبي","خارج عن مقتضى الظاهر"],"answer":0,"exp":"الخبر مؤكد بمؤكدين (إنّ + لام الابتداء)، فهو خبر إنكاري."},{"verse":"«العلمُ نافعٌ» (تُقال لمن يجحد فضل العلم)","q":"[اختبار 2025–2026م] بيّن سبب خروج الخبر عن مقتضى الظاهر في قولنا لمن يجحد فضل العلم (العلمُ نافعٌ).","options":["نُزِّل المنكر منزلة غير المنكر لأن بين يديه أدلة واضحة يتجاهلها","نُزِّل خالي الذهن منزلة المتردد لأن ما تقدّم الخبر أثار في نفسه تساؤلاً","نُزِّل غير المنكر منزلة المنكر لظهور أمارات الإنكار عليه","جرى على مقتضى الظاهر لأن المخاطب خالي الذهن"],"answer":0,"exp":"الآثار الحميدة للعلم بادية لكل ذي إدراك، فلدى المنكر من الأدلة ما يغنيه عن التوكيد؛ فنُزِّل المنكر منزلة غير المنكر وأُلقي الخبر خالياً من التوكيد."},{"verse":"سمعنا القرآنَ غضّاً طريّاً كأولِ ما نزلَ به الوحيُ.","q":"[اختبار 2025–2026م — الصف الحادي عشر] استخرج المسند والمسند إليه في الجملة الآتية.","options":["المسند: سمع (الفعل) — المسند إليه: نا (الفاعل)","المسند: القرآن — المسند إليه: سمع","المسند: غضّاً طريّاً — المسند إليه: نا","المسند: نا — المسند إليه: القرآن"],"answer":0,"exp":"الجملة فعلية؛ المسند هو الفعل (سمع) والمسند إليه هو الفاعل (نا)، وما بعدهما (القرآن، غضاً طرياً…) قيود."},{"verse":"وما مجاهدةُ الإنسانِ واصلةً *** رِزقاً ولا دَعَةُ الإنسانِ تقطعُه (ابن زريق)","q":"[اختبار 2024–2025م] وضّح المحسن البديعي في البيت الآتي.","options":["مقابلة","طباق إيجاب","جناس ناقص","سجع"],"answer":0,"exp":"قابل بين (مجاهدة الإنسان واصلةً رزقاً) و(دعة الإنسان تقطعه)، وهي مقابلة، وأثرها: يبرز المعنى ويوضحه ويقويه بالتضاد."},{"verse":"وما مجاهدةُ الإنسانِ واصلةً *** رِزقاً ولا دَعَةُ الإنسانِ تقطعُه (ابن زريق)","q":"[اختبار 2024–2025م] وضّح الأثر الفني للمحسن البديعي في البيت السابق.","options":["تبرز براءة الشاعر أمام زوجته وأن الرزق بيد الله وحده","تبرز شدة تمسكه بالأمل في اللقاء بعد ألم البعد","تبرز التحذير الشديد من الطمع وتجسّد نهايته المأساوية","تبرز قوة تحمله وصبره في الماضي كله"],"answer":0,"exp":"المحسن مقابلة بين معنيين متقابلين، وأثرها: تبرز أن الرزق بيد الله وحده لا بالجهد ولا بالدعة، وهي مقابلة يبرز المعنى ويوضحه ويقويه بالتضاد."},{"verse":"كان عمرُ بنُ الخطابِ يمشي شديدَ الوطءِ على الأرضِ جَهوريَّ الصوتِ.","q":"[اختبار 2024–2025م] بيّن الأثر الفني للصورة البيانية المخطوط تحتها (شديدَ الوطءِ على الأرضِ) في إبراز المعنى.","options":["كناية عن الهيبة وقوة الشخصية؛ أثرها: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","تشبيه بليغ لشدة الغضب؛ أثره: تقريب الصورة إلى الذهن بتشبيه حسي مألوف","استعارة مكنية للأرض؛ أثرها: بث الحياة في الجماد وتشخيصه أمام القارئ","استعارة تصريحية للوطء؛ أثرها: تجسيم المعنى المجرد وإبرازه بصورة حسية"],"answer":0,"exp":"عبارة (شديد الوطء على الأرض) كناية عن الهيبة وقوة الشخصية، وأثرها: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم."},{"verse":"عليلُ الجسمِ ممتنعُ القيامِ *** شديدُ السُّكرِ من غيرِ المُدامِ (المتنبي)","q":"[اختبار 2024–2025م] اختر الغرض البلاغي المناسب لكل خبر مما بين القوسين: (الفخر – المدح – إظهار الضعف – الحث على السعي).","options":["إظهار الضعف","الفخر","المدح","الحث على السعي"],"answer":0,"exp":"يُظهر المتنبي مرضه وعجزه عن القيام، فالخبر خرج إلى غرض إظهار الضعف."},{"verse":"ومكارمي عددُ النجومِ ومنزلي *** مأوى الكرامِ ومنزلُ الأضيافِ (أبو فراس الحمداني)","q":"[اختبار 2024–2025م] اختر الغرض البلاغي المناسب لكل خبر مما بين القوسين: (الفخر – المدح – إظهار الضعف – الحث على السعي).","options":["الفخر","المدح","إظهار الضعف","الحث على السعي"],"answer":0,"exp":"يعدّد أبو فراس مكارمه ويفتخر بكرمه وضيافته، فالغرض: الفخر."},{"verse":"وما نيلُ المطالبِ بالتمنّي *** ولكن تُؤخذُ الدنيا غِلابا (شوقي)","q":"[اختبار 2024–2025م] اختر الغرض البلاغي المناسب لكل خبر مما بين القوسين: (الفخر – المدح – إظهار الضعف – الحث على السعي).","options":["الحث على السعي","الفخر","المدح","إظهار الضعف"],"answer":0,"exp":"يحثّ شوقي على الجد والعمل لا التمني، فالغرض: الحث على السعي."},{"verse":"إنَّ للمتقينَ مفازاً.","q":"[اختبار 2024–2025م] صل العمود (أ) بما يناسبه من العمود (ب): بيّن ضرب الخبر في الجملة.","options":["طلبي","ابتدائي","إنكاري","خارج عن مقتضى الظاهر"],"answer":0,"exp":"الخبر مؤكد بأداة واحدة هي (إنّ)، فهو خبر طلبي."},{"verse":"الكلمةُ الطيبةُ صدقةٌ.","q":"[اختبار 2024–2025م] صل العمود (أ) بما يناسبه من العمود (ب): بيّن ضرب الخبر في الجملة.","options":["ابتدائي","طلبي","إنكاري","خارج عن مقتضى الظاهر"],"answer":0,"exp":"الجملة خالية من أدوات التوكيد، فهو خبر ابتدائي لمخاطب خالي الذهن."},{"verse":"قد كان مُضطلِعاً بالخطبِ يحمِلُه *** فضُلِّعَت بخُطوبِ البَينِ أضلُعُه (ابن زريق)","q":"[اختبار 2023–2024م] اشرح الصورة المخطوط تحتها (فضُلِّعَت بخُطوبِ البَينِ أضلُعُه) في البيت السابق.","options":["شبّه خطوب البين (مصائب الفراق) بأحمال ثقيلة تكسر أضلعه، فحذف المشبه به وأبقى شيئاً من لوازمه (استعارة مكنية)","شبّه الفراق بنار تحرق أضلعه، فحذف المشبه به وأبقى شيئاً من لوازمه (استعارة مكنية)","شبّه الشاعر بالجمل الذي يحمل الأثقال، فذكر المشبه والمشبه به معاً (تشبيه)","كناية عن كثرة الأعباء التي يحملها الشاعر في سفره الطويل"],"answer":0,"exp":"الصورة استعارة مكنية: شبّه الخطوب بأحمال ثقيلة تُضلِّع الأضلع (تُثقلها وتكسرها) وحذف المشبه به وأبقى لازمه."},{"verse":"قد كان مُضطلِعاً بالخطبِ يحمِلُه *** فضُلِّعَت بخُطوبِ البَينِ أضلُعُه (ابن زريق)","q":"[اختبار 2023–2024م] بيّن أثر هذه الصورة في المعنى.","options":["تعبّر عن قسوة الفراق وتأثيره المهلك","تجسّد حتمية الموت وقوته","تبرز التحذير الشديد من الطمع وتجسّد نهايته","تبرز قوة تحمله وصبره في الماضي"],"answer":0,"exp":"أثر الصورة: تعبّر عن قسوة الفراق وتأثيره المهلك في الشاعر."},{"verse":"كأنّما هو في حِلٍّ ومُرتَحَلٍ *** مُوَكَّلٌ بفضاءِ اللهِ يَذرَعُه (ابن زريق)","q":"[اختبار 2023–2024م] حدّد من البيت السابق محسناً معنوياً.","options":["(حِلٍّ / مُرتَحَلٍ)","(مُوَكَّلٌ / يَذرَعُهُ)","(فَضاءِ / اللهِ)","(كأنّما / هو)"],"answer":0,"exp":"المحسن المعنوي هو (حِلٍّ / مُرتَحَلٍ)؛ جمع بين لفظين متضادين."},{"verse":"كأنّما هو في حِلٍّ ومُرتَحَلٍ *** مُوَكَّلٌ بفضاءِ اللهِ يَذرَعُه (ابن زريق)","q":"[اختبار 2023–2024م] بيّن نوع المحسن المعنوي في (حِلٍّ / مُرتَحَلٍ).","options":["طباق إيجاب","طباق سلب","مقابلة","جناس ناقص"],"answer":0,"exp":"جمع بين لفظين متضادين دون نفي في أحدهما، فهو طباق إيجاب، وأثره: يبرز المعنى ويوضحه ويقويه بالتضاد."}]}}};

  st.textContent = `
/* NEO ACADEMY LOCKED IDENTITY
   Colors: navy #0B3157, gold #C5A059 (+ mint success, coral gentle error). Font: Tajawal.
   Header: brand on the right, [subject + grade] button on the left.
   Style: immersive navy, bento modules, chunky tactile buttons, juicy feedback. */
html, body { min-height: 100%; margin: 0; }
body {
  font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
  background-color: #071F38;
  background-image:
    radial-gradient(900px 520px at 100% -8%, rgba(197,160,89,.22), transparent 62%),
    radial-gradient(800px 520px at -10% 40%, rgba(18,70,122,.55), transparent 65%),
    radial-gradient(700px 500px at 90% 110%, rgba(197,160,89,.10), transparent 60%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0); background-size: 26px 26px; }
#app, header { position: relative; z-index: 1; }
header { position: sticky; top: 0; z-index: 40; background: rgba(7,31,56,.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(197,160,89,.35); }
.star8 { background: linear-gradient(145deg, #E6CC8E, #C5A059 60%, #8F7234); clip-path: polygon(50% 0,61% 20%,85% 15%,80% 39%,100% 50%,80% 61%,85% 85%,61% 80%,50% 100%,39% 80%,15% 85%,20% 61%,0 50%,20% 39%,15% 15%,39% 20%); }

/* surfaces */
.glass { background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.03)); border: 1px solid rgba(255,255,255,.11); border-radius: 22px; box-shadow: 0 18px 40px -22px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); }
.gold-frame { border: 1px solid rgba(197,160,89,.55); box-shadow: 0 0 0 1px rgba(197,160,89,.12), 0 24px 60px -28px rgba(197,160,89,.45), inset 0 1px 0 rgba(255,255,255,.08); }

/* chunky buttons */
.chunky { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .6rem; font-weight: 800; border-radius: 16px; transition: transform .1s, box-shadow .1s, filter .15s; cursor: pointer; }
:where(.chunky) { min-height: 56px; padding: 0 1.6rem; }
.chunky:disabled { opacity: .45; cursor: not-allowed; }
.chunky-gold { background: linear-gradient(180deg, #E0C47F, #C5A059); color: #071F38; box-shadow: 0 5px 0 #8F7234, 0 14px 24px -10px rgba(197,160,89,.5); }
.chunky-navy { background: #12467A; color: #fff; box-shadow: 0 5px 0 #0A2B4D; border: 1px solid rgba(255,255,255,.12); }
.chunky-ghost { background: rgba(255,255,255,.06); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.16); }
.chunky:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
.chunky:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
:focus-visible { outline: 3px solid #E6CC8E; outline-offset: 3px; }

/* options */
.opt { position: relative; width: 100%; min-height: 64px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; text-align: right; font-size: 1.15rem; font-weight: 700; color: #fff;
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04)); border: 1.5px solid rgba(255,255,255,.14); border-radius: 18px; box-shadow: 0 4px 0 rgba(0,0,0,.3);
  transition: transform .1s, box-shadow .1s, border-color .15s, background .15s; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: #C5A059; background: linear-gradient(180deg, rgba(197,160,89,.18), rgba(197,160,89,.08)); transform: translateY(-2px); }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.opt:disabled { cursor: default; }
.opt .badge { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; font-weight: 900; background: rgba(197,160,89,.16); color: #E6CC8E; border: 1px solid rgba(197,160,89,.4); }
.opt.is-correct { border-color: #38D39F; background: linear-gradient(180deg, rgba(56,211,159,.26), rgba(56,211,159,.12)); animation: bounceIn .45s cubic-bezier(.2,1.6,.4,1); box-shadow: 0 4px 0 #1C8A68, 0 0 36px -6px rgba(56,211,159,.55); }
.opt.is-correct .badge { background: #38D39F; color: #062d22; border-color: transparent; }
.opt.is-wrong { border-color: #FF8A7A; background: linear-gradient(180deg, rgba(255,138,122,.22), rgba(255,138,122,.10)); animation: nudge .4s; }
.opt.is-wrong .badge { background: #FF8A7A; color: #3a0f09; border-color: transparent; }
.opt.is-dim { opacity: .45; box-shadow: none; }
.opt.is-gone { opacity: .25; text-decoration: line-through; }

/* verse */
.verse-text { font-weight: 800; line-height: 2.15; text-wrap: balance; text-shadow: 0 2px 24px rgba(197,160,89,.25); }

/* sheet */
.sheet { position: fixed; inset-inline: 0; bottom: 0; z-index: 50; animation: sheetUp .32s cubic-bezier(.2,1,.3,1) both; }
.sheet-inner { max-width: 56rem; margin: 0 auto; border-radius: 26px 26px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 -20px 60px -20px rgba(0,0,0,.7); }
.sheet.ok .sheet-inner { background: linear-gradient(180deg, rgba(14,70,56,.96), rgba(8,46,40,.98)); border-top: 2px solid #38D39F; }
.sheet.bad .sheet-inner { background: linear-gradient(180deg, rgba(76,36,40,.96), rgba(50,24,30,.98)); border-top: 2px solid #FF8A7A; }

/* motion */
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bounceIn { 0% { transform: scale(.94); } 60% { transform: scale(1.035); } 100% { transform: scale(1); } }
@keyframes nudge { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
@keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes flame { from { transform: scale(1) rotate(-4deg); } to { transform: scale(1.2) rotate(4deg); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 14px rgba(197,160,89,0); } }
@keyframes floatup { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -64px); opacity: 0; } }

const $ = (s) => document.querySelector(s);

function freshState() {
  return { screen: 'start', name: '', topic: null, section: null, mode: null, level: 0, qs: [], i: 0, picked: null, locked: false,
           right: 0, score: 0, streak: 0, bestStreak: 0, mistakes: 0, usedFifty: false, fiftyLeft: 0, speedLeft: 0, boostUntil: 0,
           hidden: [], deadline: 0, last: null, result: null, log: [] };
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (n) => Number(n).toLocaleString('en-US');
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* storage (best effort) */
const keyFor = (n) => 'neo-' + n.trim();
function load(name) { try { const r = localStorage.getItem(keyFor(name)); if (r) { const o = JSON.parse(r); o.ex = o.ex || {}; o.badges = o.badges || {}; return o; } } catch (e) {} return { levels: {}, totalScore: 0, done: {}, ex: {}, badges: {} }; }
function save() { try { localStorage.setItem(keyFor(S.name), JSON.stringify(P)); localStorage.setItem('neo-last', S.name); } catch (e) {} }
function lastName() { try { return localStorage.getItem('neo-last') || ''; } catch (e) { return ''; } }

/* sound + haptics */
let muted = false;
function beep(f, d, type, when, vol) {
  if (muted) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    beep.ctx = beep.ctx || new C();
    const c = beep.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (when || 0);
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .1, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const buzz = (p) => { try { if (!muted && navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
const sfx = {
  ok() { beep(659, .12, 'triangle'); beep(880, .2, 'triangle', .09); buzz(18); },
  bad() { beep(240, .22, 'sine', 0, .12); beep(190, .26, 'sine', .12, .1); buzz([30, 40, 30]); },
  win() { [523, 659, 784, 1047].forEach((f, k) => beep(f, .18, 'triangle', k * .11)); buzz([20, 30, 20, 30, 60]); },
  click() { beep(520, .04, 'triangle', 0, .06); },
  boost() { [440, 660, 990].forEach((f, k) => beep(f, .12, 'square', k * .07, .05)); buzz(25); }
};

/* juice */
function burst(el, n) {
  if (REDUCED || !el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ['#C5A059', '#E6CC8E', '#38D39F', '#ffffff', '#12467A'];
  for (let k = 0; k < (n || 22); k++) {
    const p = document.createElement('i'); p.className = 'conf';
    const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 130;
    p.style.cssText = `left:${cx}px;top:${cy}px;background:${pick(colors)};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 50}px;--rot:${(Math.random() - .5) * 720}deg`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
  }
}
function fly(el, text) {
  if (REDUCED || !el) return;
  const r = el.getBoundingClientRect(), s = document.createElement('span');
  s.className = 'fly'; s.textContent = text; s.dir = 'ltr';
  s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + 6) + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 950);
}
function countUp(el, from, to, ms) {
  if (!el) return;
  if (REDUCED) { el.textContent = nf(to); return; }
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / (ms || 600)), e = 1 - Math.pow(1 - k, 3); el.textContent = nf(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* derived */
const clearedCount = () => Object.values(P.levels).filter((l) => l.stars > 0).length;
function rankIndex() { return Math.min(CONFIG.ranks.length - 1, Math.floor(clearedCount() / (CONFIG.levels / CONFIG.ranks.length))); }
const passNeed = (lv) => (CONFIG.pass.find(([upTo]) => lv <= upTo) || CONFIG.pass[CONFIG.pass.length - 1])[1];
const topicTotal = (k) => topicsData[k].suwar.length + topicsData[k].muhassanat.length;
const topicDone = (k) => (P.done[k + '.suwar'] || 0) + (P.done[k + '.muhassanat'] || 0);

function prep(list) {
  return list.map((q) => {
    const order = shuffle(q.options.map((_, k) => k));
    return { ...q, options: order.map((k) => q.options[k]), answer: order.indexOf(q.answer) };
  });
}

/* progress ring */
function ring(pct, size, stroke, inner, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<span class="relative inline-grid place-items-center shrink-0" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="absolute inset-0 -rotate-90" aria-hidden="true">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color || '#C5A059'}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}" style="transition:stroke-dashoffset .6s"/>
    </svg>${inner}</span>`;
}

/* navigation */
function go(screen, patch) { clearInterval(tick); Object.assign(S, patch || {}, { screen }); render(); }
function render() {
  clearInterval(tick);
  $('#subjectLabel').textContent = CONFIG.subject + ' · ' + CONFIG.grade;
  const key = [S.screen, S.i, S.level, S.section, S.topic, X ? X.i + ':' + X.exam : ''].join('|');
  const fresh = key !== lastKey; lastKey = key;
  const f = { start: vStart, topics: vTopics, sections: vSections, play: vPlay, result: vResult, map: vMap, xexams: vXExams, xplay: vXPlay, xresult: vXResult, xreview: vXReview, xoverall: vXOverall, xgroup: vXGroup, xathar: vXAthar, xsum: vXSum }[S.screen];
  const y = window.scrollY;
  app.innerHTML = `<div class="${fresh ? 'rise' : ''}">${f()}</div>`;
  bind();
  if (fresh) window.scrollTo(0, 0); else window.scrollTo(0, y);
  if (S.screen === 'play' && !S.locked && S.mode === 'level') runTimer();
  if (S.screen === 'play' && S.locked && S.last && S.last.pts) countUp($('#scoreN'), S.score - S.last.pts, S.score, 650);

  if (S.screen === 'map') { const n = $('[data-now]'); if (n) n.scrollIntoView({ block: 'center' }); }
  if (S.screen === 'result' && S.result && (S.result.passed || S.mode === 'learn')) setTimeout(() => burst($('#medal'), 36), 250);
}

}
function xOpts(q) {

    return `<button type="button" data-xopt="${k}" ${dis ? 'disabled' : ''} class="opt ${cls}"><span class="badge">${sym}</span><span class="grow">${esc(t)}</span>${fr}</button>`;

}

/* ---- exam logic ---- */
function startExam(i) {
  sfx.click();
  const qs = xExamQs(S.topic, i).map((q) => prep([q])[0]);
  X = { topic: S.topic, exam: i, qs, i: 0, picked: null, locked: false, right: 0, score: 0, streak: 0, bestStreak: 0, maxMult: 1, mistakes: 0, usedHelper: false,
        helpers: { fifty: 1, call: 1, time: 1 }, hidden: [], friend: null, timeUsed: false, limit: CONFIG.seconds * 1000, deadline: 0, t0: 0, log: [], last: null, result: null };
  xArm(); go('xplay');
}
function xArm() { X.limit = CONFIG.seconds * 1000; X.deadline = Date.now() + X.limit; X.t0 = Date.now(); X.hidden = []; X.friend = null; X.timeUsed = false; X.picked = null; X.locked = false; X.last = null; }
function runXTimer() {
  const step = () => {
    const left = Math.max(0, X.deadline - Date.now()), wrap = $('#timerWrap'), sec = $('#sec');
    if (wrap) {
      const circ = wrap.querySelectorAll('circle')[1];
      if (circ) { const r = Number(circ.getAttribute('r')), c = 2 * Math.PI * r; circ.setAttribute('stroke-dashoffset', c * (1 - left / X.limit)); circ.setAttribute('stroke', left <= 8000 ? '#FF8A7A' : '#C5A059'); }
      if (sec) { sec.textContent = Math.ceil(left / 1000); sec.style.color = left <= 8000 ? '#FF8A7A' : ''; }
    }
    if (left <= 0) { clearInterval(tick); xAnswer(-1); }
  };
  step(); tick = setInterval(step, 100);
}
function xFifty() {
  if (X.locked || X.helpers.fifty <= 0 || X.hidden.length) return;
  const q = X.qs[X.i];
  X.hidden = shuffle(q.options.map((_, k) => k).filter((k) => k !== q.answer)).slice(0, 2);
  if (X.friend && X.hidden.includes(X.friend.k)) X.friend = null;
  X.helpers.fifty -= 1; X.usedHelper = true; sfx.click(); render();
}
function xCall() {
  if (X.locked || X.helpers.call <= 0 || X.friend) return;
  const q = X.qs[X.i], alive = q.options.map((_, k) => k).filter((k) => !X.hidden.includes(k));
  const right = Math.random() < 0.78, wrongs = alive.filter((k) => k !== q.answer);
  const k = right || !wrongs.length ? q.answer : pick(wrongs);
  const pct = k === q.answer ? 65 + Math.floor(Math.random() * 30) : 45 + Math.floor(Math.random() * 15);
  X.friend = { k, pct, name: pick(XFRIENDS) }; X.helpers.call -= 1; X.usedHelper = true; sfx.click(); render();
}
function xTime() {
  if (X.locked || X.helpers.time <= 0 || X.timeUsed) return;
  X.deadline += 15000; X.limit += 15000; X.timeUsed = true; X.helpers.time -= 1; X.usedHelper = true; sfx.boost(); render();
}
function xAnswer(k) {
  if (!X || X.locked) return;
  clearInterval(tick);
  const q = X.qs[X.i], correct = k === q.answer, secs = (Date.now() - X.t0) / 1000;
  let pts = 0, mult = 1;
  if (correct) {
    X.right += 1; X.streak += 1; X.bestStreak = Math.max(X.bestStreak, X.streak);
    const left = Math.max(0, (X.deadline - Date.now()) / 1000);
    mult = X.streak >= 5 ? 3 : X.streak >= 3 ? 2 : 1; X.maxMult = Math.max(X.maxMult, mult);
    pts = Math.round((100 + left * 2) * mult); X.score += pts; sfx.ok();
  } else { X.streak = 0; X.mistakes += 1; sfx.bad(); }
  X.picked = k; X.locked = true;
  X.last = { correct, pts, mult, msg: correct ? pick(OK_MSG) : pick(BAD_MSG) };
  X.log[X.i] = { cat: q.cat, verse: q.verse || '', q: q.q, picked: k >= 0 ? q.options[k] : null, correct: q.options[q.answer], ok: correct, secs: Math.min(secs, X.limit / 1000), exp: q.exp, fast: correct && secs < 8 };
  render();
  if (window.innerWidth < 1024) { const ob = $('#optsBox'); if (ob) ob.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' }); }
  if (correct) { const t = app.querySelector('.opt.is-correct'); burst(t, X.streak >= 3 ? 34 : 20); fly(t, '+' + nf(pts)); }
}
function xNext() {
  sfx.click();
  if (X.i < X.qs.length - 1) { X.i += 1; xArm(); return render(); }
  xFinish();
}
function xFinish() {
  const k = X.topic, n = X.qs.length, before = xTotal(), old = xRec(k, X.exam), lvB = xLevel(before), rkB = xRank(before);
  const mastery = X.right === n && !X.usedHelper, bonus = mastery ? Math.round(X.score * 0.5) : 0, total = X.score + bonus;
  const stars = X.right >= n - 1 ? 3 : X.right >= n - 2 ? 2 : X.right >= Math.ceil(n / 2) ? 1 : 0;
  P.ex[k] = P.ex[k] || {};
  P.ex[k][X.exam] = { stars: Math.max(stars, old ? old.stars : 0), score: Math.max(total, old ? old.score : 0), right: Math.max(X.right, old ? old.right : 0), tries: (old ? old.tries : 0) + 1, n };
  const after = xTotal(), gets = [];
  const give = (id) => { if (!P.badges[id]) { P.badges[id] = true; gets.push(id); } };
  if (X.bestStreak >= 5) give('fire');
  if (X.log.filter((l) => l.fast).length >= 3) give('flash');
  if (mastery) give('master');
  if (old && total > old.score) give('back');
  const d = xDone(k), cnt = xCount(topicsData[k]);
  if (d >= Math.ceil(cnt / 2)) give('half'); if (d >= cnt) give('all');
  if (xTouchDay().n >= 3) give('days3');
  P.cs = P.cs || {}; X.log.forEach((l) => { const c = (P.cs[l.cat] = P.cs[l.cat] || { r: 0, t: 0 }); c.t++; if (l.ok) c.r++; });
  P.totalScore = after; save();
  const avg = X.log.reduce((a, l) => a + l.secs, 0) / n;
  X.result = { right: X.right, total, bonus, mastery, stars, avg, maxMult: X.maxMult, badges: gets, gain: after - before, prevBest: old ? old.score : 0,
    overall: after, level: xLevel(after), rank: xRank(after), levelUp: xLevel(after) > lvB, rankUp: xRank(after) > rkB };
  X.result.stars === 0 ? sfx.bad() : sfx.win(); go('xresult');
}

function runTimer() {
  const total = CONFIG.seconds * 1000;
  const step = () => {
    const left = Math.max(0, S.deadline - Date.now());
    const wrap = $('#timerWrap'), sec = $('#sec');
    if (wrap) {
      const circ = wrap.querySelectorAll('circle')[1];
      if (circ) { const r = Number(circ.getAttribute('r')), c = 2 * Math.PI * r; circ.setAttribute('stroke-dashoffset', c * (1 - left / total)); circ.setAttribute('stroke', left <= 8000 ? '#FF8A7A' : '#C5A059'); }
      if (sec) { sec.textContent = Math.ceil(left / 1000); sec.style.color = left <= 8000 ? '#FF8A7A' : ''; }
    }
    const bl = $('#boostLeft'), chip = $('#boostChip');
    if (bl && chip) { const b = Math.ceil((S.boostUntil - Date.now()) / 1000); if (b > 0) bl.textContent = b; else if (!chip.classList.contains('hidden')) chip.classList.add('hidden'); }
    if (left <= 0) { clearInterval(tick); answer(-1); }
  };
  step(); tick = setInterval(step, 100);

function useFifty() {
  if (S.locked || S.fiftyLeft <= 0 || S.hidden.length) return;
  const q = S.qs[S.i];
  S.hidden = shuffle(q.options.map((_, k) => k).filter((k) => k !== q.answer)).slice(0, 2);
  S.fiftyLeft -= 1; S.usedFifty = true; sfx.click(); render();
}
function useSpeed() {

  S.speedLeft -= 1; S.boostUntil = Date.now() + CONFIG.boostSeconds * 1000; sfx.boost(); render();
}

function answer(k, el) {
  if (S.locked) return;
  clearInterval(tick);
  const q = S.qs[S.i], correct = k === q.answer;
  let pts = 0, mult = 1;
  if (correct) {
    S.right += 1; S.streak += 1; S.bestStreak = Math.max(S.bestStreak, S.streak);
    if (S.mode === 'level') {
      const left = Math.max(0, (S.deadline - Date.now()) / 1000);
      const fire = S.streak >= 5 ? 3 : S.streak >= 3 ? 2 : 1;
      const boost = Date.now() < S.boostUntil ? 2 : 1;
      mult = fire * boost;
      pts = Math.round((100 + left * 2) * mult);
      S.score += pts;
    }
    sfx.ok();
  } else { S.streak = 0; S.mistakes += 1; sfx.bad(); }
  S.picked = k; S.locked = true;

}

function finish() {
  const prevRank = rankIndex();
  if (S.mode === 'learn') {
    const key = S.topic + '.' + S.section;
    P.done[key] = Math.max(P.done[key] || 0, S.right);
    save(); S.result = { right: S.right }; sfx.win(); return go('result');
  }
  const need = passNeed(S.level), passed = S.right >= need;
  const st = !passed ? 0 : S.right === S.qs.length ? 3 : S.right === S.qs.length - 1 ? 2 : 1;
  const mastery = passed && S.mistakes === 0 && !S.usedFifty;
  const bonus = mastery ? Math.round(S.score * 0.5) : 0, total = S.score + bonus;
  const old = P.levels[S.level];
  P.levels[S.level] = { stars: Math.max(st, old ? old.stars : 0), score: Math.max(total, old ? old.score : 0) };
  P.totalScore += total; save();
  const ri = rankIndex();
  S.result = { right: S.right, passed, stars: st, base: S.score, bonus, mastery, total, rankUp: ri > prevRank, rankIndex: ri };
  passed ? sfx.win() : sfx.bad();
  go('result');
}
