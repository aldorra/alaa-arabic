/* NEO ACADEMY LOCKED IDENTITY
   Colors: navy #0B3157, gold #C5A059 (+ mint success, coral gentle error). Font: Tajawal.
   Header: brand on the right, [subject + grade] button on the left.
   Style: immersive navy, bento modules, chunky tactile buttons, juicy feedback. */
html, body { min-height: 100%; margin: 0; }
body {
  font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
  background-color: #071F38;
  background-image:
    radial-gradient(900px 520px at 100% -8%, rgba(197,160,89,.22), transparent 62%),
    radial-gradient(800px 520px at -10% 40%, rgba(18,70,122,.55), transparent 65%),
    radial-gradient(700px 500px at 90% 110%, rgba(197,160,89,.10), transparent 60%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0); background-size: 26px 26px; }
#app, header { position: relative; z-index: 1; }
header { position: sticky; top: 0; z-index: 40; background: rgba(7,31,56,.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(197,160,89,.35); }
.star8 { background: linear-gradient(145deg, #E6CC8E, #C5A059 60%, #8F7234); clip-path: polygon(50% 0,61% 20%,85% 15%,80% 39%,100% 50%,80% 61%,85% 85%,61% 80%,50% 100%,39% 80%,15% 85%,20% 61%,0 50%,20% 39%,15% 15%,39% 20%); }

/* surfaces */
.glass { background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.03)); border: 1px solid rgba(255,255,255,.11); border-radius: 22px; box-shadow: 0 18px 40px -22px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); }
.gold-frame { border: 1px solid rgba(197,160,89,.55); box-shadow: 0 0 0 1px rgba(197,160,89,.12), 0 24px 60px -28px rgba(197,160,89,.45), inset 0 1px 0 rgba(255,255,255,.08); }

/* chunky buttons */
.chunky { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .6rem; font-weight: 800; border-radius: 16px; transition: transform .1s, box-shadow .1s, filter .15s; cursor: pointer; }
:where(.chunky) { min-height: 56px; padding: 0 1.6rem; }
.chunky:disabled { opacity: .45; cursor: not-allowed; }
.chunky-gold { background: linear-gradient(180deg, #E0C47F, #C5A059); color: #071F38; box-shadow: 0 5px 0 #8F7234, 0 14px 24px -10px rgba(197,160,89,.5); }

.sheet-inner { max-width: 56rem; margin: 0 auto; border-radius: 26px 26px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 -20px 60px -20px rgba(0,0,0,.7); }

/* motion */
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bounceIn { 0% { transform: scale(.94); } 60% { transform: scale(1.035); } 100% { transform: scale(1); } }

@keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes float { 50% { transform: translateY(-8px); } }
@keyframes spin { to { transform: rotate(360deg); } }
.rise { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }

.stagger > *:nth-child(2) { animation-delay: .07s; } .stagger > *:nth-child(3) { animation-delay: .14s; } .stagger > *:nth-child(4) { animation-delay: .21s; } .stagger > *:nth-child(5) { animation-delay: .28s; }

.fly { position: fixed; z-index: 70; pointer-events: none; font-weight: 900; color: #38D39F; font-size: 1.5rem; text-shadow: 0 2px 12px rgba(0,0,0,.5); animation: floatup .9s ease-out forwards; }
.conf { position: fixed; z-index: 70; width: 9px; height: 14px; border-radius: 2px; pointer-events: none; animation: confetti .95s cubic-bezier(.1,.7,.3,1) forwards; }
:where(.shine) { position: relative; overflow: hidden; }
.shine::after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.38) 50%, transparent 70%); background-size: 200% 100%; animation: shimmer 3.2s linear infinite; }

const $ = (s) => document.querySelector(s);
const app = $('#app');
const LETTERS = ['أ', 'ب', 'ج', 'د'];
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let tick = null, lastKey = '';
let S = freshState();
let P = { levels: {}, totalScore: 0, done: {}, ex: {}, badges: {} };

function freshState() {
  return { screen: 'start', name: '', topic: null, section: null, mode: null, level: 0, qs: [], i: 0, picked: null, locked: false,
           right: 0, score: 0, streak: 0, bestStreak: 0, mistakes: 0, usedFifty: false, fiftyLeft: 0, speedLeft: 0, boostUntil: 0,
           hidden: [], deadline: 0, last: null, result: null, log: [] };
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (n) => Number(n).toLocaleString('en-US');
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* storage (best effort) */
const keyFor = (n) => 'neo-' + n.trim();
function load(name) { try { const r = localStorage.getItem(keyFor(name)); if (r) { const o = JSON.parse(r); o.ex = o.ex || {}; o.badges = o.badges || {}; return o; } } catch (e) {} return { levels: {}, totalScore: 0, done: {}, ex: {}, badges: {} }; }
function save() { try { localStorage.setItem(keyFor(S.name), JSON.stringify(P)); localStorage.setItem('neo-last', S.name); } catch (e) {} }
function lastName() { try { return localStorage.getItem('neo-last') || ''; } catch (e) { return ''; } }

/* sound + haptics */
let muted = false;
function beep(f, d, type, when, vol) {
  if (muted) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    beep.ctx = beep.ctx || new C();
    const c = beep.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (when || 0);
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .1, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const buzz = (p) => { try { if (!muted && navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
const sfx = {
  ok() { beep(659, .12, 'triangle'); beep(880, .2, 'triangle', .09); buzz(18); },
  bad() { beep(240, .22, 'sine', 0, .12); beep(190, .26, 'sine', .12, .1); buzz([30, 40, 30]); },
  win() { [523, 659, 784, 1047].forEach((f, k) => beep(f, .18, 'triangle', k * .11)); buzz([20, 30, 20, 30, 60]); },
  click() { beep(520, .04, 'triangle', 0, .06); },
  boost() { [440, 660, 990].forEach((f, k) => beep(f, .12, 'square', k * .07, .05)); buzz(25); }
};

/* juice */
function burst(el, n) {
  if (REDUCED || !el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ['#C5A059', '#E6CC8E', '#38D39F', '#ffffff', '#12467A'];
  for (let k = 0; k < (n || 22); k++) {
    const p = document.createElement('i'); p.className = 'conf';
    const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 130;
    p.style.cssText = `left:${cx}px;top:${cy}px;background:${pick(colors)};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 50}px;--rot:${(Math.random() - .5) * 720}deg`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
  }
}
function fly(el, text) {
  if (REDUCED || !el) return;
  const r = el.getBoundingClientRect(), s = document.createElement('span');
  s.className = 'fly'; s.textContent = text; s.dir = 'ltr';
  s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + 6) + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 950);
}
function countUp(el, from, to, ms) {
  if (!el) return;
  if (REDUCED) { el.textContent = nf(to); return; }
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / (ms || 600)), e = 1 - Math.pow(1 - k, 3); el.textContent = nf(Math.round(from + (to - from) * e)); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* derived */
const clearedCount = () => Object.values(P.levels).filter((l) => l.stars > 0).length;
function rankIndex() { return Math.min(CONFIG.ranks.length - 1, Math.floor(clearedCount() / (CONFIG.levels / CONFIG.ranks.length))); }
const passNeed = (lv) => (CONFIG.pass.find(([upTo]) => lv <= upTo) || CONFIG.pass[CONFIG.pass.length - 1])[1];
const topicTotal = (k) => topicsData[k].suwar.length + topicsData[k].muhassanat.length;
const topicDone = (k) => (P.done[k + '.suwar'] || 0) + (P.done[k + '.muhassanat'] || 0);
const allQs = () => Object.entries(topicsData).flatMap(([k, t]) => ['suwar', 'muhassanat'].flatMap((s) => t[s].map((q) => ({ ...q, _t: t.title, _s: SECTIONS[s].title }))));
function prep(list) {
  return list.map((q) => {
    const order = shuffle(q.options.map((_, k) => k));
    return { ...q, options: order.map((k) => q.options[k]), answer: order.indexOf(q.answer) };
  });
}

/* progress ring */
function ring(pct, size, stroke, inner, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<span class="relative inline-grid place-items-center shrink-0" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="absolute inset-0 -rotate-90" aria-hidden="true">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color || '#C5A059'}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}" style="transition:stroke-dashoffset .6s"/>
    </svg>${inner}</span>`;
}

/* navigation */
function go(screen, patch) { clearInterval(tick); Object.assign(S, patch || {}, { screen }); render(); }
function render() {
  clearInterval(tick);
  $('#subjectLabel').textContent = CONFIG.subject + ' · ' + CONFIG.grade;
  const key = [S.screen, S.i, S.level, S.section, S.topic, X ? X.i + ':' + X.exam : ''].join('|');
  const fresh = key !== lastKey; lastKey = key;
  const f = { start: vStart, topics: vTopics, sections: vSections, play: vPlay, result: vResult, map: vMap, xexams: vXExams, xplay: vXPlay, xresult: vXResult, xreview: vXReview, xoverall: vXOverall }[S.screen];
  const y = window.scrollY;

  bind();
  if (fresh) window.scrollTo(0, 0); else window.scrollTo(0, y);
  if (S.screen === 'play' && !S.locked && S.mode === 'level') runTimer();
  if (S.screen === 'play' && S.locked && S.last && S.last.pts) countUp($('#scoreN'), S.score - S.last.pts, S.score, 650);
  if (S.screen === 'xplay' && !X.locked) runXTimer();

  if (S.screen === 'map') { const n = $('[data-now]'); if (n) n.scrollIntoView({ block: 'center' }); }
  if (S.screen === 'result' && S.result && (S.result.passed || S.mode === 'learn')) setTimeout(() => burst($('#medal'), 36), 250);
}

    const t = topicsData[k], n = xCount(t), d = xDone(k), sc = Object.values(P.ex[k] || {}).reduce((a, r) => a + r.score, 0), st = Object.values(P.ex[k] || {}).reduce((a, r) => a + r.stars, 0);
    return `<div class="glass p-4"><div class="flex items-center gap-3 mb-2.5"><span class="w-10 h-10 rounded-xl bg-navy-700 text-gold-light grid place-items-center"><i class="fa-solid ${t.icon}"></i></span><b class="grow">${esc(t.title)}</b><span class="font-black text-gold-light tabular-nums" dir="ltr">${nf(sc)}</span></div>
      <div class="flex items-center gap-3 text-xs font-bold text-white/60"><span class="grow h-2.5 rounded-full bg-white/12 overflow-hidden"><span class="block h-full bg-gradient-to-l from-gold-light to-gold rounded-full" style="width:${n ? Math.round(d / n * 100) : 0}%"></span></span><span dir="ltr">${d}/${n}</span><span class="flex items-center gap-1" dir="ltr">${st}<i class="fa-solid fa-star text-gold-light"></i></span></div></div>`;
  }).join('');
  const bad = Object.entries(XBADGES).map(([id, b]) => { const on = P.badges[id]; return `<div class="glass !rounded-2xl p-3.5 flex items-center gap-3 ${on ? '!border-gold/60' : 'opacity-50'}"><span class="w-11 h-11 rounded-xl grid place-items-center text-lg ${on ? 'bg-gradient-to-br from-gold-light to-gold text-navy-900' : 'bg-white/10'}"><i class="fa-solid ${on ? b.icon : 'fa-lock'}"></i></span><span><b class="block text-sm">${b.t}</b><span class="text-xs text-white/60 leading-5">${b.d}</span></span></div>`; }).join('');
  const tile = (v, l) => `<div class="glass !rounded-2xl p-3"><b class="block text-2xl font-black tabular-nums" dir="ltr">${v}</b><span class="text-white/65 text-sm">${l}</span></div>`;
  return `${backBtn('topics', 'الموضوعات')}<div class="stagger grid gap-5">
   <section class="glass gold-frame text-center p-7"><span class="text-gold-light font-bold text-sm">${esc(S.name)} · المستوى ${lvl}</span><h1 class="text-3xl font-black mt-1">${CONFIG.ranks[ri]}</h1>
     <div class="text-6xl font-black text-gold-light tabular-nums my-3" dir="ltr">${nf(tot)}</div><span class="text-white/60 text-sm font-bold">إجمالي نقاط البرنامج</span></section>
   <section class="grid grid-cols-3 gap-3 text-center">${tile(exs, 'اختبارات منجزة')}${tile(xStarsSum() + '/' + maxStars, 'النجوم')}${tile(acc + '٪', 'دقة الإجابات')}</section>
   <section><h2 class="font-black text-xl mb-3">تقدمك في الموضوعات</h2><div class="grid gap-3">${rows}</div></section>
   ${xReportLink({ topic: 'النتيجة الشاملة', exam: exs, score: tot, right: rights, stars: xStarsSum() })}
   <section><h2 class="font-black text-xl mb-3">الأوسمة</h2><div class="grid sm:grid-cols-2 gap-3">${bad}</div></section></div>`;
}

/* ---- exam logic ---- */
function startExam(i) {
  sfx.click();
  const qs = xExamQs(S.topic, i).map((q) => prep([q])[0]);
  X = { topic: S.topic, exam: i, qs, i: 0, picked: null, locked: false, right: 0, score: 0, streak: 0, bestStreak: 0, maxMult: 1, mistakes: 0, usedHelper: false,
        helpers: { fifty: 1, call: 1, time: 1 }, hidden: [], friend: null, timeUsed: false, limit: CONFIG.seconds * 1000, deadline: 0, t0: 0, log: [], last: null, result: null };
  xArm(); go('xplay');
}
function xArm() { X.limit = CONFIG.seconds * 1000; X.deadline = Date.now() + X.limit; X.t0 = Date.now(); X.hidden = []; X.friend = null; X.timeUsed = false; X.picked = null; X.locked = false; X.last = null; }
function runXTimer() {
  const step = () => {
    const left = Math.max(0, X.deadline - Date.now()), wrap = $('#timerWrap'), sec = $('#sec');
    if (wrap) {
      const circ = wrap.querySelectorAll('circle')[1];
      if (circ) { const r = Number(circ.getAttribute('r')), c = 2 * Math.PI * r; circ.setAttribute('stroke-dashoffset', c * (1 - left / X.limit)); circ.setAttribute('stroke', left <= 8000 ? '#FF8A7A' : '#C5A059'); }
      if (sec) { sec.textContent = Math.ceil(left / 1000); sec.style.color = left <= 8000 ? '#FF8A7A' : ''; }
    }
    if (left <= 0) { clearInterval(tick); xAnswer(-1); }
  };
  step(); tick = setInterval(step, 100);
}
function xFifty() {
  if (X.locked || X.helpers.fifty <= 0 || X.hidden.length) return;
  const q = X.qs[X.i];
  X.hidden = shuffle(q.options.map((_, k) => k).filter((k) => k !== q.answer)).slice(0, 2);
  if (X.friend && X.hidden.includes(X.friend.k)) X.friend = null;
  X.helpers.fifty -= 1; X.usedHelper = true; sfx.click(); render();
}
function xCall() {
  if (X.locked || X.helpers.call <= 0 || X.friend) return;
  const q = X.qs[X.i], alive = q.options.map((_, k) => k).filter((k) => !X.hidden.includes(k));
  const right = Math.random() < 0.78, wrongs = alive.filter((k) => k !== q.answer);
  const k = right || !wrongs.length ? q.answer : pick(wrongs);
  const pct = k === q.answer ? 65 + Math.floor(Math.random() * 30) : 45 + Math.floor(Math.random() * 15);
  X.friend = { k, pct, name: pick(XFRIENDS) }; X.helpers.call -= 1; X.usedHelper = true; sfx.click(); render();
}
function xTime() {
  if (X.locked || X.helpers.time <= 0 || X.timeUsed) return;
  X.deadline += 15000; X.limit += 15000; X.timeUsed = true; X.helpers.time -= 1; X.usedHelper = true; sfx.boost(); render();
}
function xAnswer(k) {
  if (!X || X.locked) return;
  clearInterval(tick);
  const q = X.qs[X.i], correct = k === q.answer, secs = (Date.now() - X.t0) / 1000;
  let pts = 0, mult = 1;
  if (correct) {
    X.right += 1; X.streak += 1; X.bestStreak = Math.max(X.bestStreak, X.streak);
    const left = Math.max(0, (X.deadline - Date.now()) / 1000);
    mult = X.streak >= 5 ? 3 : X.streak >= 3 ? 2 : 1; X.maxMult = Math.max(X.maxMult, mult);
    pts = Math.round((100 + left * 2) * mult); X.score += pts; sfx.ok();
  } else { X.streak = 0; X.mistakes += 1; sfx.bad(); }
  X.picked = k; X.locked = true;
  X.last = { correct, pts, mult, msg: correct ? pick(OK_MSG) : pick(BAD_MSG) };
  X.log[X.i] = { cat: q.cat, verse: q.verse || '', q: q.q, picked: k >= 0 ? q.options[k] : null, correct: q.options[q.answer], ok: correct, secs: Math.min(secs, X.limit / 1000), exp: q.exp, fast: correct && secs < 8 };
  render();
  if (window.innerWidth < 1024) { const ob = $('#optsBox'); if (ob) ob.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' }); }
  if (correct) { const t = app.querySelector('.opt.is-correct'); burst(t, X.streak >= 3 ? 34 : 20); fly(t, '+' + nf(pts)); }
}
function xNext() {
  sfx.click();
  if (X.i < X.qs.length - 1) { X.i += 1; xArm(); return render(); }
  xFinish();
}
function xFinish() {
  const k = X.topic, n = X.qs.length, before = xTotal(), old = xRec(k, X.exam), lvB = xLevel(before), rkB = xRank(before);
  const mastery = X.right === n && !X.usedHelper, bonus = mastery ? Math.round(X.score * 0.5) : 0, total = X.score + bonus;
  const stars = X.right >= n - 1 ? 3 : X.right >= n - 2 ? 2 : X.right >= Math.ceil(n / 2) ? 1 : 0;
  P.ex[k] = P.ex[k] || {};
  P.ex[k][X.exam] = { stars: Math.max(stars, old ? old.stars : 0), score: Math.max(total, old ? old.score : 0), right: Math.max(X.right, old ? old.right : 0), tries: (old ? old.tries : 0) + 1 };
  const after = xTotal(), gets = [];
  const give = (id) => { if (!P.badges[id]) { P.badges[id] = true; gets.push(id); } };
  if (X.bestStreak >= 5) give('fire');
  if (X.log.filter((l) => l.fast).length >= 3) give('flash');
  if (mastery) give('master');
  if (old && total > old.score) give('back');
  const d = xDone(k), cnt = xCount(topicsData[k]);
  if (d >= 10) give('half'); if (d >= cnt) give('all');
  if (xTouchDay().n >= 3) give('days3');
  P.totalScore = after; save();
  const avg = X.log.reduce((a, l) => a + l.secs, 0) / n;
  X.result = { right: X.right, total, bonus, mastery, stars, avg, maxMult: X.maxMult, badges: gets, gain: after - before, prevBest: old ? old.score : 0,
    overall: after, level: xLevel(after), rank: xRank(after), levelUp: xLevel(after) > lvB, rankUp: xRank(after) > rkB };
  X.result.stars === 0 ? sfx.bad() : sfx.win(); go('xresult');
}

/* ---------- interactions ---------- */
function bind() {
  app.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => { sfx.click(); go(b.dataset.go); }));
  app.querySelectorAll('[data-topic]').forEach((b) => (b.onclick = () => { sfx.click(); go('sections', { topic: b.dataset.topic }); }));
  app.querySelectorAll('[data-section]').forEach((b) => (b.onclick = () => startLearn(b.dataset.section)));
  app.querySelectorAll('[data-level]').forEach((b) => (b.onclick = () => startLevel(Number(b.dataset.level))));
  app.querySelectorAll('[data-opt]').forEach((b) => (b.onclick = () => answer(Number(b.dataset.opt), b)));
  const f = $('#nameForm');
  if (f) f.onsubmit = (e) => {
    e.preventDefault();
    const v = $('#nameInput').value.trim();
    if (v.length < 2) { const i = $('#nameInput'); i.classList.add('shake'); i.focus(); setTimeout(() => i.classList.remove('shake'), 400); return; }
    S.name = v; P = load(v); save(); sfx.click(); go('topics');
  };
  const nx = $('#next'); if (nx) { nx.onclick = next; nx.focus({ preventScroll: true }); }
  const fi = $('#fifty'); if (fi) fi.onclick = useFifty;
  const sp = $('#speed'); if (sp) sp.onclick = useSpeed;
  const ag = $('#again'); if (ag) ag.onclick = () => (S.mode === 'level' ? startLevel(S.level) : startLearn(S.section));
  bindX();
  const nl = $('#nextLevel'); if (nl) nl.onclick = () => startLevel(S.level + 1);
}

function startLearn(section) {
  sfx.click();
  const list = shuffle(topicsData[S.topic][section]);
  Object.assign(S, { section, mode: 'learn', qs: prep(list), i: 0, picked: null, locked: false, right: 0, score: 0, streak: 0, hidden: [], last: null, log: [] });
  go('play');
}
function startLevel(n) {
  sfx.click();
  const pool = shuffle(allQs()); const picks = [];
  while (picks.length < CONFIG.perLevel) picks.push(...shuffle(pool).slice(0, CONFIG.perLevel - picks.length));
  Object.assign(S, { mode: 'level', level: n, qs: prep(picks), i: 0, picked: null, locked: false, right: 0, score: 0, streak: 0, bestStreak: 0,
    mistakes: 0, usedFifty: false, fiftyLeft: CONFIG.fiftyPerLevel, speedLeft: 1, boostUntil: 0, hidden: [], last: null, log: [] });
  S.deadline = Date.now() + CONFIG.seconds * 1000;
  go('play');
}
function next() {
  sfx.click();
  if (S.i < S.qs.length - 1) {
    S.i += 1; S.picked = null; S.locked = false; S.hidden = []; S.last = null;
    S.deadline = Date.now() + CONFIG.seconds * 1000;
    return render();
  }
  finish();
}

function runTimer() {
  const total = CONFIG.seconds * 1000;
  const step = () => {
    const left = Math.max(0, S.deadline - Date.now());
    const wrap = $('#timerWrap'), sec = $('#sec');
    if (wrap) {
      const circ = wrap.querySelectorAll('circle')[1];
      if (circ) { const r = Number(circ.getAttribute('r')), c = 2 * Math.PI * r; circ.setAttribute('stroke-dashoffset', c * (1 - left / total)); circ.setAttribute('stroke', left <= 8000 ? '#FF8A7A' : '#C5A059'); }
      if (sec) { sec.textContent = Math.ceil(left / 1000); sec.style.color = left <= 8000 ? '#FF8A7A' : ''; }
    }
    const bl = $('#boostLeft'), chip = $('#boostChip');
    if (bl && chip) { const b = Math.ceil((S.boostUntil - Date.now()) / 1000); if (b > 0) bl.textContent = b; else if (!chip.classList.contains('hidden')) chip.classList.add('hidden'); }
    if (left <= 0) { clearInterval(tick); answer(-1); }
  };
  step(); tick = setInterval(step, 100);
}

function useFifty() {
  if (S.locked || S.fiftyLeft <= 0 || S.hidden.length) return;
  const q = S.qs[S.i];
  S.hidden = shuffle(q.options.map((_, k) => k).filter((k) => k !== q.answer)).slice(0, 2);
  S.fiftyLeft -= 1; S.usedFifty = true; sfx.click(); render();
}
function useSpeed() {
  if (S.locked || S.speedLeft <= 0 || Date.now() < S.boostUntil) return;
  S.speedLeft -= 1; S.boostUntil = Date.now() + CONFIG.boostSeconds * 1000; sfx.boost(); render();
}

function answer(k, el) {
  if (S.locked) return;
  clearInterval(tick);
  const q = S.qs[S.i], correct = k === q.answer;
  let pts = 0, mult = 1;
  if (correct) {
    S.right += 1; S.streak += 1; S.bestStreak = Math.max(S.bestStreak, S.streak);
    if (S.mode === 'level') {
      const left = Math.max(0, (S.deadline - Date.now()) / 1000);
      const fire = S.streak >= 5 ? 3 : S.streak >= 3 ? 2 : 1;
      const boost = Date.now() < S.boostUntil ? 2 : 1;
      mult = fire * boost;
      pts = Math.round((100 + left * 2) * mult);
      S.score += pts;
    }
    sfx.ok();
  } else { S.streak = 0; S.mistakes += 1; sfx.bad(); }
  S.picked = k; S.locked = true;
  S.last = { correct, pts, mult, msg: correct ? pick(OK_MSG) : pick(BAD_MSG) };
  S.log[S.i] = { correct };
  render();
  if (window.innerWidth < 1024) { const ob = $('#optsBox'); if (ob) ob.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' }); }
  if (correct) {
    const target = app.querySelector('.opt.is-correct');
    burst(target, S.streak >= 3 ? 34 : 20);
    if (pts) fly(target, '+' + nf(pts));
  }
}

function finish() {
  const prevRank = rankIndex();
  if (S.mode === 'learn') {
    const key = S.topic + '.' + S.section;
    P.done[key] = Math.max(P.done[key] || 0, S.right);
    save(); S.result = { right: S.right }; sfx.win(); return go('result');
  }
  const need = passNeed(S.level), passed = S.right >= need;
  const st = !passed ? 0 : S.right === S.qs.length ? 3 : S.right === S.qs.length - 1 ? 2 : 1;
  const mastery = passed && S.mistakes === 0 && !S.usedFifty;
  const bonus = mastery ? Math.round(S.score * 0.5) : 0, total = S.score + bonus;
  const old = P.levels[S.level];
  P.levels[S.level] = { stars: Math.max(st, old ? old.stars : 0), score: Math.max(total, old ? old.score : 0) };
  P.totalScore += total; save();
  const ri = rankIndex();
  S.result = { right: S.right, passed, stars: st, base: S.score, bonus, mastery, total, rankUp: ri > prevRank, rankIndex: ri };
  passed ? sfx.win() : sfx.bad();
  go('result');
}

function bindX() {
  app.querySelectorAll('[data-xtopic]').forEach((b) => (b.onclick = () => { sfx.click(); go('xexams', { topic: b.dataset.xtopic }); }));
  app.querySelectorAll('[data-xexam]').forEach((b) => (b.onclick = () => startExam(Number(b.dataset.xexam))));
  app.querySelectorAll('[data-xopt]').forEach((b) => (b.onclick = () => xAnswer(Number(b.dataset.xopt))));
  const set = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  set('#xfifty', xFifty); set('#xcall', xCall); set('#xtime', xTime);
  set('#xagain', () => startExam(X.exam)); set('#xnextexam', () => startExam(X.exam + 1)); set('#xreview', () => { sfx.click(); go('xreview'); });
  const nx = $('#xnext'); if (nx) { nx.onclick = xNext; nx.focus({ preventScroll: true }); }
}
document.addEventListener('keydown', (e) => {
  if (S.screen === 'xplay' && X) {
    if (!X.locked && /^[1-4]$/.test(e.key)) { const k = Number(e.key) - 1; if (!X.hidden.includes(k)) xAnswer(k); }
    else if (X.locked && e.key === 'Enter' && document.activeElement === document.body) xNext();
    return;
  }
  if (S.screen !== 'play') return;
  if (!S.locked && /^[1-4]$/.test(e.key)) { const k = Number(e.key) - 1; if (!S.hidden.includes(k)) answer(k); }
  else if (S.locked && e.key === 'Enter' && document.activeElement === document.body) next();
});

/* keep place across republish */
window.claude?.hot?.snapshot(() => ({ S, P, X }));
const boot = (d) => {
  if (d && d.S && d.S.screen) {
    S = Object.assign(freshState(), d.S); P = d.P || P; X = d.X || null; if (X && S.screen === 'xplay' && !X.locked) { X.deadline = Date.now() + X.limit; X.t0 = Date.now(); } if (S.screen.startsWith('x') && !X) S.screen = 'topics';
    if (S.screen === 'play' && S.mode === 'level' && !S.locked) S.deadline = Date.now() + CONFIG.seconds * 1000;
  }
  render();
};
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

</script>
