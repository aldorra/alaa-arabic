ي)","icon":"fa-feather-pointed","mix":{"naw":3,"athar":3},"pool":{"naw":[{"verse":"كَأَنَّما هُوَ في حِلٍّ وَمُرتَحَلٍ ... مُوَكَّلٌ بِفَضاءِ اللَهِ يَذرَعُهُ","q":"حدّد نوع الصورة الفنية في: «كَأَنَّما هُوَ في حِلٍّ وَمُرتَحَلٍ … مُوَكَّلٌ بِفَضاءِ اللَهِ يَذرَعُهُ».","options":["تشبيه تمثيلي","استعارة مكنية","كناية","تشبيه بليغ"],"exp":"شبّه حالة الشاعر وعدم استقراره في السفر بحال المكلَّف بقياس أراضي الله الواسعة. فنوعها: تشبيه تمثيلي. أثرها: تبرز وتجسّد الضياع والشقاء وكثرة الترحال.","answer":0},{"verse":"جاوَزتِ في نُصحِهِ حَدّاً أَضَرَّ بِهِ ... مِن حَيثُ قَدَّرتِ أَنَّ النُّصحَ يَنفَعُهُ","q":"حدّد نوع المحسن البديعي في: «أَضَرَّ بِهِ / يَنفَعُهُ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين الفعلين المتضادين (أَضَرَّ) و(يَنفَعُهُ). فنوعها: طباق إيجاب. أثرها: يبرز المفارقة؛ فالزوجة تريد النفع فإذا بها تضرّه. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"قَد كانَ مُضطَلِعاً بِالخَطبِ يَحمِلُهُ ... فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ","q":"حدّد نوع الصورة الفنية في: «مُضطَلِعاً بِالخَطبِ يَحمِلُهُ».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الخَطب (المصيبة) بحمل مادي ثقيل يوضع على الظهر، فحذف المشبه به وأبقى شيئاً من لوازمه (يَحمِلُهُ). فنوعها: استعارة مكنية. أثرها: تبرز قوة تحمله وصبره في الماضي.","answer":0},{"verse":"فَاستَعمِلي الرِّفقَ في تَأنيبِهِ بَدَلاً ... مِن عَسفِهِ فَهُوَ مُضنى القَلبِ مُوجَعُهُ","q":"حدّد نوع المحسن البديعي في: «الرِّفقَ / عَسفِهِ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين اللفظين المتضادين (الرِّفقَ) و(عَسفِهِ). فنوعها: طباق إيجاب. أثرها: يبرز الفجوة بين ما يحتاجه (الرفق) وما يلقاه (القسوة). والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"قَد كانَ مُضطَلِعاً بِالخَطبِ يَحمِلُهُ ... فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ","q":"حدّد نوع الصورة الفنية في: «فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه خطوب البين (مصائب الفراق) بأحمال ثقيلة تكسر أضلاعه، فحذف المشبه به وأبقى شيئاً من لوازمه. فنوعها: استعارة مكنية. أثرها: تعبّر عن قسوة الفراق وتأثيره المهلك.","answer":0},{"verse":"ما آبَ مِن سَفَرٍ إِلّا وَأَزعَجَهُ ... عَزمٌ إِلى سَفَرٍ بِالرَّغمِ يُزمِعُهُ","q":"حدّد نوع المحسن البديعي في: «آبَ / سَفَرٍ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين (آبَ) أي رجع، و(سَفَرٍ) أي ارتحل. فنوعها: طباق إيجاب. أثرها: يبرز التناقض بين عودته واستقراره وبين ترحاله. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"ما آبَ مِن سَفَرٍ إِلّا وَأَزعَجَهُ ... عَزمٌ إِلى سَفَرٍ بِالرَّغمِ يُزمِعُهُ","q":"حدّد نوع الصورة الفنية في: «وَأَزعَجَهُ عَزمٌ إِلى سَفَرٍ».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه العزم بشخص يزعجه ويقلقه، فحذف المشبه به وأبقى شيئاً من لوازمه (أَزعَجَهُ). فنوعها: استعارة مكنية. أثرها: تبرز أنه مسلوب الإرادة وأن السفر أصبح يطارده.","answer":0},{"verse":"كَأَنَّما هُوَ في حِلٍّ وَمُرتَحَلٍ ... مُوَكَّلٌ بِفَضاءِ اللَهِ يَذرَعُهُ","q":"حدّد نوع المحسن البديعي في: «حِلٍّ / مُرتَحَلٍ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين اللفظين المتضادين (حِلٍّ) و(مُرتَحَلٍ). فنوعها: طباق إيجاب. أثرها: يبرز حالة عدم الاستقرار. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"تَأبى المَطالِبُ إِلّا أَن تَكَلَّفَهُ ... لِلرِّزقِ سَعياً وَلَكِن لَيسَ يَجمَعُهُ","q":"حدّد نوع الصورة الفنية في: «تَأبى المَطالِبُ إِلّا أَن تُكَلِّفَهُ».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه المطالب (الآمال) بإنسان معاند يرفض ويكلّفه بالمشاق، فحذف المشبه به وأبقى شيئاً من لوازمه. فنوعها: استعارة مكنية. أثرها: تجسّد قسوة الحياة وصعوبة نيل الغايات.","answer":0},{"verse":"وَمَن غَدا لابِساً ثَوبَ النّعيمِ بِلا ... شُكرٍ عَلَيهِ فَعنَّه اللَهَ يَنزِعُهُ","q":"حدّد نوع المحسن البديعي في: «لابِساً / يَنزِعُهُ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين (لابِساً) و(يَنزِعُهُ) وهما متضادان. فنوعها: طباق إيجاب. أثرها: يبرز التحول السريع والمخيف من النعيم إلى الفقر. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"إِذا الزَّماعُ أَراهُ في الرَّحيلِ غِنىً ... وَلَو إِلى السَّندِ أَضحى وَهُوَ مُربِعُهُ","q":"حدّد نوع الصورة الفنية في: «الزَّماعُ أَراهُ في الرَّحيلِ غِنىً».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الزَّماع (قوة الإرادة) بشخص يغريه ويصوّر له الغنى في الرحيل، فحذف المشبه به وأبقى شيئاً من لوازمه (أَراهُ). فنوعها: استعارة مكنية. أثرها: تبرز قوة الدافع الداخلي للسفر.","answer":0},{"verse":"عِلماً بِأَنَّ اصطِباري مُعقِبٌ فَرَجاً ... فَأَضيَقُ الأَمرِ إِن فَكَّرتَ أَوسَعُهُ","q":"حدّد نوع المحسن البديعي في: «أَضيَقُ / أَوسَعُهُ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين اللفظين المتضادين (أَضيَقُ) و(أَوسَعُهُ). فنوعها: طباق إيجاب. أثرها: يبرز الأمل ويوضح حتمية مجيء الفرج. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"وَالحِرصُ في الرِّزقِ وَالأَرزاقُ قَد قُسِمَت ... بَغِيٌ أَلا إِنَّ بَغيَ المَرءِ يَصرَعُهُ","q":"حدّد نوع الصورة الفنية في: «إِنَّ بَغيَ المَرءِ يَصرَعُهُ».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه البغي (الظلم والطمع) بمصارع يطرح صاحبه أرضاً، فحذف المشبه به وأبقى شيئاً من لوازمه (يَصرَعُهُ). فنوعها: استعارة مكنية. أثرها: تبرز التحذير الشديد من الطمع وتجسّد نهايته المأساوية.","answer":0},{"verse":"عَلَّ اللَيالي الَّتي أَضنَت بِفُرقَتِنا ... جِسمي سَتَجمَعُني يَوماً وَتَجمَعُهُ","q":"حدّد نوع المحسن البديعي في: «فُرقَتِنا / تَجمَعُهُ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين لفظين متضادين هما الفرقة والجمع. فنوعها: طباق إيجاب. أثرها: يبرز شدة تمسكه بالأمل في اللقاء بعد ألم البعد. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"وَالدَّهرُ يُعطي الفَتى مِن حَيثُ يَمنَعُه ... عَفواً وَيَمنَعُهُ مِن حَيثُ يُطمِعُهُ","q":"حدّد نوع الصورة الفنية في: «وَالدَّهرُ يُعطي الفَتى … وَيَمنَعُهُ».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الدهر (الزمن) بإنسان متحكّم يعطي ويمنع، فحذف المشبه به وأبقى شيئاً من لوازمه. فنوعها: استعارة مكنية. أثرها: تبرز خضوع الإنسان لتقلبات الأيام وعجزه أمامها.","answer":0},{"verse":"وَما مُجاهَدَةُ الإِنسانِ واصِلَةً ... رِزقاً وَلا دَعَةُ الإِنسانِ تَقطَعُهُ","q":"حدّد نوع المحسن البديعي في: «وَما مُجاهَدَةُ الإِنسانِ واصِلَةً رِزقاً … وَلا دَعَةُ الإِنسانِ تَقطَعُهُ».","options":["مقابلة","جناس ناقص","سجع","طباق سلب"],"exp":"قابل بين معنيين متقابلين: (المجاهدة) و(واصلة رزقاً) مقابل (الدعة) و(تقطعه). فنوعها: مقابلة. أثرها: تبرز براءة الشاعر أمام زوجته وأن الرزق بيد الله وحده. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"وَإِن تَغُلَّ أَحَداً مِنّا مَنِيَّتُهُ ... لابُدَّ في غَدِهِ الثّاني سَيَتبَعُهُ","q":"حدّد نوع الصورة الفنية في: «إِن تَغُل أَحَداً مِنّا مَنِيَّتُهُ».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه المَنِيَّة (الموت) بوحش يهلك ويختطف، فحذف المشبه به وأبقى شيئاً من لوازمه (تَغُل). فنوعها: استعارة مكنية. أثرها: تجسّد حتمية الموت وقوته.","answer":0},{"verse":"قَد كانَ مُضطَلِعاً بِالخَطبِ يَحمِلُهُ ... فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ","q":"حدّد نوع المحسن البديعي في: «مُضطَلِعاً / ضُلِّعَت / أَضلُعُهُ».","options":["جناس ناقص","طباق إيجاب","مقابلة","سجع"],"exp":"تشابهت الألفاظ في الحروف واختلفت في المعنى مع اختلاف في بعض الحروف. فنوعه: جناس ناقص، وأثره: يحدث جرساً موسيقياً يطرب الآذان","answer":0},{"verse":"أعطيتُ مُلكاً فَلَم أَحسِن سِياسَتَهُ ... وَكُلُّ مَن لا يَسوسُ المُلكَ يَخلَعُهُ","q":"حدّد نوع الصورة الفنية في: «أُعطيتُ مُلكاً فَلَم أُحسِن سِياسَتَهُ».","options":["استعارة تصريحية","استعارة مكنية","تشبيه","كناية"],"exp":"شبّه (الزوجة والحياة الهانئة في بغداد) بـ (الملك)، فحذف المشبه وصرّح بالمشبه به. فنوعها: استعارة تصريحية. أثرها: تبرز قيمة الزوجة والحياة المستقرة التي ضيّعها وشدة حسرته.","answer":0},{"verse":"يَكفيهِ مِن رَوعَةِ التَّفنيدِ أَنَّ لَهُ ... مِنَ النَّوى كُلَّ يَومٍ ما يُرَوِّعُهُ","q":"حدّد نوع المحسن البديعي في: «رَوعَةِ / يُرَوِّعُهُ».","options":["جناس ناقص","طباق إيجاب","مقابلة","سجع"],"exp":"تشابه اللفظان في أغلب الحروف واختلفا في المعنى. فنوعه: جناس ناقص، وأثره: يحدث جرساً موسيقياً يطرب الآذان","answer":0},{"verse":"اِعتَضتُ مِن وَجهِ خِلّي بَعدَ فُرقَتِهِ ... كَأساً يجَرَّعُ مِنها ما أُجَرِّعُهُ","q":"حدّد نوع الصورة الفنية في: «كَأساً أُجَرَّعُ مِنها ما أُجَرِّعُهُ».","options":["استعارة تصريحية","استعارة مكنية","تشبيه","كناية"],"exp":"شبّه مرارة الفراق والغربة بالكأس المُرّة، فحذف المشبه وصرّح بالمشبه به. فنوعها: استعارة تصريحية. أثرها: تجسّد الألم والغصّة التي يتذوقها في غربته.","answer":0},{"verse":"فَاستَعمِلي الرِّفقَ في تَأنيبِهِ بَدَلاً ... مِن عَسفِهِ فَهُوَ مُضنى القَلبِ مُوجَعُهُ","q":"حدّد نوع الصورة الفنية في: «مُضنى القَلبِ مُوجَعُهُ».","options":["كناية","استعارة مكنية","تشبيه","استعارة تصريحية"],"exp":"كناية عن شدة الحزن. فنوعها: كناية. أثرها: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"عِلماً بِأَنَّ اصطِباري مُعقِبٌ فَرَجاً ... فَأَضيَقُ الأَمرِ إِن فَكَّرتَ أَوسَعُهُ","q":"حدّد نوع الصورة الفنية في: «فَأَضيَقُ الأَمرِ إِن فَكَّرتَ أَوسَعُهُ».","options":["كناية","استعارة مكنية","تشبيه","استعارة تصريحية"],"exp":"كناية عن الفرج بعد الشدة. فنوعها: كناية. أثرها: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"وَمَن غَدا لابِساً ثَوبَ النّعيمِ بِلا ... شُكرٍ عَلَيهِ فَعنَّه اللَهَ يَنزِعُهُ","q":"حدّد نوع الصورة الفنية في: «ثَوبَ النّعيمِ».","options":["تشبيه بليغ","كناية","تشبيه تمثيلي","استعارة تصريحية"],"exp":"شبّه النعيم بالثوب بحذف الأداة ووجه الشبه (تشبيه بليغ). فنوعها: تشبيه بليغ. أثرها: تبرز وتجسّد إحاطة النعمة بصاحبها كأنها تغطيه.","answer":0}],"athar":[{"verse":"فَاستَعمِلي الرِّفقَ في تَأنيبِهِ بَدَلاً ... مِن عَسفِهِ فَهُوَ مُضنى القَلبِ مُوجَعُهُ","q":"بيّن الأثر الفني للمحسن البديعي في: «الرِّفقَ / عَسفِهِ».","options":["يبرز الفجوة بين ما يحتاجه (الرفق) وما يلقاه (القسوة)","تبرز وتجسّد الضياع والشقاء وكثرة الترحال","تبرز أنه مسلوب الإرادة وأن السفر أصبح يطارده","يبرز الأمل ويوضح حتمية مجيء الفرج"],"exp":"النوع: طباق إيجاب. جمع بين اللفظين المتضادين (الرِّفقَ) و(عَسفِهِ). الأثر: يبرز الفجوة بين ما يحتاجه (الرفق) وما يلقاه (القسوة). والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"قَد كانَ مُضطَلِعاً بِالخَطبِ يَحمِلُهُ ... فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ».","options":["تعبّر عن قسوة الفراق وتأثيره المهلك","تجسّد قسوة الحياة وصعوبة نيل الغايات","يبرز شدة تمسكه بالأمل في اللقاء بعد ألم البعد","تبرز قيمة الزوجة والحياة المستقرة التي ضيّعها وشدة حسرته"],"exp":"النوع: استعارة مكنية. شبّه خطوب البين (مصائب الفراق) بأحمال ثقيلة تكسر أضلاعه، فحذف المشبه به وأبقى شيئاً من لوازمه. الأثر: تعبّر عن قسوة الفراق وتأثيره المهلك.","answer":0},{"verse":"ما آبَ مِن سَفَرٍ إِلّا وَأَزعَجَهُ ... عَزمٌ إِلى سَفَرٍ بِالرَّغمِ يُزمِعُهُ","q":"بيّن الأثر الفني للمحسن البديعي في: «آبَ / سَفَرٍ».","options":["يبرز التناقض بين عودته واستقراره وبين ترحاله","تبرز براءة الشاعر أمام زوجته وأن الرزق بيد الله وحده","الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","تبرز وتجسّد الضياع والشقاء وكثرة الترحال"],"exp":"النوع: طباق إيجاب. جمع بين (آبَ) أي رجع، و(سَفَرٍ) أي ارتحل. الأثر: يبرز التناقض بين عودته واستقراره وبين ترحاله. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"ما آبَ مِن سَفَرٍ إِلّا وَأَزعَجَهُ ... عَزمٌ إِلى سَفَرٍ بِالرَّغمِ يُزمِعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «وَأَزعَجَهُ عَزمٌ إِلى سَفَرٍ».","options":["تبرز أنه مسلوب الإرادة وأن السفر أصبح يطارده","تبرز فخره بنفسه واعتزازه بقومه","تبرز قوة تحمله وصبره في الماضي","تجسّد قسوة الحياة وصعوبة نيل الغايات"],"exp":"النوع: استعارة مكنية. شبّه العزم بشخص يزعجه ويقلقه، فحذف المشبه به وأبقى شيئاً من لوازمه (أَزعَجَهُ). الأثر: تبرز أنه مسلوب الإرادة وأن السفر أصبح يطارده.","answer":0},{"verse":"كَأَنَّما هُوَ في حِلٍّ وَمُرتَحَلٍ ... مُوَكَّلٌ بِفَضاءِ اللَهِ يَذرَعُهُ","q":"بيّن الأثر الفني للمحسن البديعي في: «حِلٍّ / مُرتَحَلٍ».","options":["يبرز حالة عدم الاستقرار","تعبّر عن قسوة الفراق وتأثيره المهلك","تبرز قوة الدافع الداخلي للسفر","تبرز براءة الشاعر أمام زوجته وأن الرزق بيد الله وحده"],"exp":"النوع: طباق إيجاب. جمع بين اللفظين المتضادين (حِلٍّ) و(مُرتَحَلٍ). الأثر: يبرز حالة عدم الاستقرار. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"تَأبى المَطالِبُ إِلّا أَن تَكَلَّفَهُ ... لِلرِّزقِ سَعياً وَلَكِن لَيسَ يَجمَعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «تَأبى المَطالِبُ إِلّا أَن تُكَلِّفَهُ».","options":["تجسّد قسوة الحياة وصعوبة نيل الغايات","تبرز التحذير الشديد من الطمع وتجسّد نهايته المأساوية","يحدث جرساً موسيقياً يطرب الآذان","تبرز فخره بنفسه واعتزازه بقومه"],"exp":"النوع: استعارة مكنية. شبّه المطالب (الآمال) بإنسان معاند يرفض ويكلّفه بالمشاق، فحذف المشبه به وأبقى شيئاً من لوازمه. الأثر: تجسّد قسوة الحياة وصعوبة نيل الغايات.","answer":0},{"verse":"وَمَن غَدا لابِساً ثَوبَ النّعيمِ بِلا ... شُكرٍ عَلَيهِ فَعنَّه اللَهَ يَنزِعُهُ","q":"بيّن الأثر الفني للمحسن البديعي في: «لابِساً / يَنزِعُهُ».","options":["يبرز التحول السريع والمخيف من النعيم إلى الفقر","تجسّد الألم والغصّة التي يتذوقها في غربته","تصور فرحته بلقاء الأحبة بعد طول غياب","تعبّر عن قسوة الفراق وتأثيره المهلك"],"exp":"النوع: طباق إيجاب. جمع بين (لابِساً) و(يَنزِعُهُ) وهما متضادان. الأثر: يبرز التحول السريع والمخيف من النعيم إلى الفقر. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"إِذا الزَّماعُ أَراهُ في الرَّحيلِ غِنىً ... وَلَو إِلى السَّندِ أَضحى وَهُوَ مُربِعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «الزَّماعُ أَراهُ في الرَّحيلِ غِنىً».","options":["تبرز قوة الدافع الداخلي للسفر","يبرز المفارقة؛ فالزوجة تريد النفع فإذا بها تضرّه","تبرز أنه مسلوب الإرادة وأن السفر أصبح يطارده","تبرز التحذير الشديد من الطمع وتجسّد نهايته المأساوية"],"exp":"النوع: استعارة مكنية. شبّه الزَّماع (قوة الإرادة) بشخص يغريه ويصوّر له الغنى في الرحيل، فحذف المشبه به وأبقى شيئاً من لوازمه (أَراهُ). الأثر: تبرز قوة الدافع الداخلي للسفر.","answer":0},{"verse":"عِلماً بِأَنَّ اصطِباري مُعقِبٌ فَرَجاً ... فَأَضيَقُ الأَمرِ إِن فَكَّرتَ أَوسَعُهُ","q":"بيّن الأثر الفني للمحسن البديعي في: «أَضيَقُ / أَوسَعُهُ».","options":["يبرز الأمل ويوضح حتمية مجيء الفرج","تجسّد قسوة الحياة وصعوبة نيل الغايات","تبرز خضوع الإنسان لتقلبات الأيام وعجزه أمامها","تجسّد الألم والغصّة التي يتذوقها في غربته"],"exp":"النوع: طباق إيجاب. جمع بين اللفظين المتضادين (أَضيَقُ) و(أَوسَعُهُ). الأثر: يبرز الأمل ويوضح حتمية مجيء الفرج. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"وَالحِرصُ في الرِّزقِ وَالأَرزاقُ قَد قُسِمَت ... بَغِيٌ أَلا إِنَّ بَغيَ المَرءِ يَصرَعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «إِنَّ بَغيَ المَرءِ يَصرَعُهُ».","options":["تبرز التحذير الشديد من الطمع وتجسّد نهايته المأساوية","تجسّد حتمية الموت وقوته","تبرز وتجسّد إحاطة النعمة بصاحبها كأنها تغطيه","يبرز المفارقة؛ فالزوجة تريد النفع فإذا بها تضرّه"],"exp":"النوع: استعارة مكنية. شبّه البغي (الظلم والطمع) بمصارع يطرح صاحبه أرضاً، فحذف المشبه به وأبقى شيئاً من لوازمه (يَصرَعُهُ). الأثر: تبرز التحذير الشديد من الطمع وتجسّد نهايته المأساوية.","answer":0},{"verse":"عَلَّ اللَيالي الَّتي أَضنَت بِفُرقَتِنا ... جِسمي سَتَجمَعُني يَوماً وَتَجمَعُهُ","q":"بيّن الأثر الفني للمحسن البديعي في: «فُرقَتِنا / تَجمَعُهُ».","options":["يبرز شدة تمسكه بالأمل في اللقاء بعد ألم البعد","توضح قوة إيمانه ويقينه بالبعث والحساب","يبرز الفجوة بين ما يحتاجه (الرفق) وما يلقاه (القسوة)","تجسّد قسوة الحياة وصعوبة نيل الغايات"],"exp":"النوع: طباق إيجاب. جمع بين لفظين متضادين هما الفرقة والجمع. الأثر: يبرز شدة تمسكه بالأمل في اللقاء بعد ألم البعد. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"وَالدَّهرُ يُعطي الفَتى مِن حَيثُ يَمنَعُه ... عَفواً وَيَمنَعُهُ مِن حَيثُ يُطمِعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «وَالدَّهرُ يُعطي الفَتى … وَيَمنَعُهُ».","options":["تبرز خضوع الإنسان لتقلبات الأيام وعجزه أمامها","يبرز التناقض بين عودته واستقراره وبين ترحاله","تبرز قوة الدافع الداخلي للسفر","تجسّد حتمية الموت وقوته"],"exp":"النوع: استعارة مكنية. شبّه الدهر (الزمن) بإنسان متحكّم يعطي ويمنع، فحذف المشبه به وأبقى شيئاً من لوازمه. الأثر: تبرز خضوع الإنسان لتقلبات الأيام وعجزه أمامها.","answer":0},{"verse":"وَما مُجاهَدَةُ الإِنسانِ واصِلَةً ... رِزقاً وَلا دَعَةُ الإِنسانِ تَقطَعُهُ","q":"بيّن الأثر الفني للمحسن البديعي في: «وَما مُجاهَدَةُ الإِنسانِ واصِلَةً رِزقاً … وَلا دَعَةُ الإِنسانِ تَقطَعُهُ».","options":["تبرز براءة الشاعر أمام زوجته وأن الرزق بيد الله وحده","تبرز التحذير الشديد من الطمع وتجسّد نهايته المأساوية","تبرز قيمة الزوجة والحياة المستقرة التي ضيّعها وشدة حسرته","توضح قوة إيمانه ويقينه بالبعث والحساب"],"exp":"النوع: مقابلة. قابل بين معنيين متقابلين: (المجاهدة) و(واصلة رزقاً) مقابل (الدعة) و(تقطعه). الأثر: تبرز براءة الشاعر أمام زوجته وأن الرزق بيد الله وحده. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"وَإِن تَغُلَّ أَحَداً مِنّا مَنِيَّتُهُ ... لابُدَّ في غَدِهِ الثّاني سَيَتبَعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «إِن تَغُل أَحَداً مِنّا مَنِيَّتُهُ».","options":["تجسّد حتمية الموت وقوته","الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","تبرز وتجسّد الضياع والشقاء وكثرة الترحال","يبرز التناقض بين عودته واستقراره وبين ترحاله"],"exp":"النوع: استعارة مكنية. شبّه المَنِيَّة (الموت) بوحش يهلك ويختطف، فحذف المشبه به وأبقى شيئاً من لوازمه (تَغُل). الأثر: تجسّد حتمية الموت وقوته.","answer":0},{"verse":"قَد كانَ مُضطَلِعاً بِالخَطبِ يَحمِلُهُ ... فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ","q":"بيّن الأثر الفني للمحسن البديعي في: «مُضطَلِعاً / ضُلِّعَت / أَضلُعُهُ».","options":["يحدث جرساً موسيقياً يطرب الآذان","يبرز المعنى ويوضحه ويقويه بالتضاد","الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","تجسيد المعنى المجرد وبث الحياة فيه"],"exp":"النوع: جناس ناقص. تشابهت الألفاظ في الحروف واختلفت في المعنى مع اختلاف في بعض الحروف. الأثر: يحدث جرساً موسيقياً يطرب الآذان","answer":0},{"verse":"أعطيتُ مُلكاً فَلَم أَحسِن سِياسَتَهُ ... وَكُلُّ مَن لا يَسوسُ المُلكَ يَخلَعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «أُعطيتُ مُلكاً فَلَم أُحسِن سِياسَتَهُ».","options":["تبرز قيمة الزوجة والحياة المستقرة التي ضيّعها وشدة حسرته","يبرز التحول السريع والمخيف من النعيم إلى الفقر","تبرز خضوع الإنسان لتقلبات الأيام وعجزه أمامها","الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم"],"exp":"النوع: استعارة تصريحية. شبّه (الزوجة والحياة الهانئة في بغداد) بـ (الملك)، فحذف المشبه وصرّح بالمشبه به. الأثر: تبرز قيمة الزوجة والحياة المستقرة التي ضيّعها وشدة حسرته.","answer":0},{"verse":"يَكفيهِ مِن رَوعَةِ التَّفنيدِ أَنَّ لَهُ ... مِنَ النَّوى كُلَّ يَومٍ ما يُرَوِّعُهُ","q":"بيّن الأثر الفني للمحسن البديعي في: «رَوعَةِ / يُرَوِّعُهُ».","options":["يحدث جرساً موسيقياً يطرب الآذان","يبرز المعنى ويوضحه ويقويه بالتضاد","الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","تجسيد المعنى المجرد وبث الحياة فيه"],"exp":"النوع: جناس ناقص. تشابه اللفظان في أغلب الحروف واختلفا في المعنى. الأثر: يحدث جرساً موسيقياً يطرب الآذان","answer":0},{"verse":"اِعتَضتُ مِن وَجهِ خِلّي بَعدَ فُرقَتِهِ ... كَأساً يجَرَّعُ مِنها ما أُجَرِّعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «كَأساً أُجَرَّعُ مِنها ما أُجَرِّعُهُ».","options":["تجسّد الألم والغصّة التي يتذوقها في غربته","تصور فرحته بلقاء الأحبة بعد طول غياب","تعبّر عن قسوة الفراق وتأثيره المهلك","يبرز التحول السريع والمخيف من النعيم إلى الفقر"],"exp":"النوع: استعارة تصريحية. شبّه مرارة الفراق والغربة بالكأس المُرّة، فحذف المشبه وصرّح بالمشبه به. الأثر: تجسّد الألم والغصّة التي يتذوقها في غربته.","answer":0},{"verse":"فَاستَعمِلي الرِّفقَ في تَأنيبِهِ بَدَلاً ... مِن عَسفِهِ فَهُوَ مُضنى القَلبِ مُوجَعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «مُضنى القَلبِ مُوجَعُهُ».","options":["الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","يحدث جرساً موسيقياً يطرب الآذان","يبرز المعنى ويوضحه ويقويه بالتضاد","تقريب الصورة إلى الذهن بتشبيه حسي مألوف"],"exp":"النوع: كناية. كناية عن شدة الحزن. الأثر: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"عِلماً بِأَنَّ اصطِباري مُعقِبٌ فَرَجاً ... فَأَضيَقُ الأَمرِ إِن فَكَّرتَ أَوسَعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «فَأَضيَقُ الأَمرِ إِن فَكَّرتَ أَوسَعُهُ».","options":["الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","يحدث جرساً موسيقياً يطرب الآذان","يبرز المعنى ويوضحه ويقويه بالتضاد","تقريب الصورة إلى الذهن بتشبيه حسي مألوف"],"exp":"النوع: كناية. كناية عن الفرج بعد الشدة. الأثر: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"وَمَن غَدا لابِساً ثَوبَ النّعيمِ بِلا ... شُكرٍ عَلَيهِ فَعنَّه اللَهَ يَنزِعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «ثَوبَ النّعيمِ».","options":["تبرز وتجسّد إحاطة النعمة بصاحبها كأنها تغطيه","الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم","يبرز المفارقة؛ فالزوجة تريد النفع فإذا بها تضرّه","تبرز أنه مسلوب الإرادة وأن السفر أصبح يطارده"],"exp":"النوع: تشبيه بليغ. شبّه النعيم بالثوب بحذف الأداة ووجه الشبه (تشبيه بليغ). الأثر: تبرز وتجسّد إحاطة النعمة بصاحبها كأنها تغطيه.","answer":0},{"verse":"كَأَنَّما هُوَ في حِلٍّ وَمُرتَحَلٍ ... مُوَكَّلٌ بِفَضاءِ اللَهِ يَذرَعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «كَأَنَّما هُوَ في حِلٍّ وَمُرتَحَلٍ … مُوَكَّلٌ بِفَضاءِ اللَهِ يَذرَعُهُ».","options":["تبرز وتجسّد الضياع والشقاء وكثرة الترحال","تعبّر عن قسوة الفراق وتأثيره المهلك","يبرز التحول السريع والمخيف من النعيم إلى الفقر","تبرز خضوع الإنسان لتقلبات الأيام وعجزه أمامها"],"exp":"النوع: تشبيه تمثيلي. شبّه حالة الشاعر وعدم استقراره في السفر بحال المكلَّف بقياس أراضي الله الواسعة. الأثر: تبرز وتجسّد الضياع والشقاء وكثرة الترحال.","answer":0},{"verse":"جاوَزتِ في نُصحِهِ حَدّاً أَضَرَّ بِهِ ... مِن حَيثُ قَدَّرتِ أَنَّ النُّصحَ يَنفَعُهُ","q":"بيّن الأثر الفني للمحسن البديعي في: «أَضَرَّ بِهِ / يَنفَعُهُ».","options":["يبرز المفارقة؛ فالزوجة تريد النفع فإذا بها تضرّه","يبرز الأمل ويوضح حتمية مجيء الفرج","تجسّد حتمية الموت وقوته","تبرز وتجسّد إحاطة النعمة بصاحبها كأنها تغطيه"],"exp":"النوع: طباق إيجاب. جمع بين الفعلين المتضادين (أَضَرَّ) و(يَنفَعُهُ). الأثر: يبرز المفارقة؛ فالزوجة تريد النفع فإذا بها تضرّه. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"قَد كانَ مُضطَلِعاً بِالخَطبِ يَحمِلُهُ ... فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ","q":"بيّن الأثر الفني للصورة في قوله: «مُضطَلِعاً بِالخَطبِ يَحمِلُهُ».","options":["تبرز قوة تحمله وصبره في الماضي","تبرز قيمة الزوجة والحياة المستقرة التي ضيّعها وشدة حسرته","توضح قوة إيمانه ويقينه بالبعث والحساب","تعبّر عن قسوة الفراق وتأثيره المهلك"],"exp":"النوع: استعارة مكنية. شبّه الخَطب (المصيبة) بحمل مادي ثقيل يوضع على الظهر، فحذف المشبه به وأبقى شيئاً من لوازمه (يَحمِلُهُ). الأثر: تبرز قوة تحمله وصبره في الماضي.","answer":0}]},"sum":[{"t":"تشبيه تمثيلي","q":"كَأَنَّما هُوَ في حِلٍّ وَمُرتَحَلٍ … مُوَكَّلٌ بِفَضاءِ اللَهِ يَذرَعُهُ","m":"شبّه حالة الشاعر وعدم استقراره في السفر بحال المكلَّف بقياس أراضي الله الواسعة.","e":"تبرز وتجسّد الضياع والشقاء وكثرة الترحال"},{"t":"طباق إيجاب","q":"أَضَرَّ بِهِ / يَنفَعُهُ","m":"جمع بين الفعلين المتضادين (أَضَرَّ) و(يَنفَعُهُ).","e":"يبرز المفارقة؛ فالزوجة تريد النفع فإذا بها تضرّه"},{"t":"استعارة مكنية","q":"مُضطَلِعاً بِالخَطبِ يَحمِلُهُ","m":"شبّه الخَطب (المصيبة) بحمل مادي ثقيل يوضع على الظهر، فحذف المشبه به وأبقى شيئاً من لوازمه (يَحمِلُهُ).","e":"تبرز قوة تحمله وصبره في الماضي"},{"t":"طباق إيجاب","q":"الرِّفقَ / عَسفِهِ","m":"جمع بين اللفظين المتضادين (الرِّفقَ) و(عَسفِهِ).","e":"يبرز الفجوة بين ما يحتاجه (الرفق) وما يلقاه (القسوة)"},{"t":"استعارة مكنية","q":"فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ","m":"شبّه خطوب البين (مصائب الفراق) بأحمال ثقيلة تكسر أضلاعه، فحذف المشبه به وأبقى شيئاً من لوازمه.","e":"تعبّر عن قسوة الفراق وتأثيره المهلك"},{"t":"طباق إيجاب","q":"آبَ / سَفَرٍ","m":"جمع بين (آبَ) أي رجع، و(سَفَرٍ) أي ارتحل.","e":"يبرز التناقض بين عودته واستقراره وبين ترحاله"},{"t":"استعارة مكنية","q":"وَأَزعَجَهُ عَزمٌ إِلى سَفَرٍ","m":"شبّه العزم بشخص يزعجه ويقلقه، فحذف المشبه به وأبقى شيئاً من لوازمه (أَزعَجَهُ).","e":"تبرز أنه مسلوب الإرادة وأن السفر أصبح يطارده"},{"t":"طباق إيجاب","q":"حِلٍّ / مُرتَحَلٍ","m":"جمع بين اللفظين المتضادين (حِلٍّ) و(مُرتَحَلٍ).","e":"يبرز حالة عدم الاستقرار"},{"t":"استعارة مكنية","q":"تَأبى المَطالِبُ إِلّا أَن تُكَلِّفَهُ","m":"شبّه المطالب (الآمال) بإنسان معاند يرفض ويكلّفه بالمشاق، فحذف المشبه به وأبقى شيئاً من لوازمه.","e":"تجسّد قسوة الحياة وصعوبة نيل الغايات"},{"t":"طباق إيجاب","q":"لابِساً / يَنزِعُهُ","m":"جمع بين (لابِساً) و(يَنزِعُهُ) وهما متضادان.","e":"يبرز التحول السريع والمخيف من النعيم إلى الفقر"},{"t":"استعارة مكنية","q":"الزَّماعُ أَراهُ في الرَّحيلِ غِنىً","m":"شبّه الزَّماع (قوة الإرادة) بشخص يغريه ويصوّر له الغنى في الرحيل، فحذف المشبه به وأبقى شيئاً من لوازمه (أَراهُ).","e":"تبرز قوة الدافع الداخلي للسفر"},{"t":"طباق إيجاب","q":"أَضيَقُ / أَوسَعُهُ","m":"جمع بين اللفظين المتضادين (أَضيَقُ) و(أَوسَعُهُ).","e":"يبرز الأمل ويوضح حتمية مجيء الفرج"},{"t":"استعارة مكنية","q":"إِنَّ بَغيَ المَرءِ يَصرَعُهُ","m":"شبّه البغي (الظلم والطمع) بمصارع يطرح صاحبه أرضاً، فحذف المشبه به وأبقى شيئاً من لوازمه (يَصرَعُهُ).","e":"تبرز التحذير الشديد من الطمع وتجسّد نهايته المأساوية"},{"t":"طباق إيجاب","q":"فُرقَتِنا / تَجمَعُهُ","m":"جمع بين لفظين متضادين هما الفرقة والجمع.","e":"يبرز شدة تمسكه بالأمل في اللقاء بعد ألم البعد"},{"t":"استعارة مكنية","q":"وَالدَّهرُ يُعطي الفَتى … وَيَمنَعُهُ","m":"شبّه الدهر (الزمن) بإنسان متحكّم يعطي ويمنع، فحذف المشبه به وأبقى شيئاً من لوازمه.","e":"تبرز خضوع الإنسان لتقلبات الأيام وعجزه أمامها"},{"t":"مقابلة","q":"وَما مُجاهَدَةُ الإِنسانِ واصِلَةً رِزقاً … وَلا دَعَةُ الإِنسانِ تَقطَعُهُ","m":"قابل بين معنيين متقابلين: (المجاهدة) و(واصلة رزقاً) مقابل (الدعة) و(تقطعه).","e":"تبرز براءة الشاعر أمام زوجته وأن الرزق بيد الله وحده"},{"t":"استعارة مكنية","q":"إِن تَغُل أَحَداً مِنّا مَنِيَّتُهُ","m":"شبّه المَنِيَّة (الموت) بوحش يهلك ويختطف، فحذف المشبه به وأبقى شيئاً من لوازمه (تَغُل).","e":"تجسّد حتمية الموت وقوته"},{"t":"جناس ناقص","q":"مُضطَلِعاً / ضُلِّعَت / أَضلُعُهُ","m":"تشابهت الألفاظ في الحروف واختلفت في المعنى مع اختلاف في بعض الحروف.","e":"يحدث جرساً موسيقياً يطرب الآذان"},{"t":"استعارة تصريحية","q":"أُعطيتُ مُلكاً فَلَم أُحسِن سِياسَتَهُ","m":"شبّه (الزوجة والحياة الهانئة في بغداد) بـ (الملك)، فحذف المشبه وصرّح بالمشبه به.","e":"تبرز قيمة الزوجة والحياة المستقرة التي ضيّعها وشدة حسرته"},{"t":"جناس ناقص","q":"رَوعَةِ / يُرَوِّعُهُ","m":"تشابه اللفظان في أغلب الحروف واختلفا في المعنى.","e":"يحدث جرساً موسيقياً يطرب الآذان"},{"t":"استعارة تصريحية","q":"كَأساً أُجَرَّعُ مِنها ما أُجَرِّعُهُ","m":"شبّه مرارة الفراق والغربة بالكأس المُرّة، فحذف المشبه وصرّح بالمشبه به.","e":"تجسّد الألم والغصّة التي يتذوقها في غربته"},{"t":"كناية","q":"مُضنى القَلبِ مُوجَعُهُ","m":"كناية عن شدة الحزن.","e":"الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم"},{"t":"كناية","q":"فَأَضيَقُ الأَمرِ إِن فَكَّرتَ أَوسَعُهُ","m":"كناية عن الفرج بعد الشدة.","e":"الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم"},{"t":"تشبيه بليغ","q":"ثَوبَ النّعيمِ","m":"شبّه النعيم بالثوب بحذف الأداة ووجه الشبه (تشبيه بليغ).","e":"تبرز وتجسّد إحاطة النعمة بصاحبها كأنها تغطيه"}]},"t_omar":{"title":"مفتاح شخصية عمر","icon":"fa-key","mix":{"naw":3,"athar":3},"pool":{"naw":[{"verse":"من نص (مفتاح شخصية عمر): «مفتاحُ الشخصيةِ هو الأداةُ الصغيرةُ التي تفتحُ لنا أبوابَها … وهو كمفتاح البيتِ في كثير من المشابه والأغراض»","q":"حدّد نوع الصورة الفنية في: «مفتاحُ الشخصيةِ … كمفتاح البيتِ في كثير من المشابه والأغراض».","options":["تشبيه","استعارة مكنية","استعارة تصريحية","كناية"],"exp":"شبّه مفتاح الشخصية بمفتاح البيت الذي يفتح الأبواب المغلقة. فنوعها: تشبيه. أثرها: تبرز أهمية هذا المفتاح في فهم دوافع العظماء.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «بيت شامخ عليه باب مكين … وبيت ضئيل عليه باب مزعزع»","q":"حدّد نوع المحسن البديعي في: «بيت شامخ عليه باب مكين … وبيت ضئيل عليه باب مزعزع».","options":["مقابلة","جناس ناقص","سجع","طباق سلب"],"exp":"قابل بين صورتين متقابلتين: (شامخ/مكين) في مقابل (ضئيل/مزعزع). فنوعها: مقابلة. أثرها: تبرز التناقض بين وضوح الشخصيات العظيمة وغموض وتقلب الشخصيات التافهة. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «فيكونُ البيتُ كالحصن المغلَقِ ما لم تَكُنْ معكَ هذه الأداة»","q":"حدّد نوع الصورة الفنية في: «فيكونُ البيتُ كالحصن المغلَقِ ما لم تَكُنْ معكَ هذه الأداة».","options":["تشبيه","استعارة مكنية","استعارة تصريحية","كناية"],"exp":"شبّه البيت (الشخصية) بالحصن المغلق. فنوعها: تشبيه. أثرها: تبرز صعوبة فهم الشخصيات دون معرفة المفتاح الذي يحرّكها.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «لا بالكِبَر والصِّغَر، ولا بالحُسْن والدَّمامة، ولا بالفضيلة والنقيصة»","q":"حدّد نوع المحسن البديعي في: «الكِبَر والصِّغَر / الحُسْن والدَّمامة / الفضيلة والنقيصة».","options":["طباق إيجاب","جناس ناقص","سجع","طباق سلب"],"exp":"جمع بين ثلاثة أزواج من الألفاظ المتضادة. فنوعها: طباق إيجاب. أثرها: يؤكد أن مفتاح الشخصية أعمق بكثير من هذه المظاهر السطحية. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «أثرها كالشمس الطالعةِ تروِّعُنا بإشراقِها في أوقاتِها وبروجِها»","q":"حدّد نوع الصورة الفنية في: «أثرها كالشمس الطالعةِ تروِّعُنا بإشراقِها في أوقاتِها وبروجِها».","options":["تشبيه","استعارة مكنية","استعارة تصريحية","كناية"],"exp":"شبّه انتظام عمل الشخصية العظيمة بانتظام شروق الشمس. فنوعها: تشبيه. أثرها: تبرز الوضوح والجلال في شخصية عمر.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «يعطي ويمنع لا بخلاً ولا كرماً»","q":"حدّد نوع المحسن البديعي في: «يعطي / يمنع».","options":["طباق إيجاب","جناس ناقص","سجع","طباق سلب"],"exp":"جمع بين (يعطي) و(يمنع) وهما متضادان، وبين (بخلاً) و(كرماً). فنوعها: طباق إيجاب. أثرها: يبرز المفارقة العجيبة في تصرفات الممدوح وحيرة الناس فيها. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «ثم لا تحيِّرُنا لمحةُ عينٍ كما تحيِّرُنا الذبالةُ الضئيلةُ تومِضُ لحظةً وتختفي مِنْ بعيد»","q":"حدّد نوع الصورة الفنية في: «تحيِّرُنا الذبالةُ الضئيلةُ تومِضُ لحظةً وتختفي مِنْ بعيد».","options":["تشبيه","استعارة مكنية","استعارة تصريحية","كناية"],"exp":"شبّه الشخصية الضعيفة المتقلبة بالذبالة (الشعلة الضعيفة) التي تومض وتختفي. فنوعها: تشبيه. أثرها: تبرز الشخصيات التافهة المتقلبة وتباينها مع وضوح العظماء.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «الشخصية المنقوصة … الشخصية الكاملة»","q":"حدّد ن فنوعها: استعارة مكنية. أثرها: تبرز عظمة مجد الأنصار ورفعته.","answer":0},{"verse":"ومنْ خير حيٍّ تعلمونَ لجارهِمِ ... إذا اختارَهُم في الأمنِ أو في الزَّلازلِ","q":"حدّد نوع المحسن البديعي في: «الأمن / الزلازل».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين (الأمن) و(الزلازل) وهما متقابلان في المعنى. فنوعها: طباق إيجاب. أثرها: يوضح المعنى ويؤكد ثبات المسلمين وحسن معاملتهم وحمايتهم لجارهم في الرخاء والشدائد. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"ألا أيُّها الساعي لِيُدْرِكَ مَجْدَنا ... نأتْكَ العُلا فارْبِعْ عليكَ فَسَائِلِ","q":"حدّد نوع الصورة الفنية في: «نأتْكَ العُلا».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه العُلا بإنسان يبتعد وينأى، فحذف المشبه به وأبقى شيئاً من لوازمه (نأتْ). فنوعها: استعارة مكنية. أثرها: توضح المكانة العظيمة للأنصار واستحالة لحاق الخصوم بهم.","answer":0},{"verse":"وفينا إذا ما شُبَّتِ الحَرْبُ سادَةٌ ... كهولٌ وفِتيانٌ طوالُ الحَمائلِ","q":"حدّد نوع المحسن البديعي في: «كهولٌ / فِتيانٌ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين لفظين متضادين هما (كهولٌ) و(فِتيانٌ). فنوعها: طباق إيجاب. أثرها: يؤكد تكامل القوة والشجاعة في مجتمع المسلمين وشمولها لجميع الأعمار. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"فهَلْ يَسْتَوِي ماءان أخضرُ زاخِرٌ ... وحسي ظنونٌ ماؤهُ غيرُ فاضلِ","q":"حدّد نوع الصورة الفنية في: «ماءان: أخضرُ زاخِرٌ / وحسي ظنونٌ».","options":["استعارة تصريحية","استعارة مكنية","تشبيه","كناية"],"exp":"شبّه جيل الصحابة بالماء الغزير النقي (أخضر زاخر)، وشبّه الكفار بالماء القليل العكر (حسي ظنون)، فحذف المشبه وصرّح بالمشبه به. فنوعها: استعارة تصريحية. أثرها: تبرز التناقض الشاسع بين نقاء المؤمنين وفساد الكافرين.","answer":0},{"verse":"وكُنَّا مَتَى يغزُ النَّبيُّ قبيلةً ... نصلْ حافَتَيْهِ بالقَنا والقَنَابِلِ","q":"حدّد نوع المحسن البديعي في: «القَنا / القَنَابِلِ».","options":["جناس ناقص","طباق إيجاب","مقابلة","سجع"],"exp":"تشابه اللفظان في الحروف واختلفا في المعنى مع زيادة حروف. فنوعه: جنا تركيبه كعصير الشجرة».","options":["تشبيه","استعارة مكنية","استعارة تصريحية","كناية"],"exp":"شبّه الكائن الروحي المكتنّ في الشعب بعصير الشجرة الذي لا يُرى عمله ولكن الشجرة كلها هي عمله. فنوعها: تشبيه. أثرها: يبرز أهمية هذا الكائن الروحي الخفي وتأثيره الشامل المُحيي للأمة.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «ليست حقيقةُ الأُمَّةِ في هذا الظَّاهِرِ الذي يبدو … ولكنَّ تلك الحقيقة هي الكائنُ الرّوحِيُّ المكتَنُّ في الشَّعْبِ»","q":"حدّد نوع المحسن البديعي في: «الظاهر / المكتنّ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين لفظين متضادين هما (الظاهر) و(المكتنّ). فنوعها: طباق إيجاب. أثرها: يبرز التناقض بين المظهر الشكلي للأمة وجوهرها الروحي الخفي. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «حتى ليشعر الإنسان أن لأرضه أمومة الأم التي ولدته، ولقومه أبوة الأب الذي جاء به إلى الحياة»","q":"حدّد نوع الصورة الفنية في: «أمومة الأم … وأبوة الأب».","options":["تشبيه","استعارة مكنية","استعارة تصريحية","كناية"],"exp":"شبّه الأرض بالأم والقوم بالأب. فنوعها: تشبيه. أثرها: تبرز أهمية العادات وتجسّد الرابطة بين الإنسان ووطنه وقومه.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «فهذا شعبٌ خادمٌ لا مخدومٌ، تابعٌ لا متبوعٌ»","q":"حدّد نوع المحسن البديعي في: «خادم / مخدوم ، تابع / متبوع».","options":["طباق إيجاب","جناس ناقص","سجع","طباق سلب"],"exp":"جمع بين زوجين من الألفاظ المتضادة. فنوعها: طباق إيجاب. أثرها: يبرز مدى المهانة وفقدان الإرادة والسيادة عند الشعب المقلّد لغيره. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «روح الأمة»","q":"حدّد نوع الصورة الفنية في: «روح الأمة».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الأمة بإنسان له روح، فحذف المشبه به (الإنسان) وأبقى شيئاً من لوازمه (الروح). فنوعها: استعارة مكنية. أثرها: تبرز حيوية الأمة وترابطها.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «والحُكْمُ على ماضيهم بالقَتْلِ مَحْواً ونِسياناً … فتقييدُ مُسْتَقْبَلِهم في الأغلالِ»","q":"حدّد نوع المحسن البديعي في: «ماضيهم / مستقبلهم».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين لفظين متضادين هما (ماضيهم) و(مستقبلهم). فنوعها: طباق إيجاب. أثرها: يبرز شمولية المخطط الاستعماري المدمّر. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «يعمل في الحيز الباطن … متسلطاً على الفكر … مُصَرِّفاً لبواعث النفس»","q":"حدّد نوع الصورة الفنية في: «يعمل في الحيز الباطن … متسلطاً على الفكر».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الخُلق القوي (الدين واللغة والعادات) بحاكم أو قائد يتسلط ويتحكم. فنوعها: استعارة مكنية. أثرها: تبرز قوة تأثير هذه المقومات في دوافع الإنسان.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «فيغتني الغنيُّ وهو آمنٌ، ويفتقِرُ الفقيرُ وهو قانِعٌ»","q":"حدّد نوع المحسن البديعي في: «فيغتني الغنيُّ وهو آمنٌ، ويفتقرُ الفقيرُ وهو قانعٌ».","options":["مقابلة","جناس ناقص","سجع","طباق سلب"],"exp":"قابل بين حال الغني وحال الفقير: (يغتني / يفتقر) و(آمن / قانع). فنوعها: مقابلة. أثرها: يبرز قدرة الدين على إحداث التوازن الاجتماعي. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «فإنَّ روحَ الاستعبادِ ضيقٌ لا يتسعُ»","q":"حدّد نوع الصورة الفنية في: «روح الاستعباد ضيق لا يتسع».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الاستعباد بإنسان له روح ضيقة، فحذف المشبه به وأبقى شيئاً من لوازمه (الروح). فنوعها: استعارة مكنية. أثرها: تبرز قسوة الاستعباد وتضييقه على الحريات.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «التي لا يكبرُ عليها الكبيرُ، ولا يصغرُ عنها الصغيرُ»","q":"حدّد نوع المحسن البديعي في: «لا يكبرُ عليها الكبيرُ، ولا يصغرُ عنها الصغيرُ».","options":["مقابلة","جناس ناقص","سجع","طباق سلب"],"exp":"قابل بين (يكبر عليها الكبير) و(يصغر عنها الصغير). فنوعها: مقابلة. أثرها: تبرز اتساع الغاية الإلهية وشمولها للجميع. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «فحبس لغ ة للمستعمر على مصير الأمة.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «تتنازع القومية … احتلال عقلي»","q":"حدّد نوع الصورة الفنية في: «تتنازع القومية».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه اللغات والقومية بأشخاص تتنازع وتتقاتل، فحذف المشبه به وأبقى شيئاً من لوازمه. فنوعها: استعارة مكنية. أثرها: تبرز الصراع الثقافي وتأثيره في العقل.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «أيقظ ضمير الأمة، وتنبيه روحها»","q":"حدّد نوع الصورة الفنية في: «أيقظ ضمير الأمة».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الأمة بإنسان له ضمير يُوقَظ وروح تُنبَّه، فحذف المشبه به وأبقى شيئاً من لوازمه. فنوعها: استعارة مكنية. أثرها: تبرز دور الدين الفعّال في إحياء المجتمعات.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «يتبرؤون من سلفهم وينسلخون من تاريخهم»","q":"حدّد نوع الصورة الفنية في: «يتبرؤون من سلفهم وينسلخون من تاريخهم».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه التاريخ بجلد يُنسلخ منه، فحذف المشبه به وأبقى شيئاً من لوازمه (ينسلخون). فنوعها: استعارة مكنية. أثرها: تبرز بشاعة التنكر للهوية.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «وثارت لها الحميَّةُ»","q":"حدّد نوع الصورة الفنية في: «ثارت لها الحمية».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الحمية بإنسان يثور ويغضب، فحذف المشبه به وأبقى شيئاً من لوازمه (ثارت). فنوعها: استعارة مكنية. أثرها: تبرز القوة والعزة والتشخيص.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «اختلت هندستها الاجتماعية وماج بعضها في بعض»","q":"حدّد نوع الصورة الفنية في: «اختلت هندستها الاجتماعية وماج بعضها في بعض».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الأمة ببناء له هندسة تختل، وشبّه الناس بأمواج يتلاطم بعضها ببعض. فنوعها: استعارة مكنية. أثرها: تبرز حالة الفوضى والاضطراب عند ضعف الدين.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «وهو الرجل الذي ينفجر في التاريخ كلما احتاجت الحياة الوطنية إلى إطلاق قنابلها للنصر»","q":"حدّد نوع الصور "],"answer":0,"exp":"يُلقى الخبر لإفادة المخاطب علماً جديداً بالحكم الذي يجهله، وهذا غرض فائدة الخبر."},{"verse":"","q":"ما المقصود بلازم الفائدة؟","options":["إفادة المخاطب أن المتكلم عالم بالحكم","إفادة المخاطب حكماً جديداً كان يجهله تماماً","التفاخر أمام المخاطب بما يعلمه المتكلم","حثّ المخاطب على طلب العلم والاجتهاد فيه"],"answer":0,"exp":"في لازم الفائدة يعلم المخاطب الحكم مسبقاً، وإنما يستفيد أن المتكلم عالم به."},{"verse":"","q":"كم غرضاً أصلياً للخبر؟ وما هما؟","options":["غرضان: فائدة الخبر ولازم الفائدة","غرضان: الفخر والمدح","ثلاثة: الابتدائي والطلبي والإنكاري","غرضان: التهديد والنصح والسخرية"],"answer":0,"exp":"للخبر غرضان أصليان هما فائدة الخبر ولازم الفائدة، وما عداهما أغراض بلاغية."},{"verse":"","q":"في فائدة الخبر لا يرمي المتكلم إلى شيء من وراء الخبر سوى:","options":["إفادة المخاطب علماً بمضمونه","إظهار أنه عالم بمضمونه فقط","الافتخار بنفسه أمام المخاطب","استعطاف المخاطب وطلب عفوه"],"answer":0,"exp":"يريد المتكلم أن يستفيد المخاطب علماً بمضمون الخبر الذي لا يعرفه."},{"verse":"","q":"في لازم الفائدة يكون المخاطب:","options":["عالماً بمضمون الخبر قبل سماعه","جاهلاً بمضمون الخبر تماماً","متردداً في صدق الخبر ويطلب اليقين","منكراً لمضمون الخبر ويجحده"],"answer":0,"exp":"المخاطب يعلم الحكم ولا يجهله، فلا يستفيد علماً بالخبر نفسه."},{"verse":"","q":"أي مما يأتي ليس من الغرضين الأصليين للخبر؟","options":["الفخر","فائدة الخبر","لازم الفائدة","إفادة المخاطب علماً بالحكم"],"answer":0,"exp":"الفخر غرض بلاغي يخرج إليه الخبر بدلالة السياق، وليس غرضاً أصلياً."},{"verse":"","q":"ماذا يستفيد المخاطب في لازم الفائدة؟","options":["أن المتكلم عالم بالحكم","علماً جديداً لم يكن يعرفه بالحكم","تصديق الخبر بتأكيده بالقسم","ثقة تامة بأن الخبر صحيح"],"answer":0,"exp":"المخاطب لا يستفيد علماً بالخبر لأنه يعلمه، وإنما يعلم أن المتكلم عالم به."},{"verse":"","q":"تُلقى الأخبار العلمية في الكتب والصحف اليومية غالباً لغرض:","options":["فائدة الخبر","لازم الفائدة","التهديد والوعيد","الاسترحام والاستعطاف"],"answer":0,"exp":"الحقائق التي تشتمل عليها الكتب والصحف تُلقى لإفادة القراء علماً بها، فهي فائدة الخبر."},{"verse":"","q":"يأتي لازم الفائدة غالباً في مواضع:","options":["المدح واللوم والعتاب وما أشبهها","نقل الأخبار العلمية الجديدة","تعليم التلاميذ حقائق لم يعرفوها","إلقاء نشرات الأخبار على المستمعين"],"answer":0,"exp":"يأتي لازم الفائدة حين يخبر شخص آخر بعمل يعلمه الآخر ليبين أنه عالم به كالمدح واللوم والعتاب."},{"verse":"","q":"إذا قال تلميذ لمعلمه قاعدة شرحها له، فالغرض الأصلي لخبره:","options":["لازم الفائدة، لأن المعلم يعلمها","فائدة الخبر، لأن المعلم يجهلها","لازم الفائدة، لأن التلميذ يجهلها","فائدة الخبر، لأن التلميذ يعلمها"],"answer":0,"exp":"المعلم يعلم القاعدة، والتلميذ يُظهر له علمه بها فقط."}],"a":[{"verse":"وُلد النبيُّ -صلى الله عليه وسلم- عامَ الفيل، وأُوحِيَ إليه في سنّ الأربعين.","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله معلم التاريخ لتلاميذ لم يسمعوا بذلك من قبل.","options":["فائدة الخبر","لازم الفائدة","الفخر","المدح"],"answer":0,"exp":"يقوله معلم التاريخ لتلاميذ لم يسمعوا بذلك من قبل؛ فالمخاطب يجهل تاريخ مولد النبي ﷺ وبعثته، فالغرض: فائدة الخبر."},{"verse":"إنكَ لتكظمُ الغيظَ، وتحلمُ عند الغضب، وتعفو مع القدرة.","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله متكلم لمن يعرف خصال نفسه جيداً.","options":["لازم الفائدة","فائدة الخبر","التحسر","التهديد"],"answer":0,"exp":"يقوله متكلم لمن يعرف خصال نفسه جيداً؛ فالمخاطب يعلم خصال المخاطب نفسه، فالغرض: لازم الفائدة."},{"verse":"الأرضُ جرمٌ بيضويُّ الشكل دائمُ الدوران حول نفسه وحول الشمس.","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله معلم العلوم لتلاميذ يتعلمون ذلك لأول مرة.","options":["فائدة الخبر","لازم الفائدة","النصح","السخرية"],"answer":0,"exp":"يقوله معلم العلوم لتلاميذ يتعلمون ذلك لأول مرة؛ فالمخاطب يجهل شكل الأرض وحركتها، فالغرض: فائدة الخبر."},{"verse":"تدوسُ بك الخيلُ الوكورَ على الذُّرَا وقد كثُرت حولَ الوكورِ المطاعمُ (المتنبي لسيف الدولة).","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله المتنبي لسيف الدولة الذي فعل ذلك بنفسه.","options":["لازم الفائدة","فائدة الخبر","الفخر","المدح"],"answer":0,"exp":"يقوله المتنبي لسيف الدولة الذي فعل ذلك بنفسه؛ فالمخاطب يعلم ما فعله سيف الدولة في حروبه، فالغرض: لازم الفائدة."},{"verse":"الماءُ سائلٌ عديمُ اللون والطعم والرائحة، ويتكوّن من الهيدروجين والأكسجين.","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يلقيه معلم الكيمياء على التلاميذ.","options":["فائدة الخبر","لازم الفائدة","التحسر","التهديد"],"answer":0,"exp":"يلقيه معلم الكيمياء على التلاميذ؛ فالمخاطب يجهل تركيب الماء، فالغرض: فائدة الخبر."},{"verse":"الماءُ يتكوّن من الهيدروجين والأكسجين (يقوله تلميذ لمعلم الكيمياء).","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله التلميذ لمعلمه الذي علّمه ذلك.","options":["لازم الفائدة","فائدة الخبر","النصح","السخرية"],"answer":0,"exp":"يقوله التلميذ لمعلمه الذي علّمه ذلك؛ فالمخاطب يعلم تركيب الماء، فالغرض: لازم الفائدة."},{"verse":"تقعُ دولةُ الكويت على الساحل الشمالي الغربي للخليج العربي.","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله معلم الجغرافيا لتلاميذ لا يعرفون موقعها.","options":["فائدة الخبر","لازم الفائدة","الفخر","المدح"],"answer":0,"exp":"يقوله معلم الجغرافيا لتلاميذ لا يعرفون موقعها؛ فالمخاطب يجهل موقع الكويت، فالغرض: فائدة الخبر."},{"verse":"وأنتَ الذي ربّيتَني ونعشتَني وأنتَ الذي أوليتَني كلَّ نعمةِ.","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله شاعر لمن أنقذه ليُظهر عرفانه.","options":["لازم الفائدة","فائدة الخبر","التحسر","التهديد"],"answer":0,"exp":"يقوله شاعر لمن أنقذه ليُظهر عرفانه؛ فالمخاطب يعلم إحسان المخاطب إلى المتكلم، فالغرض: لازم الفائدة."},{"verse":"تنقسمُ الكلمةُ في العربية إلى ثلاثة أقسام: اسم وفعل وحرف.","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله معلم النحو لتلاميذ في أول درس.","options":["فائدة الخبر","لازم الفائدة","النصح","السخرية"],"answer":0,"exp":"يقوله معلم النحو لتلاميذ في أول درس؛ فالمخاطب يجهل أقسام الكلمة، فالغرض: فائدة الخبر."},{"verse":"علّمتَني سُبُلَ الرشادِ وقدتَني للمكرُماتِ وكنتَ لي نِعمَ الأبُ.","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله شاعر لمعلمه الذي يعلم فضله عليه.","options":["لازم الفائدة","فائدة الخبر","الفخر","المدح"],"answer":0,"exp":"يقوله شاعر لمعلمه الذي ","يشربُ الطفلُ الفقيرَ."],"answer":0,"exp":"الجملة الصحيحة تجمع الأركان المطلوبة: المسند (يشربُ)، والمسند إليه (الطفلُ)، والقيد (الحليبَ)."},{"verse":"","q":"أيّ الجمل الآتية مسندها (فتحَ) ومسندها إليه (المدير) وقيدها (الباب)؟","options":["فتحَ المديرُ البابَ.","زرعَ المديرُ البابَ.","فتحَ الفنانُ البابَ.","فتحَ المديرُ الجدارَ."],"answer":0,"exp":"الجملة الصحيحة تجمع الأركان المطلوبة: المسند (فتحَ)، والمسند إليه (المديرُ)، والقيد (البابَ)."}]}},"full":{"title":"الاختبارات الشاملة للبلاغة والتذوق","icon":"fa-trophy","mix":{"oc":1,"ot":1,"oa":1,"or":1,"ee":1,"et":1,"ea":1,"er":1},"pool":{"oc":[{"verse":"إنكَ لتكظمُ الغيظَ، وتحلمُ عند الغضب، وتعفو مع القدرة.","q":"أي المواقف الآتية يجعل هذا الخبر من لازم الفائدة؟","options":["يقوله متكلم لمن يعرف خصال نفسه جيداً","يقوله لمن يسمع به لأول مرة","يقوله لمن لا يعرف شيئاً عن الموضوع","يقوله لمن يسأل عن الحقيقة وهو جاهل بها"],"answer":0,"exp":"الموقف الصحيح هو: يقوله متكلم لمن يعرف خصال نفسه جيداً؛ لأن المخاطب فيه يعلم الحكم، فالغرض لازم الفائدة."},{"verse":"","q":"تريد أن تعبّر عن غرض «الفخر». اختر العبارة الأنسب لتحقيق هذا الغرض.","options":["ومكارمي عددُ النجوم ومنزلي *** مأوى الكرام ومنزلُ الأضياف (أبو فراس)","دعوتُك عند انقطاعِ الرجاءِ *** والموتُ منّي كحبلِ الوريدِ (المتنبي)","عليلُ الجسمِ ممتنعُ القيامِ *** شديدُ السُّكرِ من غيرِ المُدامِ (المتنبي)","حملتَ أنفاً يراه الناسُ كلّهم *** من ألفِ ميلٍ عياناً لا بمقياسِ (ابن الرومي)"],"answer":0,"exp":"العبارة الأنسب هي الشاهد الذي يحقق غرض الفخر؛ إذ إن قائله يعدّد مكارمه ويفتخر بكرمه وضيافته."},{"verse":"","q":"تريد أن تخبر مخاطباً خالي الذهن لم يسمع بالأمر من قبل. اختر الصياغة الأنسب للخبر عن الصدق.","options":["الصدقُ منجاةٌ.","إنَّ الصدقَ منجاةٌ.","إنَّ الصدقَ لَمنجاةٌ.","واللهِ إنَّ الصدقَ لَمنجاةٌ."],"answer":0,"exp":"المخاطب هنا خالي الذهن لم يسمع بالأمر من قبل؛ فالخبر ابتدائي، ويُلقى خالياً من التوكيد."},{"verse":"","q":"تقول جملة عن الصدق لمن ينكر الحكم وبين يديه أدلة واضحة عليه تغني عن التوكيد. اختر الصياغة الأنسب لحاله.","options":["الصدقُ منجاةٌ.","إنَّ الصدقَ منجاةٌ.","إنَّ الصدقَ لَمنجاةٌ.","واللهِ إنَّ الصدقَ لَمنجاةٌ."],"answer":0,"exp":"تنزيل المنكر منزلة غير المنكر؛ فالصياغة المناسبة خالية من التوكيد."},{"verse":"","q":"أيّ الجمل الآتية مسندها (يقرأ) ومسندها إليه (الطالب) وقيدها (القصة)؟","options":["يقرأ الطالبُ القصةَ.","يحترمُ الطالبُ القصةَ.","يقرأ الجارُ القصةَ.","يقرأ الطالبُ النشيدَ."],"answer":0,"exp":"الجملة الصحيحة تجمع الأركان المطلوبة: المسند (يقرأ)، والمسند إليه (الطالبُ)، والقيد (القصةَ)."},{"verse":"وُلد النبيُّ -صلى الله عليه وسلم- عامَ الفيل، وأُوحِيَ إليه في سنّ الأربعين.","q":"أي المواقف الآتية يجعل هذا الخبر من فائدة الخبر؟","options":["يقوله معلم التاريخ لتلاميذ لم يسمعوا بذلك من قبل","يقوله لمن علّمه إياه ليُظهر له أنه يعلمه","يقوله لمن يعلمه جيداً ليبيّن أنه عالم به","يقوله لمن يعرف مضمونه تماماً ليُظهر علمه به"],"answer":0,"exp":"الموقف الصحيح هو: يقوله معلم التاريخ لتلاميذ لم يسمعوا بذلك من قبل؛ لأن المخاطب فيه يجهل الحكم، فالغرض فائدة الخبر."},{"verse":"","q":"تريد أن تعبّر عن غرض «المدح». اختر العبارة الأنسب لتحقيق هذا الغرض.","options":["فإنكَ شمسٌ والملوكُ كواكبٌ *** إذا طلعتْ لم يبدُ منهنّ كوكبُ","أتيتُ جُرماً شنيعاً وأنت للعفوِ أهلُ *** فإن عفوتَ فمنٌّ وإن قتلتَ فعدلُ","وما نيلُ المطالبِ بالتمنّي *** ولكن تُؤخذُ الدنيا غِلابا (شوقي)","إنّ شرَّ الجُناةِ في الأرضِ نفسٌ *** تتوقّى قبلَ الرحيلِ الرحيلا (أبو ماضي)"],"answer":0,"exp":"العبارة الأنسب هي الشاهد الذي يحقق غرض المدح؛ إذ إن قائله يرفع الممدوح فوق الملوك كما تعلو الشمس الكواكب."},{"verse":"","q":"تريد أن تخبر مخاطباً متردداً يسأل عن صحة الأمر. اختر الصياغة الأنسب للخبر عن العلم.","options":["إنَّ العلمَ نورٌ.","العلمُ نورٌ.","إنَّ العلمَ لَنورٌ.","واللهِ إنَّ العلمَ لَنورٌ."],"answer":0,"exp":"المخاطب هنا متردداً يسأل عن صحة الأمر؛ فالخبر طلبي، ويحسن توكيده بمؤكد واحد."},{"verse":"","q":"تقول جملة عن العلم لمن يعلم الحكم ولكن تظهر عليه أمارات الإنكار بتركه العمل به. اختر الصياغة الأنسب لحاله.","options":["إنَّ العلمَ لَنورٌ.","العلمُ نورٌ.","إنَّ العلمَ نورٌ.","أمّا العلمُ فنورٌ."],"answer":0,"exp":"تنزيل غير المنكر منزلة المنكر؛ فالصياغة المناسبة مؤكدة بمؤكدين (إنّ واللام)."},{"verse":"","q":"أيّ الجمل الآتية مسندها (كتبَ) ومسندها إليه (الشاعر) وقيدها (قصيدةً)؟","options":["كتبَ الشاعرُ قصيدةً.","رسمَ الشاعرُ قصيدةً.","كتبَ العاملُ قصيدةً.","كتبَ الشاعرُ الحليبَ."],"answer":0,"exp":"الجملة الصحيحة تجمع الأركان المطلوبة: المسند (كتبَ)، والمسند إليه (الشاعرُ)، والقيد (قصيدةً)."},{"verse":"تدوسُ بك الخيلُ الوكورَ على الذُّرَا وقد كثُرت حولَ الوكورِ المطاعمُ (المتنبي لسيف الدولة).","q":"أي المواقف الآتية يجعل هذا الخبر من لازم الفائدة؟","options":["يقوله المتنبي لسيف الدولة الذي فعل ذلك بنفسه","يقوله لمن يسمع به لأول مرة","يقوله لمن لا يعرف شيئاً عن الموضوع","يقوله لمن يسأل عن الحقيقة وهو جاهل بها"],"answer":0,"exp":"الموقف الصحيح هو: يقوله المتنبي لسيف الدولة الذي فعل ذلك بنفسه؛ لأن المخاطب فيه يعلم الحكم، فالغرض لازم الفائدة."},{"verse":"","q":"تريد أن تعبّر عن غرض «الاسترحام والاستعطاف». اختر العبارة الأنسب لتحقيق هذا الغرض.","options":["فمالي حيلةٌ إلا رجائي *** لعفوكَ إن عفوتَ وحُسنُ ظنّي","هو البحرُ من أيّ النواحي أتيتَه *** فلُجّتُه المعروفُ والجودُ ساحلُه","من أعياه داؤه فعندي دواؤه، ومن استطال أجلَه فعليَّ أن أعجِّلَه (الحجاج)","سبحانَ اللهِ العظيم."],"answer":0,"exp":"العبارة الأنسب هي الشاهد الذي يحقق غرض الاسترحام والاستعطاف؛ إذ إن قائله لا يملك إلا رجاء العفو."},{"verse":"","q":"تريد أن تخبر مخاطباً ينكر الأمر ويجحده. اختر الصياغة الأنسب للخبر عن الصبر.","options":["إنَّ الصبرَ لَمفتاحُ الفرجِ.","الصبرُ مفتاحُ الفرجِ.","إنَّ الصبرَ مفتاحُ الفرجِ.","أمّا الصبرُ فمفتاحُ الفرجِ."],"answer":0,"exp":"المخاطب هنا ينكر الأمر ويجحده؛ فالخبر إنكاري، ويجب توكيده بمؤكد أو أكثر."},{"verse":"","q":"تقول جملة عن الصبر لمخاطب خالي الذهن لكنه سبقته عبارة تثير تساؤله عن الخبر. اختر الصياغة الأنسب لحاله.","options":["إنَّ الصبرَ مفتاحُ الفرجِ.","الصبرُ مفتاحُ الفرجِ.","إنَّ الصبرَ لَمفتاحُ الفرجِ.","واللهِ إنَّ الصبرَ لَمفتاحُ الفرجِ."],"answer":0,"exp":"تنزيل خالي الذهن منزلة المتردد؛ فالصياغة المناسبة مؤكدة بمؤكد واحد (إنّ)."},{"verse":"","q":"أيّ الجمل الآتية مسندها (زرعَ) ومسندها إليه (الفلاح) وقيدها (الأرض)؟","options":["زرعَ الفلاحُ الأرضَ.","يساعدُ الفلاحُ الأرضَ.","زرعَ التلميذُ الأرضَ.","زرعَ الفلاحُ البابَ."],"answer":0,"exp":"الجملة الصحيحة تجمع الأركان المطلوبة: المسند (زرعَ)، والمسند إليه (الفلاحُ)، والقيد (الأرضَ)."},{"verse":"الأرضُ جرمٌ بيضويُّ الشكل دائمُ الدوران حول نفسه وحول الشمس.","q":"أي المواقف الآتية يجعل هذا الخبر من فائدة الخبر؟","options":["يقوله معلم العلوم لتلاميذ يتعلمون ذلك لأول مرة","يقوله لمن علّمه إياه ليُظهر له أنه يعلمه","يقوله لمن يعلمه جيداً ليبيّن أنه عالم به","يقوله لمن يعرف مضمونه تماماً ليُظهر علمه به"],"answer":0,"exp":"الموقف الصحيح هو: يقوله معلم العلوم لتلاميذ يتعلمون ذلك لأول مرة؛ لأن المخاطب فيه يجهل الحكم، فالغرض فائدة الخبر."},{"verse":"","q":"تريد أن تعبّر عن غرض «التحسر». اختر العبارة الأنسب لتحقيق هذا الغرض.","options":["أتاها كتابي بعد يأسٍ وترحةٍ *** فماتت سروراً بي فمتُّ بها غمّا (المتنبي)","ربِّ إني وهَنَ العظمُ منّي واشتعلَ الرأسُ شيباً (زكريا عليه السلام)","حملتَ أنفاً يراه الناسُ كلّهم *** من ألفِ ميلٍ عياناً لا بمقياسِ (ابن الرومي)","ولا أعرفُ الفحشاءَ إلا بوصفِها *** ولا أنطقُ العَوْراءَ والقلبُ مُغْضَبُ (الشريف الرضي)"],"answer":0,"exp":"العبارة الأنسب هي الشاهد الذي يحقق غرض التحسر؛ إذ إن قائله يتحسر على موت جدته قبل لقائها."},{"verse":"","q":"تريد أن تخبر مخاطباً ينكر الأمر ويجحده. اختر الصياغة الأنسب للخبر عن الكسل.","options":["إنَّ الكسلَ لَعدوُّ النجاحِ.","الكسلُ عدوُّ النجاحِ.","إنَّ الكسلَ عدوُّ النجاحِ.","أمّا الكسلُ فعدوُّ النجاحِ."],"answer":0,"exp":"المخاطب هنا ينكر الأمر ويجحده؛ فالخبر إنكاري، ويجب توكيده بمؤكد أو أكثر."},{"verse":"","q":"تقول جملة عن الكسل لمن يعلم الحكم ولكن تظهر عليه أمارات الإنكار بتركه العمل به. اختر الصياغة الأنسب لحاله.","options":["إنَّ الكسلَ لَعدوُّ النجاحِ.","الكسلُ عدوُّ النجاحِ.","إنَّ الكسلَ عدوُّ النجاحِ.","أمّا الكسلُ فعدوُّ النجاحِ."],"answer":0,"exp":"تنزيل غير المنكر منزلة المنكر؛ فالصياغة المناسبة مؤكدة بمؤكدين (إنّ واللام)."},{"verse":"","q":"أيّ الجمل الآتية مسندها (يحترمُ) ومسندها إليه (الجميع) وقيدها (المعلم)؟","options":["يحترمُ الجميعُ المعلمَ.","يبني الجميعُ المعلمَ.","يحترمُ الطفلُ المعلمَ.","يحترمُ الجميعُ القصةَ."],"answer":0,"exp":"الجملة الصحيحة تجمع الأركان المطلوبة: المسند (يحترمُ)، والمسند إليه (الجميعُ)، والقيد (المعلمَ)."},{"verse":"الماءُ يتكوّن من الهيدروجين والأكسجين (يقوله تلميذ لمعلم الكيمياء).","q":"أي المواقف الآتية يجعل هذا الخبر من لازم الفائدة؟","options":["يقوله التلميذ لمعلمه الذي علّمه ذلك","يقوله لمن يسمع به لأول مرة","يقوله لمن لا يعرف شيئاً عن الموضوع","يقوله لمن يسأل عن الحقيقة وهو جاهل بها"],"answer":0,"exp":"الموقف الصحيح هو: يقوله التلميذ لمعلمه الذي علّمه ذلك؛ لأن المخاطب فيه يعلم الحكم، فالغرض لازم الفائدة."},{"verse":"","q":"تريد أن تعبّر عن غرض «إظهار الضعف». اختر العبارة الأنسب لتحقيق هذا الغرض.","options":["عليلُ الجسمِ ممتنعُ القيامِ *** شديدُ السُّكرِ من غيرِ المُدامِ (المتنبي)","وما نيلُ المطالبِ بالتمنّي *** ولكن تُؤخذُ الدنيا غِلابا (شوقي)","إنّ شرَّ الجُناةِ في الأرضِ نفسٌ *** تتوقّى قبلَ الرحيلِ الرحيلا (أبو ماضي)","دعوتُك عند انقطاعِ الرجاءِ *** والموتُ منّي كحبلِ الوريدِ (المتنبي)"],"answer":0,"exp":"العبارة الأنسب هي الشاهد الذي يحقق غرض إظهار الضعف؛ إذ إن قائله يُظهر مرضه وعجزه عن القيام."},{"verse":"","q":"تريد أن تخبر مخاطباً خالي الذهن لم يسمع بالأمر من قبل. اختر الصياغة الأنسب للخبر عن الأمانة.","options":["الأمانةُ زينةُ الأخلاقِ.","إنَّ الأمانةَ زينةُ الأخلاقِ.","إنَّ الأمانةَ لَزينةُ الأخلاقِ.","واللهِ إنَّ الأمانةَ لَزينةُ الأخلاقِ."],"answer":0,"exp":"المخاطب هنا خالي الذهن لم يسمع بالأمر من قبل؛ فالخبر ابتدائي، ويُلقى خالياً من التوكيد."},{"verse":"","q":"تقول جملة عن الأمانة لمن ينكر الحكم وبين يديه أدلة واضحة عليه تغني عن التوكيد. اختر الصياغة الأنسب لحاله.","options":["الأمانةُ زينةُ الأخلاقِ.","إنَّ الأمانةَ زينةُ الأخلاقِ.","إنَّ الأمانةَ لَزينةُ الأخلاقِ.","واللهِ إنَّ الأمانةَ لَزينةُ الأخلاقِ."],"answer":0,"exp":"تنزيل المنكر منزلة غير المنكر؛ فالصياغة المناسبة خالية من التوكيد."},{"verse":"","q":"أيّ الجمل الآتية مسندها (رسمَ) ومسندها إليه (الفنان) وقيدها (لوحةً)؟","options":["رسمَ الفنانُ لوحةً.","حفظَ الفنانُ لوحةً.","رسمَ المديرُ لوحةً.","رسمَ الفنانُ قصيدةً."],"answer":0,"exp":"الجملة الصحيحة تجمع الأركان المطلوبة: المسند (رسمَ)، والمسند إليه (الفنانُ)، والقيد (لوحةً)."}],"ot":[{"verse":"قال تعالى: ﴿يُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَيُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ وَيُحْيِي الْأَرْضَ بَعْدَ مَوْتِهَا وَكَذَٰلِكَ تُخْرَجُونَ﴾","q":"حدّد نوع الصورة الفنية في: «وَيُحْيِي الْأَرْضَ بَعْدَ مَوْتِهَا».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الأرض الجدباء بإنسان ميت تدبّ فيه الحياة بنزول المطر، فحذف المشبّه به (الإنسان) وأبقى شيئاً من لوازمه (الإحياء). فنوعها: استعارة مكنية. أثرها: تبرز قدرة الله على إحياء الموتى والبعث يوم القيامة.","answer":0},{"verse":"كَأَنَّما هُوَ في حِلٍّ وَمُرتَحَلٍ ... مُوَكَّلٌ بِفَضاءِ اللَهِ يَذرَعُهُ","q":"حدّد نوع الصورة الفنية في: «كَأَنَّما هُوَ في حِلٍّ وَمُرتَحَلٍ … مُوَكَّلٌ بِفَضاءِ اللَهِ يَذرَعُهُ».","options":["تشبيه تمثيلي","استعارة مكنية","كناية","تشبيه بليغ"],"exp":"شبّه حالة الشاعر وعدم استقراره في السفر بحال المكلَّف بقياس أراضي الله الواسعة. فنوعها: تشبيه تمثيلي. أثرها: تبرز وتجسّد الضياع والشقاء وكثرة الترحال.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «مفتاحُ الشخصيةِ هو الأداةُ الصغيرةُ التي تفتحُ لنا أبوابَها … وهو كمفتاح البيتِ في كثير من المشابه والأغراض»","q":"حدّد نوع الصورة الفنية في: «مفتاحُ الشخصيةِ … كمفتاح البيتِ في كثير من المشابه والأغراض».","options":["تشبيه","استعارة مكنية","استعارة تصريحية","كناية"],"exp":"شبّه مفتاح الشخصية بمفتاح البيت الذي يفتح الأبواب المغلقة. فنوعها: تشبيه. أثرها: تبرز أهمية هذا المفتاح في فهم دوافع العظماء.","answer":0},{"verse":"ألا أيُّها الساعي لِيُدْرِكَ مَجْدَنا ... نأتْكَ العُلا فارْبِعْ عليكَ فَسَائِلِ","q":"حدّد نوع الصورة الفنية في: «لِيُدْرِكَ مَجْدَنا».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه المجد بشيء مادي يُسعى للحاق به، فحذف المشبه به وأبقى شيئاً من لوازمه (يُدرك). فنوعها: استعارة مكنية. أثرها: تبرز عظمة مجد الأنصار ورفعته.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «في تركيبه كعصير الشجرة»","q":"حدّد نوع الصورة الفنية في: «في تركيبه كعصير الشجرة».","options":["تشبيه","استعارة مكنية","استعارة تصريحية","كناية"],"exp":"شبّه الكائن الروحي المكتنّ في الشعب بعصير الشجرة الذي لا يُرى عمله ولكن الشجرة كلها هي عمله. فنوعها: تشبيه. أثرها: يبرز أهمية هذا الكائن الروحي الخفي وتأثيره الشامل المُحيي للأمة.","answer":0},{"verse":"قال تعالى: ﴿فَأَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَهُمْ فِي رَوْضَةٍ يُحْبَرُونَ﴾","q":"حدّد نوع الصورة الفنية في: «فَهُمْ فِي رَوْضَةٍ يُحْبَرُونَ».","options":["كناية","استعارة مكنية","تشبيه","استعارة تصريحية"],"exp":"كناية عن شدة النعيم. فنوعها: كناية. أثرها: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"قَد كانَ مُضطَلِعاً بِالخَطبِ يَحمِلُهُ ... فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ","q":"حدّد نوع الصورة الفنية في: «فَضَلَّعَت بِخُطوبِ البَينِ أَضلُعُهُ».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه خطوب البين (مصائب الفراق) بأحمال ثقيلة تكسر أضلاعه، فحذف المشبه به وأبقى شيئاً من لوازمه. فنوعها: استعارة مكنية. أثرها: تعبّر عن قسوة الفراق وتأثيره المهلك.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «لا بالكِبَر والصِّغَر، ولا بالحُسْن والدَّمامة، ولا بالفضيلة والنقيصة»","q":"حدّد نوع المحسن البديعي في: «الكِبَر والصِّغَر / الحُسْن والدَّمامة / الفضيلة والنقيصة».","options":["طباق إيجاب","جناس ناقص","سجع","طباق سلب"],"exp":"جمع بين ثلاثة أزواج من الألفاظ المتضادة. فنوعها: طباق إيجاب. أثرها: يؤكد أن مفتاح الشخصية أعمق بكثير من هذه المظاهر السطحية. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"وفينا إذا ما شُبَّتِ الحَرْبُ سادَةٌ ... كهولٌ وفِتيانٌ طوالُ الحَمائلِ","q":"حدّد نوع المحسن البديعي في: «كهولٌ / فِتيانٌ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين لفظين متضادين هما (كهولٌ) و(فِتيانٌ). فنوعها: طباق إيجاب. أثرها: يؤكد تكامل القوة والشجاعة في مجتمع المسلمين وشمولها لجميع الأعمار. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «روح الأمة»","q":"حدّد نوع الصورة الفنية في: «روح الأمة».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الأمة بإنسان له روح، فحذف المشبه به (الإنسان) وأبقى شيئاً من لوازمه (الروح). فنوعها: استعارة مكنية. أثرها: تبرز حيوية الأمة وترابطها.","answer":0},{"verse":"قال تعالى: ﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَكُم مِّن تُرَابٍ ثُمَّ إِذَا أَنتُم بَشَرٌ تَنتَشِرُونَ﴾","q":"حدّد نوع الصورة الفنية في: «ثُمَّ إِذَا أَنتُم بَشَرٌ تَنتَشِرُونَ».","options":["كناية","استعارة مكنية","تشبيه","استعارة تصريحية"],"exp":"كناية عن إعمار الأرض. فنوعها: كناية. أثرها: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"وَمَن غَدا لابِساً ثَوبَ النّعيمِ بِلا ... شُكرٍ عَلَيهِ فَعنَّه اللَهَ يَنزِعُهُ","q":"حدّد نوع المحسن البديعي في: «لابِساً / يَنزِعُهُ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين (لابِساً) و(يَنزِعُهُ) وهما متضادان. فنوعها: طباق إيجاب. أثرها: يبرز التحول السريع والمخيف من النعيم إلى الفقر. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «ثم لا تحيِّرُنا لمحةُ عينٍ كما تحيِّرُنا الذبالةُ الضئيلةُ تومِضُ لحظةً وتختفي مِنْ بعيد»","q":"حدّد نوع الصورة الفنية في: «تحيِّرُنا الذبالةُ الضئيلةُ تومِضُ لحظةً وتختفي مِنْ بعيد».","options":["تشبيه","استعارة مكنية","استعارة تصريحية","كناية"],"exp":"شبّه الشخصية الضعيفة المتقلبة بالذبالة (الشعلة الضعيفة) التي تومض وتختفي. فنوعها: تشبيه. أثرها: تبرز الشخصيات التافهة المتقلبة وتباينها مع وضوح العظماء.","answer":0},{"verse":"فمنْ يعدلُ الأذنابَ ويحكَ بالذّرا ... قد اختلَفَا بِرُّ يُحقُّ بباطِلِ","q":"حدّد نوع الصورة الفنية في: «فمنْ يعدلُ الأذنابَ ويحكَ بالذّرا».","options":["استعارة تصريحية","استعارة مكنية","تشبيه","كناية"],"exp":"شبّه قومه بالقمم العالية (الذرا) وخصومه بالأسافل (الأذناب)، فحذف المشبه وصرّح بالمشبه به. فنوعها: استعارة تصريحية. أثرها: تبرز تحقير الخصم وتجسّد الفارق الشاسع في الرفعة.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «فإنَّ روحَ الاستعبادِ ضيقٌ لا يتسعُ»","q":"حدّد نوع الصورة الفنية في: «روح الاستعباد ضيق لا يتسع».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الاستعباد بإنسان له روح ضيقة، فحذف المشبه به وأبقى شيئاً من لوازمه (الروح). فنوعها: استعارة مكنية. أثرها: تبرز قسوة الاستعباد وتضييقه على الحريات.","answer":0},{"verse":"قال تعالى: ﴿وَمِنْ آيَاتِهِ مَنَامُكُم بِاللَّيْلِ وَالنَّهَارِ وَابْتِغَاؤُكُم مِّن فَضْلِهِ﴾","q":"حدّد نوع المحسن البديعي في: «اللَّيْلِ / النَّهَارِ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين لفظين متضادين هما (اللَّيْلِ) و(النَّهَارِ). فنوعها: طباق إيجاب. أثرها: تبرز قدرة الله سبحانه في خلق الليل والنهار. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"وَالدَّهرُ يُعطي الفَتى مِن حَيثُ يَمنَعُه ... عَفواً وَيَمنَعُهُ مِن حَيثُ يُطمِعُهُ","q":"حدّد نوع الصورة الفنية في: «وَالدَّهرُ يُعطي الفَتى … وَيَمنَعُهُ».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الدهر (الزمن) بإنسان متحكّم يعطي ويمنع، فحذف المشبه به وأبقى شيئاً من لوازمه. فنوعها: استعارة مكنية. أثرها: تبرز خضوع الإنسان لتقلبات الأيام وعجزه أمامها.","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «السمنةَ فإنها عقلةٌ، والبطنةَ فإنها مكسلةٌ … ومفسدةٌ»","q":"حدّد نوع المحسن البديعي في: «عقلة / مكسلة / ومفسدة».","options":["سجع","جناس ناقص","طباق إيجاب","مقابلة"],"exp":"اتفقت الفواصل في الحرف الأخير فجاءت متوازنة. فنوعه: سجع، وأثره: يحدث جرساً موسيقياً يطرب الآذان","answer":0},{"verse":"ففرُّوا وشَدَّ الله رُكْنَ نبيِّه ... بكلِّ فتىً حامي الحقيقةِ باسلِ","q":"حدّد نوع الصورة الفنية في: «شَدَّ الله رُكْنَ نبيِّه».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه دين النبي ﷺ ودعوته ببناء له ركن يشتد ويقوى، فحذف المشبه به وأبقى شيئاً من لوازمه. فنوعها: استعارة مكنية. أثرها: تبرز قوة الإسلام وثباته بالنصر الإلهي.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «والحُكْمُ على ماضيهم بالقَتْلِ مَحْواً ونِسياناً»","q":"حدّد نوع الصورة الفنية في: «الحكم على ماضيهم بالقتل محواً ونسياناً».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الماضي بكائن حي يُقتل، فحذف المشبه به وأبقى شيئاً من لوازمه (القتل). فنوعها: استعارة مكنية. أثرها: تبرز بشاعة الاستعمار في محو الذاكرة التاريخية.","answer":0},{"verse":"قال تعالى: ﴿وَهُوَ الَّذِي يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ﴾","q":"حدّد نوع المحسن البديعي في: «يَبْدَأُ / يُعِيدُهُ».","options":["طباق إيجاب","جناس ناقص","سجع","مقابلة"],"exp":"جمع بين الفعلين المتضادين (يَبْدَأُ) و(يُعِيدُهُ). فنوعها: طباق إيجاب. أثرها: تبرز قدرة الله وسيطرته على النشأة والمآل. والطباق والمقابلة: يبرز المعنى ويوضحه ويقويه بالتضاد.","answer":0},{"verse":"يَكفيهِ مِن رَوعَةِ التَّفنيدِ أَنَّ لَهُ ... مِنَ النَّوى كُلَّ يَومٍ ما يُرَوِّعُهُ","q":"حدّد نوع المحسن البديعي في: «رَوعَةِ / يُرَوِّعُهُ».","options":["جناس ناقص","طباق إيجاب","مقابلة","سجع"],"exp":"تشابه اللفظان في أغلب الحروف واختلفا في المعنى. فنوعه: جناس ناقص، وأثره: يحدث جرساً موسيقياً يطرب الآذان","answer":0},{"verse":"من نص (مفتاح شخصية عمر): «اشتجرَ الخلافُ»","q":"حدّد نوع الصورة الفنية في: «اشتجرَ الخلافُ».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه تداخل الخلاف وكثرته باشتباك أغصان الشجر. فنوعها: استعارة مكنية. أثرها: تبرز تعقيد الخلافات وكثرتها.","answer":0},{"verse":"وفينا إذا ما شُبَّتِ الحَرْبُ سادَةٌ ... كهولٌ وفِتيانٌ طوالُ الحَمائلِ","q":"حدّد نوع الصورة الفنية في: «طوالُ الحَمائلِ».","options":["كناية","استعارة مكنية","تشبيه","استعارة تصريحية"],"exp":"كناية عن الشجاعة وقوة البنية. فنوعها: كناية. أثرها: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم. والكناية: الإتيان بالمعنى مصحوباً بالدليل في إيجاز وتجسيم.","answer":0},{"verse":"من نص (اللغة والدين والعادات): «أيقظ ضمير الأمة، وتنبيه روحها»","q":"حدّد نوع الصورة الفنية في: «أيقظ ضمير الأمة».","options":["استعارة مكنية","استعارة تصريحية","تشبيه","كناية"],"exp":"شبّه الأمة بإنسان له ضمير يُوقَظ وروح تُنبَّه، فحذف المشبه به وأبقى شيئاً من لوازمه. فنوعها: استعارة مكنية. أثرها: تبرز دور الدين الفعّال في إحياء المجتمعات.","answer":0}],"oa":[{"verse":"ومكارمي عددُ النجوم ومنزلي *** مأوى الكرام ومنزلُ الأضياف (أبو فراس)","q":"حدّد الغرض البلاغي للخبر في هذا الشاهد.","options":["الفخر","الاسترحام والاستعطاف","التحسر","المدح"],"answer":0,"exp":"يعدّد مكارمه ويفتخر بكرمه وضيافته؛ فالغرض البلاغي هو: الفخر."},{"verse":"المسلمُ أخو المسلم لا يظلمُه ولا يخذلُه","q":"بيّن ضرب الخبر في الجملة السابقة.","options":["ابتدائي","طلبي","إنكاري","الأصلي"],"answer":0,"exp":"الجملة خالية من أدوات التوكيد؛ فالخبر ابتدائي."},{"verse":"وَلَا تُخَاطِبْنِي فِي الَّذِينَ ظَلَمُوا إِنَّهُم مُّغْرَقُونَ","q":"بيّن: هل جرى الخبر على مقتضى الظاهر أم خرج عنه؟ (خطاب لنوح عليه السلام بعد نهيه)","options":["تنزيل خالي الذهن منزلة المتردد","تنزيل غير المنكر منزلة المنكر","تنزيل المنكر منزلة غير المنكر","جرى على مقتضى الظاهر"],"answer":0,"exp":"نُزِّل خالي الذهن منزلة المتردد لأن ما تقدّم الخبر أثار في نفسه تساؤلاً."},{"verse":"المؤمنُ كيّسٌ فطِنٌ.","q":"حدّد المسند في الجملة السابقة.","options":["كيّس فطِن","المؤمن","مطلباً","ينصر"],"answer":0,"exp":"الجملة اسمية؛ المسند: كيّس فطِن، والمسند إليه: المؤمن، والقيد: لا يوجد."},{"verse":"وُلد النبيُّ -صلى الله عليه وسلم- عامَ الفيل، وأُوحِيَ إليه في سنّ الأربعين.","q":"حدّد الغرض الأصلي للخبر السابق، علماً بأنه يقوله معلم التاريخ لتلاميذ لم يسمعوا بذلك من قبل.","options":["فائدة الخبر","لازم الفائدة","الفخر","المدح"],"answer":0,"exp":"يقوله معلم التاريخ لتلاميذ لم يسمعوا بذلك من قبل؛ فالمخاطب يجهل تاريخ مولد النبي ﷺ وبعثته، فالغرض: فائدة الخبر."},{"verse":"أتيتُ جُرماً شنيعاً وأنت للعفوِ أهلُ *** فإن عفوتَ فمنٌّ وإن قتلتَ فعدلُ","q":"ما الذي يدل على الغرض البلاغي للخبر في هذا الشاهد؟","options":["يطلب عفو الخليفة ورحمته","يفتخر بأدبه وتأثير كلماته","يفتخر بقومه وعزتهم وإبائهم","يتحسر على موت جدته قبل لقائها"],"answer":0,"exp":"السياق يدل على الغرض؛ إذ إن قائله يطلب عفو الخليفة ورحمته، فالغرض: الاسترحام والاستعطاف."},{"verse":"ولستَ بمستبقٍ أخاً لا تلُمُّه على شعثٍ (النابغة)","q":"حدّد أدوات التوكيد في الخبر السابق.","options":["الباء الزائدة","أمّا الشرطية","إنّ + لام الابتداء","القسم + إنّ + لام الابتداء"],"answer":0,"exp":"أداة التوكيد هي: الباء الزائدة، فالخبر طلبي."},{"verse":"اللهُ موجودٌ","q":"علّل الحالة التي جاء عليها الخبر السابق. (تقال لمن ينكر وجود الله)","options":["نُزِّل المنكر منزلة غير المنكر لأن بين يديه أدلة واضحة يتجاهلها","نُزِّل خالي الذهن منزلة المتردد لأن ما تقدّم الخبر أثار في نفسه تساؤلاً","نُزِّل غير المنكر منزلة المنكر لظهور أمارات الإنكار عليه","جرى على مقتضى الظاهر لأن المخاطب خالي الذهن فأُلقي الخبر بلا توكيد"],"answer":0,"exp":"في الكون من الأدلة الساطعة على وجود الخالق ما لو تدبره لرجع عن إنكاره؛ نُزِّل المنكر منزلة غير المنكر لأن بين يديه أدلة واضحة يتجاهلها."},{"verse":"يأبى الحُرُّ الهوانَ.","q":"أيّ التحليلات الآتية يمثل الصورة التركيبية الصحيحة للجملة؟","options":["المسند: يأبى — المسند إليه: الحر — القيد: الهوان","المسند: الحر — المسند إليه: يأبى — القيد: الهوان","المسند: يأبى — المسند إليه: الحر — القيد: لا يوجد","المسند: يأبى — المسند إليه: البغي — القيد: الهوان"],"answer":0,"exp":"الجملة فعلية؛ المسند: يأبى — المسند إليه: الحر — القيد: الهوان."},{"verse":"تدوسُ بك الخيلُ الوكورَ على الذُّرَا وقد كثُرت حولَ الوكورِ المطاعمُ (المتنبي لسيف الدولة).","q":"ما الذي استفاده المخاطب من الخبر السابق؟ (يقوله المتنبي لسيف الدولة الذي فعل ذلك بنفسه)","options":["أن المتكلم عالم بـما فعله سيف الدولة في حروبه","علماً جديداً بـما فعله سيف الدولة في حروبه لم يكن يعلمه","رغبةً في الاعتذار منه","خوفاً من تهديد المتكلم"],"answer":0,"exp":"يقوله المتنبي لسيف الدولة الذي فعل ذلك بنفسه؛ فالغرض لازم الفائدة، والمخاطب لم يستفد علماً جديداً وإنما عرف أن المتكلم عالم به."},{"verse":"أتاها كتابي بعد يأسٍ وترحةٍ *** فماتت سروراً بي فمتُّ بها غمّا (المتنبي)","q":"حدّد الغرض البلاغي للخبر في هذا الشاهد.","options":["التحسر","التهديد","السخرية","النصح"],"answer":0,"exp":"يتحسر على موت جدته قبل لقائها؛ فالغرض البلاغي هو: التحسر."},{"verse":"إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ","q":"بيّن ضرب الخبر في الجملة السابقة.","options":["إنكاري","ابتدائي","طلبي","الأصلي"],"answer":0,"exp":"الجملة مؤكدة بـ(إنّ + لام الابتداء)؛ فال
